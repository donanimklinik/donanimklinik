  <!-- Bar -->
  <rect x="530" y="298" width="130" height="14" fill="#1e3a22" rx="4"/>
  <rect x="530" y="298" width="124" height="14" fill="#ef4444" rx="4"/>
  <text x="530" y="332" fill="#A8C4B0" font-size="13" font-family="monospace">95% avg success</text>
  <text x="688" y="316" fill="#ef4444" font-size="14" font-family="monospace">Advanced</text>

