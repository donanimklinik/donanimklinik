<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Best data recovery software for Windows: Recuva is free and good for deleted files, Disk Drill recovers more file types, PhotoRec is open source for photos, R-Studio is professional grade for serious recovery">
  <defs>
