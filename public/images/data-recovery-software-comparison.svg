  <text x="400" y="380" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">&#x26A0; Golden Rule</text>
  <text x="400" y="397" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Never install recovery software on the same drive you're recovering from</text>
