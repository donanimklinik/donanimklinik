<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" role="img" aria-label="How to access router admin panel: open a browser, type 192.168.1.1 in the address bar, and log in with admin credentials">
  <defs>
    <pattern id="agrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.8"/>
    </pattern>
    <marker id="aarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#00E5A0"/>
    </marker>
  </defs>

  <rect width="780" height="210" fill="#0A130E" rx="10"/>
  <rect width="780" height="210" fill="url(#agrid)" rx="10"/>

  <text x="390" y="22" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">HOW TO ACCESS ROUTER SETTINGS</text>

  <!-- Step 1: Browser -->
  <rect x="20" y="38" width="200" height="140" fill="#111e14" rx="8" stroke="#1e3a22" stroke-width="1.5"/>
  <!-- Browser chrome -->
  <rect x="20" y="38" width="200" height="28" fill="#0d1810" rx="8"/>
  <rect x="20" y="52" width="200" height="14" fill="#0d1810"/>
  <!-- Traffic lights -->
  <circle cx="36" cy="52" r="4" fill="#1e3a22"/>
  <circle cx="50" cy="52" r="4" fill="#1e3a22"/>
  <circle cx="64" cy="52" r="4" fill="#1e3a22"/>
  <!-- Address bar -->
  <rect x="78" y="44" width="130" height="16" fill="#0A130E" rx="3" stroke="#243d28" stroke-width="1"/>
  <text x="143" y="55" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">192.168.1.1</text>
  <!-- Page content area -->
  <rect x="28" y="70" width="184" height="100" fill="#0A130E" rx="3"/>
  <!-- Login form -->
  <text x="120" y="92" fill="#F0F4F1" font-size="10" font-family="monospace" text-anchor="middle">Router Login</text>
  <rect x="44" y="100" width="152" height="16" fill="#0d1810" rx="3" stroke="#1e3a22"/>
  <text x="120" y="112" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">Username: admin</text>
  <rect x="44" y="122" width="152" height="16" fill="#0d1810" rx="3" stroke="#1e3a22"/>
  <text x="120" y="134" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">Password: ••••••••</text>
  <rect x="72" y="145" width="96" height="18" fill="#00E5A0" rx="3" opacity="0.85"/>
  <text x="120" y="157" fill="#0A130E" font-size="9" font-family="monospace" text-anchor="middle" font-weight="bold">Log In</text>
  <!-- Step label -->
  <text x="120" y="192" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">① Open browser</text>

  <!-- Arrow 1 -->
  <line x1="228" y1="115" x2="288" y2="115" stroke="#00E5A0" stroke-width="2" marker-end="url(#aarr)" opacity="0.7"/>
  <text x="258" y="108" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">connects to</text>

  <!-- Router box -->
  <rect x="292" y="38" width="180" height="140" fill="#111e14" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Antennas -->
  <line x1="335" y1="65" x2="332" y2="45" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="332" cy="43" r="2.5" fill="#3b82f6"/>
  <line x1="382" y1="65" x2="382" y2="43" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="382" cy="41" r="2.5" fill="#3b82f6"/>
  <line x1="429" y1="65" x2="432" y2="45" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="432" cy="43" r="2.5" fill="#3b82f6"/>
  <!-- Router body -->
  <rect x="306" y="65" width="152" height="56" fill="#0d1810" rx="4" stroke="#3b82f6"/>
  <circle cx="320" cy="78" r="3.5" fill="#00E5A0" opacity="0.9"/>
  <circle cx="334" cy="78" r="3.5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="348" cy="78" r="3.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="362" cy="78" r="3.5" fill="#00E5A0" opacity="0.3"/>
  <!-- Port row -->
  <rect x="312" y="96" width="140" height="14" fill="#0A130E" rx="2" stroke="#1e3a22"/>
  <rect x="316" y="98" width="20" height="10" fill="#1e3a22" rx="1"/>
  <rect x="340" y="98" width="20" height="10" fill="#1e3a22" rx="1"/>
  <rect x="364" y="98" width="20" height="10" fill="#1e3a22" rx="1"/>
  <rect x="388" y="98" width="20" height="10" fill="#3b82f6" rx="1" opacity="0.5"/>
  <!-- Label -->
  <text x="382" y="140" fill="#93c5fd" font-size="10" font-family="monospace" text-anchor="middle">WiFi Router</text>
  <!-- IP label -->
  <rect x="315" y="148" width="152" height="18" fill="#0A130E" rx="3" stroke="#243d28"/>
  <text x="391" y="161" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">IP: 192.168.1.1</text>
  <text x="382" y="192" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">② Router responds</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="115" x2="540" y2="115" stroke="#00E5A0" stroke-width="2" marker-end="url(#aarr)" opacity="0.7"/>
  <text x="510" y="108" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">opens</text>

  <!-- Admin Panel result -->
  <rect x="544" y="38" width="216" height="140" fill="#111e14" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <!-- Panel header -->
  <rect x="544" y="38" width="216" height="32" fill="#0d1810" rx="8"/>
  <rect x="544" y="56" width="216" height="14" fill="#0d1810"/>
  <text x="652" y="58" fill="#00E5A0" font-size="10" font-family="monospace" text-anchor="middle">Router Admin Panel</text>
  <!-- Nav -->
  <rect x="554" y="76" width="196" height="90" fill="#0A130E" rx="3"/>
  <rect x="558" y="80" width="52" height="12" fill="#00E5A0" rx="2" opacity="0.2"/>
  <text x="584" y="90" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">Wireless</text>
  <rect x="614" y="80" width="52" height="12" fill="#1e3a22" rx="2"/>
  <text x="640" y="90" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">Security</text>
  <rect x="670" y="80" width="52" height="12" fill="#1e3a22" rx="2"/>
  <text x="696" y="90" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">Advanced</text>
  <!-- Settings rows -->
  <rect x="558" y="98" width="186" height="10" fill="#111e14" rx="1"/>
  <text x="565" y="106" fill="#6B7F72" font-size="7.5" font-family="monospace">SSID (Network Name): MyHomeWiFi</text>
  <rect x="558" y="112" width="186" height="10" fill="#111e14" rx="1"/>
  <text x="565" y="120" fill="#6B7F72" font-size="7.5" font-family="monospace">Security: WPA2-Personal</text>
  <rect x="558" y="126" width="186" height="10" fill="#111e14" rx="1"/>
  <text x="565" y="134" fill="#6B7F72" font-size="7.5" font-family="monospace">Channel: Auto (6)</text>
  <rect x="558" y="140" width="186" height="10" fill="#111e14" rx="1"/>
  <text x="565" y="148" fill="#6B7F72" font-size="7.5" font-family="monospace">DNS: 8.8.8.8 / 8.8.4.4</text>
  <text x="652" y="192" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">③ Router settings panel</text>
</svg>
