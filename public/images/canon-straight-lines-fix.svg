<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Canon printer not printing straight lines: misaligned print head causes diagonal or wavy lines — fix by running print head alignment from Canon utilities">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" fill="#091510" rx="12"/>
  <rect width="800" height="440" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Canon Printer — Straight Lines Fix (Head Alignment)</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#1e3a22" stroke-width="1"/>

  <!-- Before vs After visual panel -->
  <rect x="20" y="56" width="360" height="230" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="80" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Before vs After Alignment</text>
  <line x1="36" y1="90" x2="364" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <!-- Before label -->
  <text x="100" y="114" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">BEFORE</text>
  <!-- wavy lines -->
  <line x1="36" y1="128" x2="164" y2="136" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="36" y1="148" x2="164" y2="141" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="36" y1="168" x2="164" y2="175" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="36" y1="188" x2="164" y2="183" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="36" y1="208" x2="164" y2="215" stroke="#ef4444" stroke-width="2.5"/>
  <text x="100" y="238" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">Wavy / diagonal lines</text>
  <text x="100" y="255" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">misaligned print head</text>

  <!-- Divider -->
  <line x1="185" y1="96" x2="185" y2="268" stroke="#1e3a22" stroke-width="1"/>

  <!-- After label -->
  <text x="280" y="114" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">AFTER</text>
  <!-- straight lines -->
  <line x1="196" y1="128" x2="348" y2="128" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="196" y1="148" x2="348" y2="148" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="196" y1="168" x2="348" y2="168" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="196" y1="188" x2="348" y2="188" stroke="#00E5A0" stroke-width="2.5"/>
  <line x1="196" y1="208" x2="348" y2="208" stroke="#00E5A0" stroke-width="2.5"/>
  <text x="280" y="238" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Perfect lines ✓</text>
  <text x="280" y="255" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">after alignment</text>

  <!-- Fix Steps panel -->
  <rect x="398" y="56" width="382" height="230" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="589" y="80" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">How to Align the Print Head</text>
  <line x1="414" y1="90" x2="764" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="116" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">①</text>
  <text x="448" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Open Canon IJ Printer Utility</text>
  <text x="448" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Windows: Start Menu → Canon IJ Utility</text>

  <line x1="414" y1="150" x2="764" y2="150" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="176" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">②</text>
  <text x="448" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Maintenance → Print Head Alignment</text>
  <text x="448" y="195" fill="#A8C4B0" font-size="13" font-family="monospace">Printer prints alignment pattern on paper</text>

  <line x1="414" y1="210" x2="764" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="236" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">③</text>
  <text x="448" y="236" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Enter best pattern number</text>
  <text x="448" y="255" fill="#A8C4B0" font-size="13" font-family="monospace">Or choose Auto-align (no input needed)</text>

  <!-- Also causes panel -->
  <rect x="20" y="302" width="760" height="80" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="326" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Other Causes of Crooked Lines</text>
  <line x1="36" y1="336" x2="764" y2="336" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="360" fill="#D4EAD8" font-size="14" font-family="monospace">Incompatible paper type loaded</text>
  <text x="36" y="378" fill="#D4EAD8" font-size="14" font-family="monospace">Paper loaded crooked in tray</text>
  <text x="420" y="360" fill="#D4EAD8" font-size="14" font-family="monospace">Damaged or low ink cartridge</text>
  <text x="420" y="378" fill="#D4EAD8" font-size="14" font-family="monospace">Clogged nozzle (run Nozzle Check first)</text>

  <!-- When to align note -->
  <rect x="20" y="398" width="760" height="34" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.5"/>
  <text x="400" y="416" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Run alignment after: moving printer, replacing any cartridge, or first-time setup</text>
  <text x="400" y="430" fill="#A8C4B0" font-size="0" font-family="monospace" text-anchor="middle"/>
</svg>
