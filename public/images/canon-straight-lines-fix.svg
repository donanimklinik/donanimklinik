<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-label="Canon printer not printing straight lines: misaligned print head causes diagonal or wavy lines — fix by running print head alignment from Canon utilities">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="270" fill="#0A130E" rx="12"/>
  <rect width="800" height="270" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">CANON NOT PRINTING STRAIGHT LINES — ALIGNMENT FIX</text>

  <!-- Print comparison -->
  <rect x="20" y="38" width="340" height="180" fill="#0d1810" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="190" y="60" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Before vs After Alignment</text>
  <line x1="36" y1="68" x2="344" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- Before: wavy lines -->
  <text x="100" y="92" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">BEFORE</text>
  <line x1="36" y1="104" x2="174" y2="112" stroke="#ef4444" stroke-width="2"/>
  <line x1="36" y1="120" x2="174" y2="114" stroke="#ef4444" stroke-width="2"/>
  <line x1="36" y1="136" x2="174" y2="142" stroke="#ef4444" stroke-width="2"/>
  <line x1="36" y1="152" x2="174" y2="148" stroke="#ef4444" stroke-width="2"/>
  <line x1="36" y1="168" x2="174" y2="174" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="194" fill="#ef4444" font-size="11" font-family="monospace" text-anchor="middle">Wavy/diagonal</text>
  <text x="100" y="208" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">misaligned heads</text>

  <line x1="185" y1="74" x2="185" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <!-- After: straight lines -->
  <text x="270" y="92" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">AFTER</text>
  <line x1="196" y1="104" x2="334" y2="104" stroke="#00E5A0" stroke-width="2"/>
  <line x1="196" y1="120" x2="334" y2="120" stroke="#00E5A0" stroke-width="2"/>
  <line x1="196" y1="136" x2="334" y2="136" stroke="#00E5A0" stroke-width="2"/>
  <line x1="196" y1="152" x2="334" y2="152" stroke="#00E5A0" stroke-width="2"/>
  <line x1="196" y1="168" x2="334" y2="168" stroke="#00E5A0" stroke-width="2"/>
  <text x="270" y="194" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle">Perfect lines ✓</text>
  <text x="270" y="208" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">after alignment</text>

  <!-- Fix steps -->
  <rect x="378" y="38" width="402" height="180" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="579" y="62" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">How to Align Print Head</text>
  <line x1="394" y1="70" x2="764" y2="70" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="92" fill="#00E5A0" font-size="12" font-family="monospace">①</text>
  <text x="414" y="92" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Open Canon IJ Printer Utility</text>
  <text x="414" y="109" fill="#93B5A0" font-size="12" font-family="monospace">Windows: from Start Menu</text>

  <line x1="394" y1="120" x2="764" y2="120" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="142" fill="#00E5A0" font-size="12" font-family="monospace">②</text>
  <text x="414" y="142" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Maintenance → Print Head Alignment</text>
  <text x="414" y="159" fill="#93B5A0" font-size="12" font-family="monospace">Prints alignment pattern on paper</text>

  <line x1="394" y1="170" x2="764" y2="170" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="192" fill="#00E5A0" font-size="12" font-family="monospace">③</text>
  <text x="414" y="192" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Enter best pattern number</text>
  <text x="414" y="209" fill="#93B5A0" font-size="12" font-family="monospace">Or: Auto-align (no input needed)</text>

  <!-- Bottom causes -->
  <rect x="20" y="230" width="760" height="32" fill="#0d1810" rx="6" stroke="#1e3a22"/>
  <text x="400" y="244" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Also causes misaligned lines: incompatible paper type, paper loaded crooked, damaged print cartridge</text>
  <text x="400" y="258" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Alignment needed after: moving printer, replacing cartridge, or first use — runs automatically if set up in utility</text>
</svg>
