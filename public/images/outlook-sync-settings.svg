<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Outlook not syncing: check sync frequency setting, update folders manually with F9, verify account connection status — IMAP sync issues vs Exchange cached mode issues">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Outlook Not Syncing — Diagnosis and Fix</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- IMAP Panel -->
  <rect x="20" y="58" width="374" height="148" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="207" y="82" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">IMAP Sync Issues</text>
  <line x1="36" y1="92" x2="378" y2="92" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="114" fill="#D4EAD8" font-size="14" font-family="monospace">Send/Receive group may be disabled:</text>
  <text x="36" y="134" fill="#A8C4B0" font-size="13" font-family="monospace">File → Account Settings → Change</text>
  <text x="36" y="152" fill="#A8C4B0" font-size="13" font-family="monospace">→ More Settings → IMAP tab</text>
  <text x="36" y="172" fill="#A8C4B0" font-size="13" font-family="monospace">→ Subscribed Folders → All Folders</text>
  <text x="36" y="196" fill="#7FB09A" font-size="12" font-family="monospace">Tip: Ctrl+Alt+S opens Send/Receive group settings</text>

  <!-- Exchange Panel -->
  <rect x="406" y="58" width="374" height="148" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="593" y="82" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Exchange Cached Mode</text>
  <line x1="422" y1="92" x2="764" y2="92" stroke="#1e3a22" stroke-width="1"/>
  <text x="422" y="114" fill="#D4EAD8" font-size="14" font-family="monospace">Old emails not showing in Outlook:</text>
  <text x="422" y="134" fill="#A8C4B0" font-size="13" font-family="monospace">Account Settings → Change → Advanced</text>
  <text x="422" y="152" fill="#A8C4B0" font-size="13" font-family="monospace">Drag "Mail to keep offline" to All</text>
  <text x="422" y="172" fill="#A8C4B0" font-size="13" font-family="monospace">Or uncheck "Use Cached Exchange Mode"</text>
  <text x="422" y="196" fill="#7FB09A" font-size="12" font-family="monospace">Note: disabling cache slows large mailboxes</text>

  <!-- Divider -->
  <line x1="40" y1="224" x2="760" y2="224" stroke="#1e3a22" stroke-width="1"/>

  <!-- Quick Fixes Panel -->
  <rect x="20" y="236" width="760" height="166" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="400" y="262" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Quick Sync Fixes</text>
  <line x1="36" y1="272" x2="764" y2="272" stroke="#1e3a22" stroke-width="1"/>

  <!-- Fix 1: F9 -->
  <rect x="40" y="284" width="158" height="104" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="119" y="316" fill="#00E5A0" font-size="32" font-family="monospace" text-anchor="middle" font-weight="bold">F9</text>
  <text x="119" y="342" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Force sync now</text>
  <text x="119" y="362" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Immediate refresh</text>
  <text x="119" y="379" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">All folders</text>

  <!-- Divider 1 -->
  <line x1="211" y1="284" x2="211" y2="388" stroke="#1e3a22" stroke-width="1"/>

  <!-- Fix 2: Restart -->
  <rect x="222" y="284" width="158" height="104" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="301" y="316" fill="#00E5A0" font-size="24" text-anchor="middle">🔁</text>
  <text x="301" y="342" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Close &amp; reopen</text>
  <text x="301" y="362" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Outlook restart</text>
  <text x="301" y="379" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Clears temp errors</text>

  <!-- Divider 2 -->
  <line x1="393" y1="284" x2="393" y2="388" stroke="#1e3a22" stroke-width="1"/>

  <!-- Fix 3: Repair Account -->
  <rect x="404" y="284" width="168" height="104" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="488" y="308" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Repair Account</text>
  <text x="488" y="328" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">File → Info</text>
  <text x="488" y="348" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ Repair button</text>
  <text x="488" y="366" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Exchange / M365</text>
  <text x="488" y="382" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Fixes auth issues</text>

  <!-- Divider 3 -->
  <line x1="585" y1="284" x2="585" y2="388" stroke="#1e3a22" stroke-width="1"/>

  <!-- Fix 4: Rebuild OST -->
  <rect x="596" y="284" width="164" height="104" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="678" y="308" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Rebuild OST File</text>
  <text x="678" y="328" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Delete .ost file</text>
  <text x="678" y="348" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">%localappdata%\</text>
  <text x="678" y="366" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Microsoft\Outlook</text>
  <text x="678" y="382" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Rebuilds on reopen</text>
</svg>
