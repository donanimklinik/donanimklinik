<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="USB flash drive recovery: diagnose if USB is detected or not — if detected use Recuva or Disk Drill, if not try different port then diskpart to check if recognized at system level">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="#0A130E" rx="12"/>
  <rect width="800" height="260" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">USB FLASH DRIVE RECOVERY — DIAGNOSIS FIRST</text>

  <!-- Decision diamond -->
  <polygon points="400,40 490,90 400,140 310,90" fill="#0d1810" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="84" fill="#f59e0b" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">USB detected</text>
  <text x="400" y="100" fill="#f59e0b" font-size="12" font-family="monospace" text-anchor="middle">in Disk Mgmt?</text>

  <!-- Yes branch -->
  <line x1="490" y1="90" x2="560" y2="90" stroke="#00E5A0" stroke-width="2"/>
  <text x="525" y="82" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">YES</text>
  <rect x="560" y="48" width="220" height="160" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="670" y="72" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Detected Path</text>
  <text x="670" y="92" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Files deleted or</text>
  <text x="670" y="108" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">drive formatted</text>
  <text x="670" y="128" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">→ Run Recuva</text>
  <text x="670" y="144" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Select the USB drive</text>
  <text x="670" y="160" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Deep scan mode</text>
  <text x="670" y="178" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle">High recovery chance ✓</text>
  <text x="670" y="196" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Or Disk Drill (free 500MB)</text>

  <!-- No branch -->
  <line x1="310" y1="90" x2="240" y2="90" stroke="#ef4444" stroke-width="2"/>
  <text x="275" y="82" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle">NO</text>
  <rect x="20" y="48" width="220" height="160" fill="#1a0d0d" rx="10" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="72" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Not Detected</text>
  <text x="130" y="94" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">① Try different USB port</text>
  <text x="130" y="112" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">② Try different PC</text>
  <text x="130" y="130" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">③ diskpart → list disk</text>
  <text x="130" y="148" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">If still not seen:</text>
  <text x="130" y="164" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle">Controller chip dead</text>
  <text x="130" y="182" fill="#ef4444" font-size="11" font-family="monospace" text-anchor="middle">Pro data recovery only</text>
  <text x="130" y="198" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">or it's truly gone</text>

  <!-- Bottom bar -->
  <rect x="20" y="222" width="760" height="28" fill="#0d1810" rx="4" stroke="#1e3a22"/>
  <text x="400" y="234" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Open Disk Management: Win+X → Disk Management — look for your USB in the lower panel</text>
  <text x="400" y="246" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">If RAW filesystem shown: DO NOT format — run recovery software first to extract files</text>
</svg>
