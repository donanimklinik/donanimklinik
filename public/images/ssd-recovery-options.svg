<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="SSD recovery after failure: SSD failures are different from HDD — TRIM command erases deleted data, no moving parts but controller fails. Check if detected in BIOS, try different port, freeze trick does not work on SSD">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">SSD Recovery — What Works, What Doesn't</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Left panel: Why SSD is harder -->
  <rect x="20" y="58" width="370" height="268" fill="#0d1e16" rx="10" stroke="#ef4444" stroke-width="1.5"/>
  <text x="205" y="82" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Why SSD Recovery Is Harder</text>
  <line x1="36" y1="92" x2="374" y2="92" stroke="#1e3a22" stroke-width="1"/>

  <text x="36" y="118" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="60" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">TRIM erases deleted data</text>
  <text x="60" y="136" fill="#A8C4B0" font-size="13" font-family="monospace">Deleted files wiped from NAND immediately</text>

  <text x="36" y="162" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="60" y="162" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Wear leveling scrambles data</text>
  <text x="60" y="180" fill="#A8C4B0" font-size="13" font-family="monospace">File fragments spread across NAND chips</text>

  <text x="36" y="206" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="60" y="206" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Silent failure — no warning</text>
  <text x="60" y="224" fill="#A8C4B0" font-size="13" font-family="monospace">No clicking sound — sudden death common</text>

  <text x="36" y="250" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="60" y="250" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Freeze trick destroys SSDs</text>
  <text x="60" y="268" fill="#A8C4B0" font-size="13" font-family="monospace">HDD trick — moisture kills SSD controller</text>

  <text x="36" y="294" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="60" y="294" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Encryption by default</text>
  <text x="60" y="312" fill="#A8C4B0" font-size="13" font-family="monospace">NVMe drives often use hardware AES</text>

  <!-- Right panel: What you can try -->
  <rect x="410" y="58" width="370" height="268" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="595" y="82" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">What You Can Try</text>
  <line x1="426" y1="92" x2="764" y2="92" stroke="#1e3a22" stroke-width="1"/>

  <text x="426" y="118" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="450" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Try different SATA/M.2 port</text>
  <text x="450" y="136" fill="#A8C4B0" font-size="13" font-family="monospace">Port failure, not drive — quick free test</text>

  <text x="426" y="162" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="450" y="162" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Check BIOS/UEFI detection</text>
  <text x="450" y="180" fill="#A8C4B0" font-size="13" font-family="monospace">If BIOS sees it, bootable USB can help</text>

  <text x="426" y="206" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="450" y="206" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Disk Drill or R-Studio</text>
  <text x="450" y="224" fill="#A8C4B0" font-size="13" font-family="monospace">If detected: scan for file signature headers</text>

  <text x="426" y="250" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="450" y="250" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Firmware reset (manufacturer)</text>
  <text x="450" y="268" fill="#A8C4B0" font-size="13" font-family="monospace">Some SSDs have safe mode in firmware</text>

  <text x="426" y="294" fill="#f59e0b" font-size="16" font-family="monospace">&#x2192;</text>
  <text x="450" y="294" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">Pro: NAND chip recovery</text>
  <text x="450" y="312" fill="#A8C4B0" font-size="13" font-family="monospace">Desolder chips — expensive last resort</text>

  <!-- Bottom note -->
  <rect x="20" y="342" width="760" height="60" fill="#0d1e16" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="366" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Best SSD Protection: Daily Cloud Backup</text>
  <text x="400" y="388" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Recovery after total SSD failure has low success rate even professionally.</text>
</svg>
