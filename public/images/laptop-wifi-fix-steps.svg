<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Laptop won't connect to WiFi: step by step fix — check airplane mode, forget and reconnect network, update WiFi driver, reset TCP/IP stack">
  <defs>
    <pattern id="g3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g3)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Laptop Won't Connect to WiFi</text>
  <text x="400" y="56" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">Step-by-step fix — try each step, stop when WiFi works</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="20" y="82" width="178" height="260" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <circle cx="109" cy="116" r="22" fill="#091510" stroke="#00E5A0" stroke-width="2"/>
  <text x="109" y="124" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">1</text>
  <text x="109" y="154" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Airplane Mode</text>
  <line x1="36" y1="166" x2="182" y2="166" stroke="#1e3a22" stroke-width="1"/>
  <text x="109" y="188" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Toggle ON then</text>
  <text x="109" y="206" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">OFF in taskbar</text>
  <text x="109" y="228" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Also check the</text>
  <text x="109" y="244" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">physical WiFi</text>
  <text x="109" y="260" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">switch (Fn+F2)</text>
  <rect x="36" y="272" width="146" height="26" fill="#0d1e16" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="109" y="290" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Fixes ~30% of cases</text>
  <text x="109" y="334" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Takes 10 seconds</text>

  <!-- Arrow 1→2 -->
  <line x1="202" y1="212" x2="220" y2="212" stroke="#2a5236" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Step 2 -->
  <rect x="222" y="82" width="178" height="260" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <circle cx="311" cy="116" r="22" fill="#091510" stroke="#00E5A0" stroke-width="2"/>
  <text x="311" y="124" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">2</text>
  <text x="311" y="154" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Forget Network</text>
  <line x1="238" y1="166" x2="384" y2="166" stroke="#1e3a22" stroke-width="1"/>
  <text x="311" y="188" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">WiFi Settings →</text>
  <text x="311" y="206" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Manage networks</text>
  <text x="311" y="228" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Forget your WiFi</text>
  <text x="311" y="244" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Reconnect fresh</text>
  <text x="311" y="260" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">re-enter password</text>
  <rect x="238" y="272" width="146" height="26" fill="#0d1e16" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="311" y="290" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Clears bad profile</text>
  <text x="311" y="334" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Corrupt saved data</text>

  <!-- Arrow 2→3 -->
  <line x1="404" y1="212" x2="422" y2="212" stroke="#2a5236" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Step 3 -->
  <rect x="424" y="82" width="178" height="260" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <circle cx="513" cy="116" r="22" fill="#091510" stroke="#00E5A0" stroke-width="2"/>
  <text x="513" y="124" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">3</text>
  <text x="513" y="154" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Update Driver</text>
  <line x1="440" y1="166" x2="586" y2="166" stroke="#1e3a22" stroke-width="1"/>
  <text x="513" y="188" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Device Manager →</text>
  <text x="513" y="206" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Network Adapters</text>
  <text x="513" y="228" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Right-click WiFi</text>
  <text x="513" y="244" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">adapter → Update</text>
  <text x="513" y="260" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">driver → Search</text>
  <rect x="440" y="272" width="146" height="26" fill="#0d1e16" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="513" y="290" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Fixes driver bugs</text>
  <text x="513" y="334" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Also try rollback</text>

  <!-- Arrow 3→4 -->
  <line x1="606" y1="212" x2="624" y2="212" stroke="#2a5236" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Step 4 (highlighted) -->
  <rect x="626" y="82" width="154" height="260" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <circle cx="703" cy="116" r="22" fill="#091510" stroke="#00E5A0" stroke-width="2"/>
  <text x="703" y="124" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">4</text>
  <text x="703" y="154" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Reset TCP/IP</text>
  <line x1="642" y1="166" x2="764" y2="166" stroke="#1e3a22" stroke-width="1"/>
  <text x="703" y="186" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">CMD as Admin:</text>
  <text x="703" y="208" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">netsh int ip reset</text>
  <text x="703" y="226" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">netsh winsock</text>
  <text x="703" y="242" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">reset</text>
  <text x="703" y="262" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Restart PC after</text>
  <rect x="642" y="272" width="124" height="26" fill="#0d1e16" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="703" y="290" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Full stack reset ✓</text>

  <!-- Bottom note -->
  <rect x="20" y="356" width="760" height="44" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="376" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">If Step 4 fails — try Windows Network Troubleshooter</text>
  <text x="400" y="394" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Right-click network icon in taskbar → Troubleshoot Problems → let Windows auto-diagnose</text>
</svg>
