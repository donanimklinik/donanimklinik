<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#091510"/>
  <text x="400" y="36" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00E5A0" text-anchor="middle">Excel File Not Opening — Fix Path</text>

  <!-- Identify error type -->
  <rect x="240" y="52" width="320" height="48" rx="8" fill="#0d1e16" stroke="#3b82f6"/>
  <text x="400" y="72" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">What do you see?</text>
  <text x="400" y="91" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Identify the error to choose the right fix</text>

  <!-- Branch left: Yellow bar / Protected View -->
  <text x="170" y="130" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Yellow bar at top</text>
  <text x="170" y="148" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">→ Protected View</text>

  <!-- Branch right: Error message -->
  <text x="620" y="130" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FBB03B" text-anchor="middle">Error message / blank screen</text>
  <text x="620" y="148" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">→ File corruption or format mismatch</text>

  <!-- Fix 1: Protected View -->
  <rect x="20" y="162" width="300" height="85" rx="8" fill="#0d1e16" stroke="#4ade80"/>
  <text x="170" y="183" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Fix 1 — Enable Editing</text>
  <line x1="40" y1="191" x2="300" y2="191" stroke="#2a5236" stroke-width="1"/>
  <text x="170" y="211" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Click the yellow bar → Enable Editing</text>
  <text x="170" y="231" font-family="Arial,sans-serif" font-size="12" fill="#FBB03B" text-anchor="middle">File came from internet or email?</text>
  <text x="170" y="239" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">This is normal — click Enable Editing</text>

  <!-- Fix 2: Open and Repair -->
  <rect x="340" y="162" width="300" height="85" rx="8" fill="#0d1e16" stroke="#FBB03B"/>
  <text x="490" y="183" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FBB03B" text-anchor="middle">Fix 2 — Open and Repair</text>
  <line x1="360" y1="191" x2="620" y2="191" stroke="#2a5236" stroke-width="1"/>
  <text x="490" y="211" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">File > Open > Browse → select file</text>
  <text x="490" y="231" font-family="Arial,sans-serif" font-size="12" fill="#FBB03B" text-anchor="middle">Open dropdown → Open and Repair</text>
  <text x="490" y="247" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">If Repair fails → click Extract Data</text>

  <!-- Fix 3: Clear Cache -->
  <rect x="20" y="262" width="235" height="80" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="137" y="283" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Fix 3 — Clear Office Cache</text>
  <line x1="40" y1="291" x2="235" y2="291" stroke="#2a5236" stroke-width="1"/>
  <text x="137" y="311" font-family="Arial,sans-serif" font-size="11" fill="#D4EAD8" text-anchor="middle">File > Options > Save</text>
  <text x="137" y="329" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Delete Cached Files → restart</text>

  <!-- Fix 4: Extension check -->
  <rect x="283" y="262" width="235" height="80" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="400" y="283" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Fix 4 — Check Extension</text>
  <line x1="303" y1="291" x2="498" y2="291" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="311" font-family="Arial,sans-serif" font-size="11" fill="#D4EAD8" text-anchor="middle">Right-click → Properties → file type</text>
  <text x="400" y="329" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Rename if extension is wrong</text>

  <!-- Fix 5: Update -->
  <rect x="546" y="262" width="234" height="80" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="663" y="283" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Fix 5 — Update Excel</text>
  <line x1="566" y1="291" x2="760" y2="291" stroke="#2a5236" stroke-width="1"/>
  <text x="663" y="311" font-family="Arial,sans-serif" font-size="11" fill="#D4EAD8" text-anchor="middle">File > Account > Update Options</text>
  <text x="663" y="329" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Update Now → restart</text>

  <text x="400" y="378" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">If Open and Repair fails: copy file to Desktop, try from new location. Google Sheets also opens corrupted .xlsx files.</text>
  <text x="400" y="406" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">Yellow bar = Protected View (normal for email/downloads) — Error message = file corruption, go to Fix 2</text>
</svg>
