<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Hotspot connected but no internet: checklist — mobile data on, signal bars, data plan not exhausted, disable VPN on host phone, forget and reconnect on client device, reset network settings">
  <defs>
    <pattern id="hng" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="460" fill="#091510" rx="12"/>
  <rect width="800" height="460" fill="url(#hng)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Hotspot Connected — No Internet</text>
  <text x="400" y="56" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">Fix checklist: host phone issues on the left · client device fixes on the right</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- LEFT PANEL: Host Phone -->
  <rect x="20" y="80" width="358" height="358" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="80" width="358" height="36" fill="#0a1525" rx="10"/>
  <rect x="20" y="104" width="358" height="12" fill="#0a1525"/>
  <text x="199" y="104" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">HOST PHONE (creating hotspot)</text>

  <!-- Checklist items -->
  <circle cx="44" cy="148" r="8" fill="#00E5A0"/>
  <text x="44" y="153" fill="#091510" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">✓</text>
  <text x="64" y="144" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Mobile data is ON</text>
  <text x="64" y="162" fill="#A8C4B0" font-size="13" font-family="monospace">Settings → Mobile Data → toggle ON</text>

  <line x1="36" y1="176" x2="362" y2="176" stroke="#1e3a22" stroke-width="1"/>

  <circle cx="44" cy="200" r="8" fill="#00E5A0"/>
  <text x="44" y="205" fill="#091510" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">✓</text>
  <text x="64" y="196" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Signal bars visible (1+ bar)</text>
  <text x="64" y="214" fill="#A8C4B0" font-size="13" font-family="monospace">No signal = no hotspot internet</text>

  <line x1="36" y1="228" x2="362" y2="228" stroke="#1e3a22" stroke-width="1"/>

  <circle cx="44" cy="252" r="8" fill="#00E5A0"/>
  <text x="44" y="257" fill="#091510" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">✓</text>
  <text x="64" y="248" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Data plan not exhausted</text>
  <text x="64" y="266" fill="#A8C4B0" font-size="13" font-family="monospace">Check carrier app or dial *data# to verify</text>

  <line x1="36" y1="280" x2="362" y2="280" stroke="#1e3a22" stroke-width="1"/>

  <rect x="36" y="292" width="326" height="54" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="52" y="314" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">⚠  Turn OFF VPN on host phone</text>
  <text x="52" y="334" fill="#A8C4B0" font-size="13" font-family="monospace">VPN on host blocks routing to clients</text>

  <rect x="36" y="356" width="326" height="54" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="52" y="378" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">⚠  Toggle hotspot OFF → wait → ON</text>
  <text x="52" y="398" fill="#A8C4B0" font-size="13" font-family="monospace">Resets the internal NAT and routing table</text>

  <!-- Middle Arrow -->
  <text x="400" y="268" fill="#3b82f6" font-size="28" font-family="monospace" text-anchor="middle">⇝</text>
  <text x="400" y="290" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">WiFi hotspot</text>
  <line x1="384" y1="258" x2="396" y2="258" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="404" y1="258" x2="416" y2="258" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- RIGHT PANEL: Client Device -->
  <rect x="422" y="80" width="358" height="358" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="422" y="80" width="358" height="36" fill="#150f00" rx="10"/>
  <rect x="422" y="104" width="358" height="12" fill="#150f00"/>
  <text x="601" y="104" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">CLIENT DEVICE (no internet)</text>

  <!-- Error indicator -->
  <rect x="438" y="124" width="326" height="52" fill="#1a0808" rx="6" stroke="#ef4444" stroke-width="1.2"/>
  <text x="601" y="146" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ Connected to hotspot — No internet</text>
  <text x="601" y="164" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Windows shows yellow triangle on WiFi icon</text>

  <line x1="438" y1="188" x2="764" y2="188" stroke="#1e3a22" stroke-width="1"/>

  <rect x="438" y="200" width="326" height="54" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="454" y="222" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">⚠  Forget network → reconnect</text>
  <text x="454" y="242" fill="#A8C4B0" font-size="13" font-family="monospace">Delete saved hotspot — re-enter password fresh</text>

  <line x1="438" y1="264" x2="764" y2="264" stroke="#1e3a22" stroke-width="1"/>

  <rect x="438" y="276" width="326" height="54" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1.2"/>
  <text x="454" y="298" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Flush DNS in CMD (as Admin):</text>
  <text x="454" y="318" fill="#93c5fd" font-size="13" font-family="monospace">ipconfig /flushdns · ipconfig /renew</text>

  <line x1="438" y1="340" x2="764" y2="340" stroke="#1e3a22" stroke-width="1"/>

  <rect x="438" y="352" width="326" height="54" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1.2"/>
  <text x="454" y="374" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Change DNS on client device:</text>
  <text x="454" y="394" fill="#93c5fd" font-size="13" font-family="monospace">Primary: 8.8.8.8 · Secondary: 8.8.4.4</text>

  <!-- Bottom summary -->
  <rect x="20" y="450" width="760" height="0" fill="none"/>
  <rect x="20" y="446" width="760" height="0" fill="none"/>

  <!-- Root causes bar -->
  <rect x="20" y="448" width="760" height="0" fill="none"/>
  <line x1="20" y1="448" x2="780" y2="448" stroke="#1e3a22" stroke-width="1"/>
</svg>
