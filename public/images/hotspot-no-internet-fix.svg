<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Hotspot connected but no internet: checklist — mobile data on, signal bars, data plan not exhausted, disable VPN on host phone, forget and reconnect on client device, reset network settings">
  <defs>
    <pattern id="hng" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="780" height="240" fill="#0A130E" rx="10"/>
  <rect width="780" height="240" fill="url(#hng)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">HOTSPOT CONNECTED BUT NO INTERNET — FIX CHECKLIST</text>

  <!-- ══ LEFT: Host phone (hotspot source) ══ -->
  <rect x="20" y="30" width="310" height="196" fill="#0d1810" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="30" width="310" height="24" fill="#0a1505" rx="8"/>
  <rect x="20" y="47" width="310" height="7" fill="#0a1505"/>
  <text x="175" y="47" fill="#3b82f6" font-size="9" font-family="monospace" text-anchor="middle">HOST PHONE (creating hotspot)</text>

  <!-- Phone illustration -->
  <rect x="130" y="58" width="90" height="148" fill="#111e14" rx="12" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="133" y="62" width="84" height="116" fill="#0A130E" rx="4"/>
  <!-- Status bar -->
  <rect x="133" y="62" width="84" height="12" fill="#0d1810" rx="4"/>
  <!-- Signal bars (4/4 green) -->
  <rect x="136" y="67" width="3" height="4" fill="#00E5A0" rx="1"/>
  <rect x="140" y="65" width="3" height="6" fill="#00E5A0" rx="1"/>
  <rect x="144" y="63" width="3" height="8" fill="#00E5A0" rx="1"/>
  <rect x="148" y="61" width="3" height="10" fill="#00E5A0" rx="1"/>
  <!-- 4G badge -->
  <text x="158" y="71" fill="#00E5A0" font-size="6" font-family="monospace">4G</text>
  <!-- Battery -->
  <rect x="204" y="64" width="10" height="6" fill="#00E5A0" rx="1"/>
  <rect x="214" y="65.5" width="2" height="3" fill="#00E5A0" rx=".5"/>

  <!-- Phone screen content -->
  <text x="175" y="88" fill="#F0F4F1" font-size="8" font-family="monospace" text-anchor="middle">Settings</text>
  <rect x="138" y="93" width="84" height="12" fill="#111e14" rx="2" stroke="#00E5A0" stroke-width="1"/>
  <text x="180" y="103" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">Personal Hotspot ● ON</text>
  <rect x="138" y="108" width="84" height="10" fill="#0d1810" rx="2"/>
  <text x="180" y="116" fill="#F0F4F1" font-size="7" font-family="monospace" text-anchor="middle">Mobile Data ● ON ✓</text>
  <rect x="138" y="121" width="84" height="10" fill="#0d1810" rx="2"/>
  <text x="180" y="129" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">VPN ○ OFF</text>
  <rect x="138" y="134" width="84" height="10" fill="#0d1810" rx="2"/>
  <text x="180" y="142" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">Data Plan: unlimited</text>
  <!-- Home button -->
  <rect x="165" y="186" width="30" height="8" fill="#1e3a22" rx="4"/>

  <!-- Check list -->
  <text x="36" y="78" fill="#00E5A0" font-size="8.5" font-family="monospace">✓  Mobile data is ON</text>
  <text x="36" y="90" fill="#6B7F72" font-size="7.5" font-family="monospace">  Not just WiFi — check Settings</text>

  <text x="36" y="108" fill="#00E5A0" font-size="8.5" font-family="monospace">✓  Signal bars visible</text>
  <text x="36" y="120" fill="#6B7F72" font-size="7.5" font-family="monospace">  1+ bar needed for hotspot</text>

  <text x="36" y="138" fill="#00E5A0" font-size="8.5" font-family="monospace">✓  Data plan not exhausted</text>
  <text x="36" y="150" fill="#6B7F72" font-size="7.5" font-family="monospace">  Check carrier app or dial *data#</text>

  <text x="36" y="168" fill="#f59e0b" font-size="8.5" font-family="monospace">⚠  Turn OFF VPN on host phone</text>
  <text x="36" y="180" fill="#6B7F72" font-size="7.5" font-family="monospace">  VPN blocks hotspot routing</text>

  <text x="36" y="198" fill="#f59e0b" font-size="8.5" font-family="monospace">⚠  Disable/re-enable hotspot</text>
  <text x="36" y="210" fill="#6B7F72" font-size="7.5" font-family="monospace">  Toggle OFF → wait 10s → ON</text>

  <!-- ══ MIDDLE ARROW ══ -->
  <text x="390" y="100" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle">⇝</text>
  <text x="390" y="115" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">WiFi hotspot</text>
  <text x="390" y="125" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">signal</text>
  <line x1="352" y1="108" x2="370" y2="108" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="408" y1="108" x2="428" y2="108" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ══ RIGHT: Client device (connecting device) ══ -->
  <rect x="450" y="30" width="310" height="196" fill="#0d1810" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="450" y="30" width="310" height="24" fill="#150f00" rx="8"/>
  <rect x="450" y="47" width="310" height="7" fill="#150f00"/>
  <text x="605" y="47" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">CLIENT DEVICE (can't get internet)</text>

  <!-- Laptop illustration -->
  <rect x="530" y="60" width="150" height="96" fill="#111e14" rx="5" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="534" y="64" width="142" height="84" fill="#0A130E" rx="2"/>
  <!-- Screen content -->
  <text x="605" y="84" fill="#ef4444" font-size="9" font-family="monospace" text-anchor="middle">⚠ No Internet</text>
  <text x="605" y="97" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">Connected to hotspot</text>
  <text x="605" y="108" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">but no internet access</text>
  <!-- WiFi icon on screen -->
  <path d="M605 118 Q593 110 581 118" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <path d="M605 118 Q593 106 581 118" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
  <path d="M599 118 Q593 112 587 118" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <path d="M596 118 Q593 115 590 118" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="593" cy="120" r="2" fill="#3b82f6"/>
  <line x1="607" y1="116" x2="619" y2="128" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="619" y1="116" x2="607" y2="128" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="530" y="156" width="150" height="6" fill="#0d1810" rx="2" stroke="#1e3a22"/>

  <!-- Fix checklist for client -->
  <text x="466" y="178" fill="#f59e0b" font-size="8.5" font-family="monospace">⚠  Forget network → reconnect</text>
  <text x="466" y="190" fill="#6B7F72" font-size="7.5" font-family="monospace">  Delete saved hotspot, re-enter PW</text>

  <text x="466" y="207" fill="#f59e0b" font-size="8.5" font-family="monospace">⚠  Flush DNS on Windows</text>
  <text x="466" y="218" fill="#6B7F72" font-size="7.5" font-family="monospace">  ipconfig /flushdns in CMD</text>

  <!-- Bottom: root causes summary -->
  <rect x="20" y="234" width="740" height="0" fill="none"/>
  <rect x="20" y="220" width="740" height="16" fill="#0d1810" rx="4" stroke="#1e3a22"/>
  <text x="390" y="231" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">Root causes: mobile data OFF · data limit reached · VPN on host · too many connected devices · carrier hotspot restriction</text>
</svg>
