<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Recover accidentally deleted files: check Recycle Bin first, then use Windows File Recovery tool, or Recuva for deeper scan — act fast before data is overwritten">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Accidentally Deleted Files — Recovery Steps</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Step 1: Recycle Bin -->
  <rect x="18" y="62" width="178" height="188" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="107" y="88" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">&#x2460; Recycle Bin</text>
  <line x1="34" y1="96" x2="180" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="107" y="118" fill="#f59e0b" font-size="26" text-anchor="middle">&#x1F5D1;</text>
  <text x="107" y="146" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Open Recycle Bin</text>
  <text x="107" y="164" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Find your file</text>
  <text x="107" y="182" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Right-click &#x2192;</text>
  <text x="107" y="200" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Restore</text>
  <text x="107" y="236" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Try this first ✓</text>
  <line x1="198" y1="156" x2="216" y2="156" stroke="#00E5A0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Ctrl+Z -->
  <rect x="218" y="62" width="168" height="188" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="302" y="88" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">&#x2461; Ctrl+Z Undo</text>
  <line x1="234" y1="96" x2="380" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="302" y="120" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Immediately press</text>
  <text x="302" y="148" fill="#93c5fd" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Ctrl + Z</text>
  <text x="302" y="172" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Works if no other</text>
  <text x="302" y="190" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">actions taken</text>
  <text x="302" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">In File Explorer only</text>
  <line x1="388" y1="156" x2="406" y2="156" stroke="#00E5A0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Windows File Recovery -->
  <rect x="408" y="62" width="178" height="188" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="497" y="84" fill="#f59e0b" font-size="15" font-family="monospace" text-anchor="middle" font-weight="bold">&#x2462; Win Recovery</text>
  <line x1="424" y1="94" x2="580" y2="94" stroke="#1e3a22" stroke-width="1"/>
  <text x="497" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Microsoft Store app</text>
  <text x="497" y="138" fill="#93c5fd" font-size="12" font-family="monospace" text-anchor="middle">winfr C: D: /regular</text>
  <text x="497" y="158" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">NTFS: regular mode</text>
  <text x="497" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">USB/SD: extensive</text>
  <text x="497" y="200" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">Free Microsoft tool</text>
  <text x="497" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Win 10 2004+</text>
  <line x1="588" y1="156" x2="606" y2="156" stroke="#00E5A0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Recuva -->
  <rect x="608" y="62" width="172" height="188" fill="#0d1e16" rx="10" stroke="#4ade80" stroke-width="1.5"/>
  <text x="694" y="88" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">&#x2463; Recuva</text>
  <line x1="624" y1="96" x2="764" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="694" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Enable Deep Scan</text>
  <text x="694" y="136" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">finds more files</text>
  <text x="694" y="158" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Free from Piriform</text>
  <text x="694" y="178" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Green dot = good</text>
  <text x="694" y="200" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">chance of recovery</text>
  <text x="694" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Last software resort</text>

  <!-- Step numbers bottom -->
  <text x="107" y="272" fill="#A8C4B0" font-size="13" font-family="mono