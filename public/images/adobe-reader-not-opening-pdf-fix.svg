<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#091510"/>
  <text x="400" y="36" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00E5A0" text-anchor="middle">Adobe Reader Not Opening PDF — Fix Methods</text>

  <!-- Problem description -->
  <rect x="150" y="55" width="500" height="44" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="400" y="74" font-family="Arial,sans-serif" font-size="13" fill="#FBB03B" text-anchor="middle">PDF files open in Chrome / Edge instead of Adobe Reader</text>
  <text x="400" y="92" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">Another app has claimed the .pdf file association</text>

  <!-- Method 1 -->
  <rect x="20" y="115" width="175" height="185" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="107" y="138" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Method 1</text>
  <text x="107" y="157" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#D4EAD8" text-anchor="middle">Right-click Fix</text>
  <line x1="35" y1="165" x2="180" y2="165" stroke="#2a5236" stroke-width="1"/>
  <text x="107" y="184" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Right-click PDF file</text>
  <text x="107" y="201" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; Open with</text>
  <text x="107" y="218" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; Choose another app</text>
  <text x="107" y="235" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Select Adobe Reader</text>
  <text x="107" y="258" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Check: Always use</text>
  <text x="107" y="275" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">this app</text>
  <text x="107" y="292" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">→ Click OK</text>

  <!-- Method 2 -->
  <rect x="213" y="115" width="175" height="185" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="300" y="138" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Method 2</text>
  <text x="300" y="157" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#D4EAD8" text-anchor="middle">Windows Settings</text>
  <line x1="228" y1="165" x2="373" y2="165" stroke="#2a5236" stroke-width="1"/>
  <text x="300" y="184" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Settings &gt; Apps</text>
  <text x="300" y="201" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; Default apps</text>
  <text x="300" y="218" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Search: .pdf</text>
  <text x="300" y="235" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Select Adobe Reader</text>
  <text x="300" y="258" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Click Set default</text>
  <text x="300" y="275" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Most reliable on</text>
  <text x="300" y="292" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Windows 11</text>

  <!-- Method 3 -->
  <rect x="406" y="115" width="175" height="185" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="493" y="138" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Method 3</text>
  <text x="493" y="157" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#D4EAD8" text-anchor="middle">Inside Reader</text>
  <line x1="421" y1="165" x2="566" y2="165" stroke="#2a5236" stroke-width="1"/>
  <text x="493" y="184" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Open Acrobat Reader</text>
  <text x="493" y="201" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Edit &gt; Preferences</text>
  <text x="493" y="218" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; General</text>
  <text x="493" y="235" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Select Default PDF</text>
  <text x="493" y="252" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Handler</text>
  <text x="493" y="275" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Choose Reader</text>
  <text x="493" y="292" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">→ Apply</text>

  <!-- Method 4 -->
  <rect x="599" y="115" width="181" height="185" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="689" y="138" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Method 4</text>
  <text x="689" y="157" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#D4EAD8" text-anchor="middle">Stop Browser Opening</text>
  <line x1="614" y1="165" x2="765" y2="165" stroke="#2a5236" stroke-width="1"/>
  <text x="689" y="184" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Chrome: Settings</text>
  <text x="689" y="201" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; Privacy &gt; Site settings</text>
  <text x="689" y="218" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; PDF documents</text>
  <text x="689" y="235" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Enable: Download PDFs</text>
  <text x="689" y="258" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">Edge: Settings &gt; Cookies</text>
  <text x="689" y="275" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">&gt; PDF documents</text>
  <text x="689" y="292" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Always download PDFs</text>

  <!-- Bottom panel -->
  <rect x="20" y="318" width="760" height="72" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="400" y="341" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Reader opens but shows an error on the file?</text>
  <text x="400" y="362" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">File association is correct — the problem is with Reader or the specific PDF file</text>
  <text x="400" y="382" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">Try Help &gt; Repair Installation, or open a different PDF to confirm Reader is working</text>
</svg>
