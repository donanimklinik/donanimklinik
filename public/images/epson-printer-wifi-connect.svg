<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Epson printer not connecting to WiFi: use WiFi Setup on printer control panel, or Epson Smart Panel app on phone — check WiFi indicator light, blue steady means connected">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="430" fill="#091510" rx="12"/>
  <rect width="800" height="430" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Epson Printer — WiFi Connection Guide</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#1e3a22" stroke-width="1"/>

  <!-- WiFi Light Status panel -->
  <rect x="20" y="56" width="230" height="230" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="80" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">WiFi Light Status</text>
  <line x1="36" y1="90" x2="234" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <circle cx="54" cy="122" r="10" fill="#00E5A0"/>
  <text x="74" y="118" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">Steady blue</text>
  <text x="74" y="137" fill="#A8C4B0" font-size="13" font-family="monospace">Connected ✓</text>

  <line x1="36" y1="155" x2="234" y2="155" stroke="#1e3a22" stroke-width="1"/>

  <circle cx="54" cy="183" r="10" fill="#f59e0b"/>
  <text x="74" y="179" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">Blinking blue</text>
  <text x="74" y="198" fill="#A8C4B0" font-size="13" font-family="monospace">Connecting...</text>

  <line x1="36" y1="215" x2="234" y2="215" stroke="#1e3a22" stroke-width="1"/>

  <circle cx="54" cy="244" r="10" fill="#ef4444"/>
  <text x="74" y="240" fill="#ef4444" font-size="14" font-family="monospace" font-weight="bold">Off or red</text>
  <text x="74" y="259" fill="#A8C4B0" font-size="13" font-family="monospace">Not connected</text>

  <!-- Setup Steps panel -->
  <rect x="266" y="56" width="310" height="230" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="421" y="80" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Setup Steps</text>
  <line x1="282" y1="90" x2="560" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="290" y="116" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">①</text>
  <text x="316" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Settings → WiFi Setup</text>
  <text x="316" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">On printer touchscreen or buttons</text>

  <line x1="282" y1="150" x2="560" y2="150" stroke="#1e3a22" stroke-width="1"/>

  <text x="290" y="176" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">②</text>
  <text x="316" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">WiFi Setup Wizard</text>
  <text x="316" y="195" fill="#A8C4B0" font-size="13" font-family="monospace">Select network → enter password</text>

  <line x1="282" y1="210" x2="560" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <text x="290" y="236" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">③</text>
  <text x="316" y="236" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Print Connection Check</text>
  <text x="316" y="255" fill="#A8C4B0" font-size="13" font-family="monospace">Settings → Network Status → Print</text>
  <text x="316" y="272" fill="#7FB09A" font-size="12" font-family="monospace">Shows IP + WiFi connection status</text>

  <!-- Quick Fixes panel -->
  <rect x="592" y="56" width="188" height="230" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="686" y="80" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Quick Fixes</text>
  <line x1="608" y1="90" x2="764" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="616" y="116" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="638" y="116" fill="#D4EAD8" font-size="14" font-family="monospace">WPS button</text>
  <text x="638" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Router first, then printer</text>

  <line x1="608" y1="152" x2="764" y2="152" stroke="#1e3a22" stroke-width="1"/>

  <text x="616" y="178" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="638" y="178" fill="#D4EAD8" font-size="14" font-family="monospace">Smart Panel app</text>
  <text x="638" y="197" fill="#A8C4B0" font-size="13" font-family="monospace">Guided phone setup</text>

  <line x1="608" y1="214" x2="764" y2="214" stroke="#1e3a22" stroke-width="1"/>

  <text x="616" y="240" fill="#f59e0b" font-size="16" font-family="monospace">→</text>
  <text x="638" y="240" fill="#D4EAD8" font-size="14" font-family="monospace">Network reset:</text>
  <text x="638" y="259" fill="#A8C4B0" font-size="13" font-family="monospace">Settings → Restore</text>
  <text x="638" y="276" fill="#A8C4B0" font-size="13" font-family="monospace">Network Settings</text>

  <!-- 2.4 GHz note -->
  <rect x="20" y="302" width="760" height="56" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="326" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Important: Epson Printers Use 2.4 GHz Only</text>
  <line x1="36" y1="336" x2="764" y2="336" stroke="#1e3a22" stroke-width="1"/>
  <text x="400" y="354" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">If your router broadcasts 5 GHz only, enable the 2.4 GHz band in router admin settings</text>

  <!-- Epson Smart Panel detail -->
  <rect x="20" y="374" width="760" height="46" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.5"/>
  <text x="400" y="396" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Epson Smart Panel App: connects printer via Bluetooth first, then transfers WiFi credentials automatically</text>
  <text x="400" y="414" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Available free on App Store and Google Play — easiest setup method for Epson printers</text>
</svg>
