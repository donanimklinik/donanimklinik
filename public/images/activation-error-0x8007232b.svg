<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Windows activation error 0x8007232B: DNS name does not exist — Windows cannot find KMS server via DNS lookup. Fix by entering KMS server address manually or switching to MAK key">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Main title -->
  <text x="400" y="38" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Error 0x8007232B — DNS Name Does Not Exist</text>
  <line x1="40" y1="50" x2="760" y2="50" stroke="#1e3a22" stroke-width="1"/>

  <!-- Subtitle / explanation -->
  <text x="400" y="68" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Windows has a Volume License key and searches for a KMS server via DNS — but no SRV record is found.</text>

  <!-- Flow diagram: PC → DNS → KMS (failed) -->
  <!-- PC Box -->
  <rect x="20" y="84" width="170" height="120" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="108" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Your PC</text>
  <line x1="36" y1="114" x2="174" y2="114" stroke="#1e3a22" stroke-width="1"/>
  <text x="105" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Volume key</text>
  <text x="105" y="150" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Asks DNS for</text>
  <text x="105" y="168" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">_vlmcs._tcp</text>
  <text x="105" y="186" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">SRV record</text>

  <!-- Arrow PC → DNS (failing) -->
  <line x1="192" y1="144" x2="258" y2="144" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <text x="225" y="134" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">DNS query</text>
  <text x="225" y="158" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">FAILS</text>

  <!-- DNS Box -->
  <rect x="260" y="84" width="170" height="120" fill="#0d1e16" rx="10" stroke="#ef4444" stroke-width="1.5"/>
  <text x="345" y="108" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">DNS Server</text>
  <line x1="276" y1="114" x2="414" y2="114" stroke="#1e3a22" stroke-width="1"/>
  <text x="345" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">No SRV record</text>
  <text x="345" y="150" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">for _vlmcs._tcp</text>
  <text x="345" y="172" fill="#ef4444" font-size="20" text-anchor="middle">✕</text>
  <text x="345" y="196" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">Record missing</text>

  <!-- Arrow DNS → Error -->
  <line x1="345" y1="206" x2="345" y2="230" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Error result box -->
  <rect x="260" y="232" width="170" height="64" fill="#0d1e16" rx="8" stroke="#ef4444" stroke-width="1.5"/>
  <text x="345" y="254" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">0x8007232B</text>
  <text x="345" y="272" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">"DNS name does</text>
  <text x="345" y="288" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">not exist"</text>

  <!-- Fixes panel -->
  <rect x="450" y="84" width="330" height="212" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="615" y="108" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Fixes</text>
  <line x1="466" y1="116" x2="764" y2="116" stroke="#1e3a22" stroke-width="1"/>

  <text x="466" y="138" fill="#00E5A0" font-size="14" font-family="monospace">✓</text>
  <text x="486" y="138" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Set KMS server manually</text>
  <text x="486" y="155" fill="#93c5fd" font-size="13" font-family="monospace">slmgr /skms kms.domain.com:1688</text>
  <text x="486" y="171" fill="#A8C4B0" font-size="13" font-family="monospace">then: slmgr /ato (as Admin)</text>

  <line x1="466" y1="181" x2="764" y2="181" stroke="#1e3a22" stroke-width="1"/>

  <text x="466" y="203" fill="#00E5A0" font-size="14" font-family="monospace">✓</text>
  <text x="486" y="203" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Connect to corporate VPN</text>
  <text x="486" y="221" fill="#A8C4B0" font-size="13" font-family="monospace">KMS server lives on company LAN</text>
  <text x="486" y="237" fill="#A8C4B0" font-size="13" font-family="monospace">VPN makes it reachable remotely</text>

  <line x1="466" y1="247" x2="764" y2="247" stroke="#1e3a22" stroke-width="1"/>

  <text x="466" y="269" fill="#00E5A0" font-size="14" font-family="monospace">✓</text>
  <text x="486" y="269" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Ask IT for a MAK key</text>
  <text x="486" y="287" fill="#A8C4B0" font-size="13" font-family="monospace">Multiple Activation Key works</text>
  <text x="486" y="303" fill="#A8C4B0" font-size="13" font-family="monospace">offline — no DNS or KMS needed</text>

  <!-- Bottom note: KMS vs MAK explanation -->
  <rect x="20" y="312" width="760" height="96" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="400" y="336" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">KMS vs. MAK — Key Differences</text>
  <line x1="36" y1="344" x2="764" y2="344" stroke="#1e3a22" stroke-width="1"/>

  <text x="200" y="366" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">KMS (Volume)</text>
  <text x="200" y="384" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Needs KMS server every 180 days</text>
  <text x="200" y="400" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Fails if off corporate network</text>

  <line x1="400" y1="352" x2="400" y2="400" stroke="#1e3a22" stroke-width="1"/>

  <text x="590" y="366" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">MAK (Multiple Activation)</text>
  <text x="590" y="384" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Activates once directly with MS</text>
  <text x="590" y="400" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Works fully offline ✓</text>
</svg>
