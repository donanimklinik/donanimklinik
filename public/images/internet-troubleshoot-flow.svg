<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Internet connection troubleshooting flowchart: check cables, check modem lights, reboot sequence, check WAN LED, check router settings, contact ISP">
  <defs>
    <pattern id="itg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="ita" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity="0.9"/>
    </marker>
    <marker id="itan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#ef4444" opacity="0.9"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#091510" rx="12"/>
  <rect width="800" height="500" fill="url(#itg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Internet Not Working — Troubleshoot Flowchart</text>
  <text x="400" y="56" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">Follow each question in order — YES continues right, NO shows the fix</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- START node -->
  <rect x="280" y="80" width="240" height="36" fill="#1a0808" rx="18" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="103" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">No Internet Connection</text>

  <!-- Arrow down -->
  <line x1="400" y1="116" x2="400" y2="140" stroke="#2a5236" stroke-width="1.5" marker-end="url(#ita)"/>

  <!-- Q1: Cables secure? -->
  <rect x="260" y="142" width="280" height="36" fill="#0d1e16" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="161" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Q1: All cables firmly plugged in?</text>

  <!-- YES right -->
  <line x1="540" y1="160" x2="598" y2="160" stroke="#2a5236" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="568" y="152" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">YES</text>

  <!-- NO down -->
  <line x1="400" y1="178" x2="400" y2="198" stroke="#2a5236" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="416" y="192" fill="#ef4444" font-size="13" font-family="monospace">NO</text>
  <rect x="296" y="200" width="208" height="32" fill="#1a0808" rx="4" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="221" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Re-seat all cables → retry Q1</text>
  <!-- loop arrow back -->
  <line x1="296" y1="216" x2="270" y2="216" stroke="#2a5236" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="216" x2="270" y2="160" stroke="#2a5236" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="160" x2="258" y2="160" stroke="#2a5236" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ita)"/>

  <!-- Q2: Modem Online LED solid? -->
  <rect x="600" y="142" width="180" height="46" fill="#0d1e16" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="690" y="160" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Q2: Modem</text>
  <text x="690" y="178" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">Online LED solid?</text>

  <!-- YES from Q2: arrow down -->
  <line x1="690" y1="188" x2="690" y2="228" stroke="#2a5236" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="704" y="212" fill="#00E5A0" font-size="13" font-family="monospace">YES</text>

  <!-- NO from Q2: reboot action -->
  <line x1="600" y1="165" x2="560" y2="165" stroke="#2a5236" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#itan)"/>
  <text x="578" y="158" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">NO</text>

  <!-- Reboot sequence -->
  <rect x="20" y="140" width="228" height="76" fill="#0d1e16" rx="6" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="134" y="160" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Reboot Sequence:</text>
  <text x="134" y="178" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">1. Unplug modem — wait 60s</text>
  <text x="134" y="194" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">2. Plug modem — wait 2 min</text>
  <text x="134" y="210" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">3. Then plug router</text>
  <!-- Arrow from reboot back to Q2 -->
  <line x1="248" y1="165" x2="598" y2="165" stroke="#2a5236" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ita)"/>

  <!-- Q3: WAN LED green? -->
  <rect x="576" y="230" width="228" height="36" fill="#0d1e16" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="690" y="254" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Q3: Router WAN LED green?</text>

  <!-- YES from Q3 → down -->
  <line x1="690" y1="266" x2="690" y2="306" stroke="#2a5236" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="704" y="290" fill="#00E5A0" font-size="13" font-family="monospace">YES</text>

  <!-- NO from Q3 → left to action -->
  <line x1="576" y1="248" x2="490" y2="248" stroke="#2a5236" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="532" y="240" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">NO</text>

  <!-- Action: Check router WAN settings -->
  <rect x="270" y="232" width="212" height="44" fill="#0d1e16" rx="6" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="376" y="252" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Check router WAN settings</text>
  <text x="376" y="268" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Set type: DHCP or PPPoE?</text>

  <!-- Q4: Device WiFi connected? -->
  <rect x="568" y="308" width="244" height="46" fill="#0d1e16" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="690" y="328" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Q4: Device shows</text>
  <text x="690" y="346" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">WiFi connected + page loads?</text>

  <!-- YES → Done -->
  <line x1="690" y1="354" x2="690" y2="396" stroke="#2a5236" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="704" y="380" fill="#00E5A0" font-size="13" font-family="monospace">YES</text>

  <!-- NO → ISP -->
  <line x1="568" y1="331" x2="490" y2="331" stroke="#2a5236" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="528" y="323" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">NO</text>

  <!-- Action: Contact ISP -->
  <rect x="270" y="312" width="212" height="44" fill="#1a0808" rx="6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="376" y="332" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Contact your ISP</text>
  <text x="376" y="350" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Possible line or account issue</text>

  <!-- FIXED box -->
  <rect x="600" y="398" width="180" height="44" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="690" y="426" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Internet Fixed ✓</text>

  <!-- Legend -->
  <rect x="20" y="420" width="530" height="44" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="36" y="438" fill="#A8C4B0" font-size="13" font-family="monospace" font-weight="bold">Legend:</text>
  <rect x="100" y="428" width="26" height="14" fill="#0d1e16" rx="3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="132" y="440" fill="#A8C4B0" font-size="13" font-family="monospace">Decision</text>
  <rect x="220" y="428" width="26" height="14" fill="#0d1e16" rx="3" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="252" y="440" fill="#A8C4B0" font-size="13" font-family="monospace">Action / Fix</text>
  <rect x="360" y="428" width="26" height="14" fill="#1a0808" rx="3" stroke="#ef4444" stroke-width="1.5"/>
  <text x="392" y="440" fill="#A8C4B0" font-size="13" font-family="monospace">Problem / Error</text>
  <text x="36" y="458" fill="#7FB09A" font-size="12" font-family="monospace">Green arrows = YES path · Red arrows = NO path · Dashed lines = retry loops</text>
</svg>
