<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-label="Internet connection troubleshooting flowchart: check cables, check modem lights, reboot sequence, check WAN LED, check router settings, contact ISP">
  <defs>
    <pattern id="itg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
    <marker id="ita" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity=".8"/>
    </marker>
    <marker id="itan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#ef4444" opacity=".8"/>
    </marker>
  </defs>
  <rect width="780" height="310" fill="#0A130E" rx="10"/>
  <rect width="780" height="310" fill="url(#itg)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">INTERNET NOT WORKING — TROUBLESHOOT FLOWCHART</text>

  <!-- ── START ── -->
  <rect x="310" y="30" width="160" height="28" fill="#1a0d0d" rx="14" stroke="#ef4444" stroke-width="1.5"/>
  <text x="390" y="48" fill="#ef4444" font-size="9.5" font-family="monospace" text-anchor="middle">No Internet Connection</text>

  <!-- Arrow down -->
  <line x1="390" y1="58" x2="390" y2="72" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#ita)"/>

  <!-- Q1: Cables secure? -->
  <rect x="286" y="74" width="208" height="26" fill="#0d1810" rx="4" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="390" y="89" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Are all cables firmly plugged in?</text>

  <!-- YES: arrow right from Q1 -->
  <line x1="494" y1="87" x2="560" y2="87" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="527" y="82" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">YES</text>

  <!-- NO: check cables action -->
  <line x1="390" y1="100" x2="390" y2="114" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="404" y="110" fill="#ef4444" font-size="7.5" font-family="monospace">NO</text>
  <rect x="316" y="116" width="148" height="22" fill="#1a0d0d" rx="3" stroke="#ef4444" stroke-width="1"/>
  <text x="390" y="130" fill="#F0F4F1" font-size="8" font-family="monospace" text-anchor="middle">Re-seat all cables → retry</text>
  <!-- action arrow back up (loop) -->
  <line x1="316" y1="127" x2="296" y2="127" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="296" y1="127" x2="296" y2="87" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="296" y1="87" x2="284" y2="87" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ita)"/>

  <!-- Q2: Modem Online LED solid? (top right branch) -->
  <rect x="562" y="74" width="198" height="26" fill="#0d1810" rx="4" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="661" y="86" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Modem Online LED solid?</text>
  <text x="661" y="96" fill="#4a5e4e" font-size="7.5" font-family="monospace" text-anchor="middle">(green or white — check modem)</text>

  <!-- YES from Q2: arrow down -->
  <line x1="661" y1="100" x2="661" y2="138" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="675" y="123" fill="#00E5A0" font-size="7.5" font-family="monospace">YES</text>

  <!-- NO from Q2: action -->
  <line x1="562" y1="87" x2="460" y2="87" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#itan)"/>
  <text x="510" y="82" fill="#ef4444" font-size="7.5" font-family="monospace" text-anchor="middle">NO</text>
  <!-- Reboot modem action box - below in center -->

  <!-- Q3: WAN LED green on router? -->
  <rect x="556" y="140" width="210" height="26" fill="#0d1810" rx="4" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="661" y="155" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Router WAN LED green?</text>

  <!-- YES from Q3 → Internet should work -->
  <line x1="661" y1="166" x2="661" y2="200" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="675" y="188" fill="#00E5A0" font-size="7.5" font-family="monospace">YES</text>

  <!-- NO from Q3 → check router -->
  <line x1="556" y1="153" x2="446" y2="153" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="500" y="148" fill="#ef4444" font-size="7.5" font-family="monospace" text-anchor="middle">NO</text>

  <!-- Action: Check router WAN settings -->
  <rect x="270" y="143" width="172" height="28" fill="#0d1810" rx="4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="356" y="155" fill="#3b82f6" font-size="8" font-family="monospace" text-anchor="middle">Check router WAN settings</text>
  <text x="356" y="165" fill="#4a5e4e" font-size="7.5" font-family="monospace" text-anchor="middle">Connection type: DHCP / PPPoE?</text>

  <!-- Action: Reboot sequence (center) -->
  <rect x="170" y="74" width="110" height="52" fill="#0d1810" rx="4" stroke="#00E5A0" stroke-width="1.2"/>
  <text x="225" y="88" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">Reboot sequence:</text>
  <text x="225" y="100" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">1. Unplug modem 60s</text>
  <text x="225" y="111" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">2. Plug modem first</text>
  <text x="225" y="122" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">3. Then router</text>

  <!-- Arrow from reboot up to Q2 -->
  <line x1="280" y1="100" x2="560" y2="87" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ita)"/>

  <!-- Q4: Device WiFi connected? -->
  <rect x="556" y="202" width="210" height="26" fill="#0d1810" rx="4" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="661" y="214" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Device showing WiFi connected?</text>
  <text x="661" y="224" fill="#4a5e4e" font-size="7.5" font-family="monospace" text-anchor="middle">and internet test page loads?</text>

  <!-- YES → Done -->
  <line x1="661" y1="228" x2="661" y2="262" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#ita)"/>
  <text x="675" y="250" fill="#00E5A0" font-size="7.5" font-family="monospace">YES</text>

  <!-- NO → ISP -->
  <line x1="556" y1="215" x2="446" y2="215" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#itan)"/>
  <text x="500" y="210" fill="#ef4444" font-size="7.5" font-family="monospace" text-anchor="middle">NO</text>

  <!-- Action: Contact ISP -->
  <rect x="270" y="204" width="172" height="28" fill="#1a0d0d" rx="4" stroke="#ef4444" stroke-width="1.2"/>
  <text x="356" y="216" fill="#ef4444" font-size="8" font-family="monospace" text-anchor="middle">Contact your ISP</text>
  <text x="356" y="226" fill="#4a5e4e" font-size="7.5" font-family="monospace" text-anchor="middle">Possible line / account issue</text>

  <!-- ✓ FIXED -->
  <rect x="596" y="264" width="130" height="30" fill="#0d1a12" rx="8" stroke="#00E5A0" stroke-width="2"/>
  <text x="661" y="282" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">Internet Fixed ✓</text>

  <!-- Legend -->
  <rect x="20" y="280" width="220" height="22" fill="#0d1810" rx="4" stroke="#1e3a22"/>
  <rect x="28" y="286" width="22" height="10" fill="#0d1810" rx="2" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="56" y="295" fill="#6B7F72" font-size="7.5" font-family="monospace">Decision</text>
  <rect x="100" y="286" width="22" height="10" fill="#0d1810" rx="2" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="128" y="295" fill="#6B7F72" font-size="7.5" font-family="monospace">Action</text>
  <rect x="168" y="286" width="22" height="10" fill="#1a0d0d" rx="2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="196" y="295" fill="#6B7F72" font-size="7.5" font-family="monospace">Problem</text>
</svg>
