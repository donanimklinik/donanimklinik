<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="HP printer connected to WiFi but shows offline: printer has IP address but Windows port points to old IP — update port IP or reinstall printer to fix offline status">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="#0A130E" rx="12"/>
  <rect width="800" height="260" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">HP PRINTER CONNECTED BUT OFFLINE — IP MISMATCH FIX</text>

  <!-- Diagram: IP mismatch -->
  <rect x="20" y="40" width="340" height="130" fill="#1a0d0d" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="190" y="62" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Why It Happens</text>
  <text x="36" y="84" fill="#93B5A0" font-size="13" font-family="monospace" font-weight="bold">Windows port saved:</text>
  <rect x="36" y="92" width="150" height="24" fill="#0A130E" rx="3" stroke="#ef4444" stroke-width="1"/>
  <text x="111" y="108" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle">192.168.1.105</text>
  <text x="36" y="134" fill="#93B5A0" font-size="13" font-family="monospace" font-weight="bold">Printer's new IP:</text>
  <rect x="36" y="142" width="150" height="24" fill="#0A130E" rx="3" stroke="#00E5A0" stroke-width="1"/>
  <text x="111" y="158" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">192.168.1.112</text>
  <text x="220" y="118" fill="#ef4444" font-size="30" text-anchor="middle">≠</text>
  <text x="220" y="158" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle">IP changed!</text>

  <!-- Fix steps -->
  <rect x="20" y="182" width="340" height="66" fill="#0d1810" rx="8" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="190" y="202" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Find Printer's Current IP</text>
  <text x="36" y="222" fill="#93B5A0" font-size="12" font-family="monospace">Printer panel → Wireless → IP Address</text>
  <text x="36" y="238" fill="#93B5A0" font-size="12" font-family="monospace">Or print a Wireless Test Report</text>

  <!-- Right: Fix steps -->
  <rect x="378" y="40" width="402" height="208" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="579" y="64" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix the Port IP</text>
  <line x1="394" y1="72" x2="764" y2="72" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="94" fill="#00E5A0" font-size="12" font-family="monospace">①</text>
  <text x="414" y="94" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Open Devices &amp; Printers</text>
  <text x="414" y="111" fill="#93B5A0" font-size="12" font-family="monospace">Right-click HP printer → Properties</text>

  <line x1="394" y1="122" x2="764" y2="122" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="144" fill="#00E5A0" font-size="12" font-family="monospace">②</text>
  <text x="414" y="144" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Ports tab → Configure Port</text>
  <text x="414" y="161" fill="#93B5A0" font-size="12" font-family="monospace">Update IP to printer's new address</text>

  <line x1="394" y1="172" x2="764" y2="172" stroke="#1e3a22" stroke-width="1"/>

  <text x="394" y="194" fill="#f59e0b" font-size="12" font-family="monospace">→</text>
  <text x="414" y="194" fill="#F0F4F1" font-size="13" font-family="monospace" font-weight="bold">Permanent fix: static IP</text>
  <text x="414" y="211" fill="#93B5A0" font-size="12" font-family="monospace">Reserve IP in router DHCP settings</text>
  <text x="414" y="228" fill="#6B7F72" font-size="11" font-family="monospace">Printer won't change IP on reconnect</text>
  <text x="414" y="244" fill="#6B7F72" font-size="11" font-family="monospace">Router → DHCP → Static Lease</text>
</svg>
