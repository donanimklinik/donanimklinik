<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="HP printer connected to WiFi but shows offline: printer has IP address but Windows port points to old IP — update port IP or reinstall printer to fix offline status">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="430" fill="#091510" rx="12"/>
  <rect width="800" height="430" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">HP Printer Connected but Offline — IP Mismatch Fix</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#1e3a22" stroke-width="1"/>

  <!-- Why it happens panel -->
  <rect x="20" y="56" width="360" height="200" fill="#1a0d0d" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="80" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Why It Happens</text>
  <line x1="36" y1="90" x2="364" y2="90" stroke="#2a1010" stroke-width="1"/>

  <text x="44" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Windows port saved IP:</text>
  <rect x="44" y="124" width="160" height="28" fill="#0A1510" rx="4" stroke="#ef4444" stroke-width="1.5"/>
  <text x="124" y="143" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">192.168.1.105</text>

  <text x="44" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Printer's actual IP now:</text>
  <rect x="44" y="184" width="160" height="28" fill="#0A1510" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="124" y="203" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">192.168.1.112</text>

  <text x="235" y="160" fill="#ef4444" font-size="36" text-anchor="middle">≠</text>
  <text x="235" y="200" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">IP changed!</text>
  <text x="235" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">DHCP assigned new IP</text>
  <text x="235" y="235" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">after router restart</text>

  <!-- Fix the Port IP panel -->
  <rect x="398" y="56" width="382" height="200" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="589" y="80" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Fix the Port IP in Windows</text>
  <line x1="414" y1="90" x2="764" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="116" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">①</text>
  <text x="448" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Open Devices &amp; Printers</text>
  <text x="448" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Right-click HP printer → Properties</text>

  <line x1="414" y1="150" x2="764" y2="150" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="176" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">②</text>
  <text x="448" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Ports tab → Configure Port</text>
  <text x="448" y="195" fill="#A8C4B0" font-size="13" font-family="monospace">Update IP to printer's new address</text>

  <line x1="414" y1="210" x2="764" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <text x="422" y="236" fill="#f59e0b" font-size="16" font-family="monospace">→</text>
  <text x="448" y="236" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Permanent fix: assign static IP</text>
  <text x="448" y="252" fill="#A8C4B0" font-size="13" font-family="monospace">Router → DHCP → Static Lease → reserve</text>

  <!-- Find current IP panel -->
  <rect x="20" y="272" width="360" height="80" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="296" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Find Printer's Current IP</text>
  <line x1="36" y1="306" x2="364" y2="306" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="328" fill="#D4EAD8" font-size="14" font-family="monospace">Printer panel → Wireless → IP Address</text>
  <text x="36" y="346" fill="#A8C4B0" font-size="13" font-family="monospace">Or print a Wireless Test Report from printer</text>

  <!-- Static IP benefit panel -->
  <rect x="398" y="272" width="382" height="80" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="589" y="296" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Why Assign a Static IP?</text>
  <line x1="414" y1="306" x2="764" y2="306" stroke="#1e3a22" stroke-width="1"/>
  <text x="414" y="328" fill="#D4EAD8" font-size="14" font-family="monospace">Printer keeps same IP on every reconnect</text>
  <text x="414" y="346" fill="#A8C4B0" font-size="13" font-family="monospace">Windows port always matches → no more offline errors</text>

  <!-- Step by step summary -->
  <rect x="20" y="368" width="760" height="54" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="390" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Router Static Lease: Admin panel → DHCP → Add static binding → enter printer MAC + IP</text>
  <text x="400" y="410" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">MAC address: printer panel → Wireless → Network Info, or print a Network Config page</text>
</svg>
