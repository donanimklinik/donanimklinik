<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#091510"/>

  <!-- Title -->
  <text x="400" y="38" font-family="monospace" font-size="20" fill="#00E5A0" font-weight="bold" text-anchor="middle">Windows Update Stuck — Diagnostic Flow</text>

  <!-- Panel 1: Where It Gets Stuck -->
  <rect x="30" y="58" width="220" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="140" y="84" font-family="monospace" font-size="15" fill="#4ade80" font-weight="bold" text-anchor="middle">Where It Sticks</text>
  <line x1="50" y1="92" x2="230" y2="92" stroke="#2a5236" stroke-width="1"/>
  <text x="50" y="116" font-family="monospace" font-size="13" fill="#FBB03B">▸ Downloading: 0%</text>
  <text x="50" y="138" font-family="monospace" font-size="13" fill="#FBB03B">▸ Stuck at 35% / 99%</text>
  <text x="50" y="160" font-family="monospace" font-size="13" fill="#FBB03B">▸ "Preparing..." loop</text>
  <text x="50" y="182" font-family="monospace" font-size="13" fill="#FBB03B">▸ Restart loop</text>
  <text x="50" y="204" font-family="monospace" font-size="13" fill="#FBB03B">▸ Black screen hang</text>
  <text x="50" y="236" font-family="monospace" font-size="12" fill="#A8C4B0">Wait 3+ hours before</text>
  <text x="50" y="254" font-family="monospace" font-size="12" fill="#A8C4B0">assuming it's stuck.</text>
  <text x="50" y="272" font-family="monospace" font-size="12" fill="#A8C4B0">Large feature updates</text>
  <text x="50" y="290" font-family="monospace" font-size="12" fill="#A8C4B0">can take 1-2 hours</text>
  <text x="50" y="308" font-family="monospace" font-size="12" fill="#A8C4B0">on slower drives.</text>

  <!-- Panel 2: Reset Commands -->
  <rect x="280" y="58" width="240" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="400" y="84" font-family="monospace" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Reset Commands</text>
  <line x1="300" y1="92" x2="500" y2="92" stroke="#2a5236" stroke-width="1"/>
  <text x="300" y="112" font-family="monospace" font-size="12" fill="#A8C4B0">Run as Administrator:</text>
  <text x="300" y="134" font-family="monospace" font-size="13" fill="#00E5A0">net stop wuauserv</text>
  <text x="300" y="152" font-family="monospace" font-size="13" fill="#00E5A0">net stop cryptSvc</text>
  <text x="300" y="170" font-family="monospace" font-size="13" fill="#00E5A0">net stop bits</text>
  <text x="300" y="188" font-family="monospace" font-size="13" fill="#00E5A0">net stop msiserver</text>
  <line x1="300" y1="202" x2="500" y2="202" stroke="#2a5236" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="220" font-family="monospace" font-size="12" fill="#A8C4B0">Delete cache folders:</text>
  <text x="300" y="240" font-family="monospace" font-size="12" fill="#00E5A0">C:\Windows\</text>
  <text x="300" y="258" font-family="monospace" font-size="12" fill="#00E5A0">SoftwareDistribution</text>
  <text x="300" y="276" font-family="monospace" font-size="12" fill="#00E5A0">C:\Windows\System32\</text>
  <text x="300" y="292" font-family="monospace" font-size="12" fill="#00E5A0">catroot2</text>
  <line x1="300" y1="306" x2="500" y2="306" stroke="#2a5236" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="326" font-family="monospace" font-size="13" fill="#00E5A0">net start wuauserv</text>
  <text x="300" y="344" font-family="monospace" font-size="13" fill="#00E5A0">net start cryptSvc</text>
  <text x="300" y="362" font-family="monospace" font-size="13" fill="#00E5A0">net start bits</text>

  <!-- Panel 3: After Reset -->
  <rect x="550" y="58" width="220" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="660" y="84" font-family="monospace" font-size="15" fill="#4ade80" font-weight="bold" text-anchor="middle">After Reset</text>
  <line x1="570" y1="92" x2="750" y2="92" stroke="#2a5236" stroke-width="1"/>
  <text x="570" y="114" font-family="monospace" font-size="13" fill="#D4EAD8">Restart the PC</text>
  <text x="570" y="136" font-family="monospace" font-size="13" fill="#D4EAD8">Open Settings</text>
  <text x="570" y="154" font-family="monospace" font-size="13" fill="#D4EAD8">Check for Updates</text>
  <text x="570" y="184" font-family="monospace" font-size="12" fill="#A8C4B0">If update resumes</text>
  <text x="570" y="202" font-family="monospace" font-size="12" fill="#A8C4B0">and completes →</text>
  <text x="570" y="220" font-family="monospace" font-size="13" fill="#00E5A0">Fixed ✓</text>
  <text x="570" y="252" font-family="monospace" font-size="12" fill="#FBB03B">Still stuck? Run:</text>
  <text x="570" y="272" font-family="monospace" font-size="13" fill="#00E5A0">sfc /scannow</text>
  <text x="570" y="290" font-family="monospace" font-size="13" fill="#00E5A0">DISM /RestoreHealth</text>
  <text x="570" y="318" font-family="monospace" font-size="12" fill="#A8C4B0">These repair corrupt</text>
  <text x="570" y="336" font-family="monospace" font-size="12" fill="#A8C4B0">system components</text>
  <text x="570" y="354" font-family="monospace" font-size="12" fill="#A8C4B0">blocking updates.</text>

  <!-- Footer -->
  <text x="400" y="410" font-family="monospace" font-size="12" fill="#2a5236" text-anchor="middle">donanimklinik.com — Windows Update Stuck Fix</text>
</svg>
