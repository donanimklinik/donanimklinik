<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Router admin panel wireless settings: change SSID, set security to WPA2, enter strong password, select channel 1, 6, or 11 for 2.4GHz">
  <defs>
    <pattern id="wg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="780" height="240" fill="#0A130E" rx="10"/>
  <rect width="780" height="240" fill="url(#wg)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">WIRELESS SETTINGS — WHAT TO CHANGE</text>

  <!-- Browser window -->
  <rect x="24" y="30" width="732" height="196" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <!-- Browser chrome -->
  <rect x="24" y="30" width="732" height="26" fill="#0a1509" rx="8"/>
  <rect x="24" y="47" width="732" height="9" fill="#0a1509"/>
  <circle cx="42" cy="43" r="4" fill="#1e3a22"/>
  <circle cx="58" cy="43" r="4" fill="#1e3a22"/>
  <circle cx="74" cy="43" r="4" fill="#1e3a22"/>
  <rect x="92" y="37" width="180" height="12" fill="#0A130E" rx="3" stroke="#243d28"/>
  <text x="182" y="47" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">192.168.1.1/wireless</text>

  <!-- Sidebar nav -->
  <rect x="30" y="62" width="120" height="158" fill="#0A130E" rx="4" stroke="#1e3a22"/>
  <rect x="34" y="68" width="112" height="18" fill="#00E5A0" rx="3" opacity=".12"/>
  <text x="90" y="80" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">► Wireless</text>
  <rect x="34" y="90" width="112" height="14" fill="none"/>
  <text x="90" y="101" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">WAN / Internet</text>
  <rect x="34" y="108" width="112" height="14" fill="none"/>
  <text x="90" y="119" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">LAN Settings</text>
  <rect x="34" y="126" width="112" height="14" fill="none"/>
  <text x="90" y="137" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">Security</text>
  <rect x="34" y="144" width="112" height="14" fill="none"/>
  <text x="90" y="155" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">Advanced</text>
  <rect x="34" y="162" width="112" height="14" fill="none"/>
  <text x="90" y="173" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle">Administration</text>

  <!-- Main settings panel -->
  <rect x="158" y="62" width="590" height="158" fill="#0A130E" rx="4" stroke="#1e3a22"/>
  <text x="176" y="80" fill="#F0F4F1" font-size="11" font-family="monospace">Wireless Settings (2.4 GHz)</text>
  <line x1="162" y1="86" x2="744" y2="86" stroke="#1e3a22" stroke-width="1"/>

  <!-- Row 1: SSID -->
  <text x="176" y="106" fill="#6B7F72" font-size="9.5" font-family="monospace">Network Name (SSID)</text>
  <rect x="360" y="95" width="220" height="18" fill="#111e14" rx="3" stroke="#243d28"/>
  <text x="470" y="108" fill="#F0F4F1" font-size="9" font-family="monospace" text-anchor="middle">MyHomeNetwork</text>
  <!-- callout -->
  <line x1="582" y1="104" x2="618" y2="96" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="618" y="86" width="118" height="22" fill="#0d1810" rx="3" stroke="#00E5A0" stroke-width="1" opacity=".8"/>
  <text x="677" y="94" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">✎ Change from default</text>
  <text x="677" y="104" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">avoid name/address</text>

  <!-- Row 2: Security -->
  <text x="176" y="136" fill="#6B7F72" font-size="9.5" font-family="monospace">Security Mode</text>
  <rect x="360" y="125" width="220" height="18" fill="#111e14" rx="3" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="470" y="138" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">WPA2-Personal (AES)  ▾</text>
  <!-- callout -->
  <line x1="582" y1="134" x2="618" y2="130" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="618" y="120" width="118" height="28" fill="#0d1810" rx="3" stroke="#00E5A0" stroke-width="1" opacity=".8"/>
  <text x="677" y="131" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">✓ Best choice</text>
  <text x="677" y="141" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Never use WEP</text>

  <!-- Row 3: Password -->
  <text x="176" y="166" fill="#6B7F72" font-size="9.5" font-family="monospace">WiFi Password</text>
  <rect x="360" y="155" width="220" height="18" fill="#111e14" rx="3" stroke="#243d28"/>
  <text x="470" y="168" fill="#F0F4F1" font-size="9" font-family="monospace" text-anchor="middle">••••••••••••••••</text>
  <!-- strength meter -->
  <rect x="360" y="174" width="44" height="4" fill="#00E5A0" rx="1"/>
  <rect x="408" y="174" width="44" height="4" fill="#00E5A0" rx="1" opacity=".7"/>
  <rect x="456" y="174" width="44" height="4" fill="#00E5A0" rx="1" opacity=".4"/>
  <rect x="504" y="174" width="44" height="4" fill="#1e3a22" rx="1"/>
  <text x="562" y="178" fill="#00E5A0" font-size="7" font-family="monospace">Strong</text>
  <!-- callout -->
  <line x1="582" y1="164" x2="618" y2="160" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="618" y="152" width="118" height="28" fill="#0d1810" rx="3" stroke="#243d28" opacity=".8"/>
  <text x="677" y="163" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">Min 12 characters</text>
  <text x="677" y="173" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">letters+numbers+symbol</text>

  <!-- Row 4: Channel -->
  <text x="176" y="196" fill="#6B7F72" font-size="9.5" font-family="monospace">Channel (2.4 GHz)</text>
  <rect x="360" y="185" width="100" height="18" fill="#111e14" rx="3" stroke="#243d28"/>
  <text x="410" y="198" fill="#F0F4F1" font-size="9" font-family="monospace" text-anchor="middle">6  ▾</text>
  <text x="470" y="198" fill="#4a5e4e" font-size="8.5" font-family="monospace">← use 1, 6, or 11 only</text>
  <!-- callout -->
  <line x1="582" y1="194" x2="618" y2="188" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="618" y="180" width="118" height="28" fill="#0d1810" rx="3" stroke="#243d28" opacity=".8"/>
  <text x="677" y="191" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">Non-overlapping only</text>
  <text x="677" y="201" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">avoid neighbors' channel</text>

  <!-- Apply button -->
  <rect x="176" y="210" width="80" height="18" fill="#00E5A0" rx="3" opacity=".85"/>
  <text x="216" y="222" fill="#0A130E" font-size="9" font-family="monospace" text-anchor="middle" font-weight="bold">Apply</text>
</svg>
