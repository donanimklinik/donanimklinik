<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Router admin panel wireless settings: change SSID, set security to WPA2, enter strong password, select channel 1, 6, or 11 for 2.4GHz">
  <defs>
    <pattern id="wg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="460" fill="#091510" rx="10"/>
  <rect width="800" height="460" fill="url(#wg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Wireless Settings — What to Change</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">4 key settings to configure in your router's wireless panel</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- Browser window -->
  <rect x="24" y="82" width="752" height="340" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <!-- Browser chrome -->
  <rect x="24" y="82" width="752" height="34" fill="#0a1509" rx="8"/>
  <rect x="24" y="107" width="752" height="9" fill="#0a1509"/>
  <circle cx="44" cy="99" r="5" fill="#1e3a22"/>
  <circle cx="62" cy="99" r="5" fill="#1e3a22"/>
  <circle cx="80" cy="99" r="5" fill="#1e3a22"/>
  <rect x="98" y="88" width="200" height="18" fill="#091510" rx="3" stroke="#2a5236"/>
  <text x="198" y="101" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">192.168.1.1/wireless</text>

  <!-- Sidebar nav -->
  <rect x="30" y="120" width="130" height="294" fill="#091510" rx="4" stroke="#1e3a22"/>
  <rect x="34" y="128" width="122" height="24" fill="#00E5A0" rx="3" opacity=".14" stroke="#00E5A0" stroke-width="1"/>
  <text x="95" y="144" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">► Wireless</text>
  <text x="95" y="172" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">WAN / Internet</text>
  <text x="95" y="196" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">LAN Settings</text>
  <text x="95" y="220" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Security</text>
  <text x="95" y="244" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Advanced</text>
  <text x="95" y="268" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">DNS Settings</text>
  <text x="95" y="292" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Administration</text>

  <!-- Main settings panel -->
  <rect x="168" y="120" width="600" height="294" fill="#091510" rx="4" stroke="#1e3a22"/>
  <text x="184" y="146" fill="#D4EAD8" font-size="16" font-family="monospace" font-weight="bold">Wireless Settings (2.4 GHz)</text>
  <line x1="172" y1="154" x2="764" y2="154" stroke="#1e3a22" stroke-width="1"/>

  <!-- ROW 1: SSID -->
  <rect x="172" y="162" width="588" height="48" fill="#0d1e16" rx="3"/>
  <text x="184" y="183" fill="#A8C4B0" font-size="13" font-family="monospace">Network Name (SSID)</text>
  <text x="184" y="200" fill="#7FB09A" font-size="13" font-family="monospace">Change from default — avoid using your name or address</text>
  <rect x="488" y="164" width="246" height="24" fill="#111e14" rx="3" stroke="#2a5236"/>
  <text x="611" y="181" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">MyHomeNetwork</text>
  <!-- callout tag -->
  <rect x="654" y="156" width="100" height="20" fill="#0d1e16" rx="3" stroke="#00E5A0" stroke-width="1.2"/>
  <text x="704" y="169" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">✎ Must change</text>

  <line x1="172" y1="210" x2="760" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <!-- ROW 2: Security Mode -->
  <rect x="172" y="218" width="588" height="48" fill="#0d1e16" rx="3"/>
  <text x="184" y="239" fill="#A8C4B0" font-size="13" font-family="monospace">Security Mode</text>
  <text x="184" y="256" fill="#7FB09A" font-size="13" font-family="monospace">WPA2-Personal (AES) is the only acceptable choice — never use WEP or WPA</text>
  <rect x="488" y="220" width="246" height="24" fill="#111e14" rx="3" stroke="#00E5A0" stroke-width="1.8"/>
  <text x="611" y="237" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">WPA2-Personal (AES)  ▾</text>
  <!-- callout tag -->
  <rect x="654" y="212" width="100" height="20" fill="#0d1e16" rx="3" stroke="#00E5A0" stroke-width="1.2"/>
  <text x="704" y="225" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">✓ Best choice</text>

  <line x1="172" y1="266" x2="760" y2="266" stroke="#1e3a22" stroke-width="1"/>

  <!-- ROW 3: Password -->
  <rect x="172" y="274" width="588" height="60" fill="#0d1e16" rx="3"/>
  <text x="184" y="295" fill="#A8C4B0" font-size="13" font-family="monospace">WiFi Password</text>
  <text x="184" y="313" fill="#7FB09A" font-size="13" font-family="monospace">Minimum 12 characters — mix letters, numbers, and symbols</text>
  <rect x="488" y="276" width="246" height="24" fill="#111e14" rx="3" stroke="#2a5236"/>
  <text x="611" y="293" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">••••••••••••••••</text>
  <!-- Strength meter -->
  <rect x="488" y="302" width="52" height="6" fill="#00E5A0" rx="2"/>
  <rect x="544" y="302" width="52" height="6" fill="#00E5A0" rx="2" opacity=".7"/>
  <rect x="600" y="302" width="52" height="6" fill="#00E5A0" rx="2" opacity=".4"/>
  <rect x="656" y="302" width="52" height="6" fill="#1e3a22" rx="2"/>
  <text x="718" y="310" fill="#00E5A0" font-size="13" font-family="monospace">Strong</text>
  <!-- callout tag -->
  <rect x="654" y="268" width="100" height="20" fill="#0d1e16" rx="3" stroke="#2a5236" stroke-width="1.2"/>
  <text x="704" y="281" fill="#D4EAD8" font-size="12" font-family="monospace" text-anchor="middle">Min 12 chars</text>

  <line x1="172" y1="334" x2="760" y2="334" stroke="#1e3a22" stroke-width="1"/>

  <!-- ROW 4: Channel -->
  <rect x="172" y="342" width="588" height="48" fill="#0d1e16" rx="3"/>
  <text x="184" y="363" fill="#A8C4B0" font-size="13" font-family="monospace">Channel (2.4 GHz)</text>
  <text x="184" y="380" fill="#7FB09A" font-size="13" font-family="monospace">Use only channels 1, 6, or 11 — they don't overlap with each other</text>
  <rect x="488" y="344" width="120" height="24" fill="#111e14" rx="3" stroke="#2a5236"/>
  <text x="548" y="361" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Channel 6  ▾</text>
  <!-- callout tag -->
  <rect x="620" y="336" width="134" height="20" fill="#0d1e16" rx="3" stroke="#2a5236" stroke-width="1.2"/>
  <text x="687" y="349" fill="#D4EAD8" font-size="12" font-family="monospace" text-anchor="middle">1, 6, or 11 only</text>

  <!-- Apply button -->
  <rect x="184" y="398" width="120" height="30" fill="#00E5A0" rx="4" opacity=".9"/>
  <text x="244" y="417" fill="#091510" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Save &amp; Apply</text>

  <!-- Bottom section: What happens after apply -->
  <rect x="24" y="432" width="752" height="20" fill="none"/>
  <rect x="24" y="432" width="752" height="20" fill="#0d1e16" rx="4" stroke="#2a5236"/>
  <text x="40" y="446" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">After saving:</text>
  <text x="148" y="446" fill="#D4EAD8" font-size="14" font-family="monospace">Router reboots (~30 sec) → reconnect all devices to new WiFi name with new password</text>
</svg>
