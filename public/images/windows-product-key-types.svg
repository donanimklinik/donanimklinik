<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Windows product key types: OEM key tied to one device, Retail key transferable to one PC at a time, Volume license for organizations, digital license linked to Microsoft account and hardware">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Main title -->
  <text x="400" y="38" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Windows Product Key Types — Complete Guide</text>
  <line x1="40" y1="50" x2="760" y2="50" stroke="#1e3a22" stroke-width="1"/>

  <!-- OEM Key -->
  <rect x="20" y="62" width="178" height="210" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="109" y="86" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">OEM Key</text>
  <line x1="36" y1="94" x2="182" y2="94" stroke="#1e3a22" stroke-width="1"/>
  <text x="109" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Pre-installed</text>
  <text x="109" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">on new PCs</text>
  <text x="109" y="152" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Tied to that</text>
  <text x="109" y="170" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">device only</text>
  <text x="109" y="190" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle">Non-transferable</text>
  <line x1="36" y1="200" x2="182" y2="200" stroke="#1e3a22" stroke-width="1"/>
  <text x="109" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Where to find:</text>
  <text x="109" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">BIOS/UEFI chip</text>
  <text x="109" y="254" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">or sticker on PC</text>
  <text x="109" y="265" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle"> </text>

  <!-- Retail Key -->
  <rect x="210" y="62" width="178" height="210" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="299" y="86" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Retail Key</text>
  <line x1="226" y1="94" x2="372" y2="94" stroke="#1e3a22" stroke-width="1"/>
  <text x="299" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Purchased from</text>
  <text x="299" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">store or online</text>
  <text x="299" y="152" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Transfer to new</text>
  <text x="299" y="170" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">PC (one at a time)</text>
  <text x="299" y="190" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Most flexible ✓</text>
  <line x1="226" y1="200" x2="372" y2="200" stroke="#1e3a22" stroke-width="1"/>
  <text x="299" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Where to find:</text>
  <text x="299" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Purchase email</text>
  <text x="299" y="254" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">or card in box</text>

  <!-- Volume Key -->
  <rect x="400" y="62" width="178" height="210" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="489" y="86" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Volume Key</text>
  <line x1="416" y1="94" x2="562" y2="94" stroke="#1e3a22" stroke-width="1"/>
  <text x="489" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">For organizations</text>
  <text x="489" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Multiple PCs</text>
  <text x="489" y="152" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Requires KMS</text>
  <text x="489" y="170" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">server on network</text>
  <text x="489" y="190" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">Renews every 180d</text>
  <line x1="416" y1="200" x2="562" y2="200" stroke="#1e3a22" stroke-width="1"/>
  <text x="489" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Where to find:</text>
  <text x="489" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">IT department</text>
  <text x="489" y="254" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">or VLSC portal</text>

  <!-- Digital License -->
  <rect x="590" y="62" width="190" height="210" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="685" y="86" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Digital License</text>
  <line x1="606" y1="94" x2="764" y2="94" stroke="#1e3a22" stroke-width="1"/>
  <text x="685" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">No key at all</text>
  <text x="685" y="132" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Tied to hardware</text>
  <text x="685" y="150" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">+ MS account</text>
  <text x="685" y="170" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Survives reinstall</text>
  <text x="685" y="190" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Auto-activates ✓</text>
  <line x1="606" y1="200" x2="764" y2="200" stroke="#1e3a22" stroke-width="1"/>
  <text x="685" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Where to find:</text>
  <text x="685" y="236" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">MS account page</text>
  <text x="685" y="254" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Settings → Activation</text>

  <!-- Bottom: How to view your key -->
  <rect x="20" y="284" width="760" height="124" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="400" y="308" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">How to View Your Current Key — Run in PowerShell</text>
  <line x1="36" y1="316" x2="764" y2="316" stroke="#1e3a22" stroke-width="1"/>

  <!-- CMD block -->
  <rect x="36" y="326" width="728" height="36" fill="#091510" rx="6" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="349" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">(Get-WmiObject -query 'select * from SoftwareLicensingService').OA3xOriginalProductKey</text>

  <text x="400" y="384" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Shows OEM key embedded in BIOS. For Retail/Volume run:</text>
  <text x="400" y="403" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">slmgr /dli   — shows license details including partial product key and license status</text>
</svg>
