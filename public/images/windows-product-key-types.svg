<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-label="Windows product key types: OEM key tied to one device, Retail key transferable to one PC at a time, Volume license for organizations, digital license linked to Microsoft account and hardware">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="270" fill="#0A130E" rx="12"/>
  <rect width="800" height="270" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">WINDOWS PRODUCT KEY — TYPES AND WHERE TO FIND IT</text>

  <!-- OEM -->
  <rect x="20" y="38" width="180" height="150" fill="#0d1810" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="62" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">OEM Key</text>
  <line x1="36" y1="70" x2="184" y2="70" stroke="#1e3a22" stroke-width="1"/>
  <text x="110" y="90" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Comes with PC</text>
  <text x="110" y="107" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Tied to that device</text>
  <text x="110" y="124" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Non-transferable</text>
  <text x="110" y="144" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Where: BIOS/UEFI</text>
  <text x="110" y="160" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">wmic path softwarelicensing</text>
  <text x="110" y="175" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">...OA3xOriginalProductKey</text>
  <text x="110" y="180" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle"> </text>

  <!-- Retail -->
  <rect x="214" y="38" width="180" height="150" fill="#0d1810" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="304" y="62" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Retail Key</text>
  <line x1="230" y1="70" x2="378" y2="70" stroke="#1e3a22" stroke-width="1"/>
  <text x="304" y="90" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Purchased from store</text>
  <text x="304" y="107" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Transfer to new PC</text>
  <text x="304" y="124" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">One PC at a time</text>
  <text x="304" y="144" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Where: purchase email</text>
  <text x="304" y="160" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">or card in box</text>
  <text x="304" y="176" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle">Most flexible ✓</text>

  <!-- Volume -->
  <rect x="408" y="38" width="180" height="150" fill="#0d1810" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="498" y="62" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Volume Key</text>
  <line x1="424" y1="70" x2="572" y2="70" stroke="#1e3a22" stroke-width="1"/>
  <text x="498" y="90" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">For organizations</text>
  <text x="498" y="107" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Multiple PCs</text>
  <text x="498" y="124" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Needs KMS server</text>
  <text x="498" y="144" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Where: IT dept</text>
  <text x="498" y="160" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">or VLSC portal</text>
  <text x="498" y="176" fill="#f59e0b" font-size="11" font-family="monospace" text-anchor="middle">Renews every 180d</text>

  <!-- Digital -->
  <rect x="602" y="38" width="178" height="150" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="691" y="62" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Digital License</text>
  <line x1="618" y1="70" x2="764" y2="70" stroke="#1e3a22" stroke-width="1"/>
  <text x="691" y="90" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">No key needed</text>
  <text x="691" y="107" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Tied to hardware</text>
  <text x="691" y="124" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">+ MS account</text>
  <text x="691" y="144" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Where: MS account</text>
  <text x="691" y="160" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Settings → Activation</text>
  <text x="691" y="176" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle">Auto after upgrade ✓</text>

  <!-- Bottom: how to find key -->
  <rect x="20" y="202" width="760" height="56" fill="#0d1810" rx="8" stroke="#1e3a22"/>
  <text x="400" y="222" fill="#F0F4F1" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">View Your Current Key (partial) in PowerShell</text>
  <text x="400" y="244" fill="#93c5fd" font-size="12" font-family="monospace" text-anchor="middle">(Get-WmiObject -query 'select * from SoftwareLicensingService').OA3xOriginalProductKey</text>
</svg>
