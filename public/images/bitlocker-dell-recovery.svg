<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Dell BitLocker recovery key: Dell stores key in BIOS TPM or via Microsoft account — check account.microsoft.com first, then Dell TechDirect for enterprise devices">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="#0A130E" rx="12"/>
  <rect width="800" height="260" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">DELL BITLOCKER RECOVERY KEY — WHERE TO FIND IT</text>

  <!-- Dell logo area -->
  <rect x="20" y="40" width="130" height="110" fill="#0d1810" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="75" fill="#3b82f6" font-size="22" text-anchor="middle">💻</text>
  <text x="85" y="98" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Dell PC</text>
  <text x="85" y="116" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">TPM chip stores</text>
  <text x="85" y="132" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">encryption seal</text>
  <text x="85" y="148" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Key is elsewhere</text>

  <!-- Option 1: MS Account -->
  <rect x="180" y="40" width="180" height="110" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="270" y="63" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">① Microsoft Account</text>
  <text x="270" y="81" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">account.microsoft.com</text>
  <text x="270" y="97" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Devices → BitLocker</text>
  <text x="270" y="113" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">recovery keys</text>
  <text x="270" y="135" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Check here first</text>
  <text x="270" y="150" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Home/personal PCs</text>

  <!-- Option 2: Dell TechDirect -->
  <rect x="390" y="40" width="190" height="110" fill="#0d1810" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="485" y="63" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">② Dell TechDirect</text>
  <text x="485" y="81" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">techdirect.dell.com</text>
  <text x="485" y="97" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Business accounts only</text>
  <text x="485" y="113" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Search by Service Tag</text>
  <text x="485" y="135" fill="#f59e0b" font-size="12" font-family="monospace" text-anchor="middle">Enterprise/fleet PCs</text>
  <text x="485" y="150" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Needs company account</text>

  <!-- Option 3: IT/AD -->
  <rect x="610" y="40" width="170" height="110" fill="#0d1810" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="695" y="63" fill="#3b82f6" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">③ IT / AD</text>
  <text x="695" y="81" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Domain-joined Dell</text>
  <text x="695" y="97" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">IT has the key in</text>
  <text x="695" y="113" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Active Directory</text>
  <text x="695" y="135" fill="#3b82f6" font-size="12" font-family="monospace" text-anchor="middle">Call IT helpdesk</text>
  <text x="695" y="150" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Work/school device</text>

  <!-- Dell-specific note -->
  <rect x="20" y="170" width="760" height="72" fill="#0d1810" rx="8" stroke="#1e3a22"/>
  <text x="400" y="192" fill="#F0F4F1" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Dell-Specific: Check Your Service Tag</text>
  <text x="400" y="213" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Service Tag is on the bottom label of your Dell — format: ABC1234</text>
  <text x="400" y="232" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Dell Support (dell.com/support) uses Service Tag to verify ownership — have it ready when calling</text>
</svg>
