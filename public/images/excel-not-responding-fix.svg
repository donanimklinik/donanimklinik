<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#091510"/>
  <text x="400" y="36" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00E5A0" text-anchor="middle">Excel Not Responding — Fix Path</text>

  <!-- Step 1: Task Manager -->
  <rect x="20" y="58" width="180" height="120" rx="8" fill="#0d1e16" stroke="#3b82f6"/>
  <text x="110" y="80" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">Step 1 — Always First</text>
  <line x1="35" y1="88" x2="185" y2="88" stroke="#2a5236" stroke-width="1"/>
  <text x="110" y="108" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Ctrl+Shift+Esc</text>
  <text x="110" y="126" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Find Excel → End Task</text>
  <text x="110" y="148" font-family="Arial,sans-serif" font-size="12" fill="#FBB03B" text-anchor="middle">Wait 10 seconds</text>
  <text x="110" y="168" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">before reopening</text>

  <!-- Arrow -->
  <text x="212" y="125" font-family="Arial,sans-serif" font-size="22" fill="#2a5236" text-anchor="middle">→</text>

  <!-- Step 2: Safe Mode -->
  <rect x="230" y="58" width="180" height="120" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="320" y="80" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Step 2 — Safe Mode</text>
  <line x1="245" y1="88" x2="395" y2="88" stroke="#2a5236" stroke-width="1"/>
  <text x="320" y="108" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Win+R → excel /safe</text>
  <text x="320" y="128" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Test same operation</text>
  <text x="320" y="155" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Stable in Safe Mode?</text>
  <text x="320" y="170" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">→ Add-in is the cause</text>

  <!-- Arrow -->
  <text x="422" y="125" font-family="Arial,sans-serif" font-size="22" fill="#2a5236" text-anchor="middle">→</text>

  <!-- Step 3: Hardware Accel -->
  <rect x="440" y="58" width="180" height="120" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="530" y="80" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Step 3 — GPU Fix</text>
  <line x1="455" y1="88" x2="605" y2="88" stroke="#2a5236" stroke-width="1"/>
  <text x="530" y="108" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">File > Options</text>
  <text x="530" y="126" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">&gt; Advanced &gt; Display</text>
  <text x="530" y="150" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Disable hardware</text>
  <text x="530" y="168" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">graphics acceleration</text>

  <!-- Arrow -->
  <text x="632" y="125" font-family="Arial,sans-serif" font-size="22" fill="#2a5236" text-anchor="middle">→</text>

  <!-- Step 4: Office Repair -->
  <rect x="650" y="58" width="130" height="120" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="715" y="80" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Step 5 — Repair</text>
  <line x1="660" y1="88" x2="770" y2="88" stroke="#2a5236" stroke-width="1"/>
  <text x="715" y="108" font-family="Arial,sans-serif" font-size="11" fill="#D4EAD8" text-anchor="middle">Control Panel</text>
  <text x="715" y="126" font-family="Arial,sans-serif" font-size="11" fill="#D4EAD8" text-anchor="middle">&gt; Office &gt; Change</text>
  <text x="715" y="148" font-family="Arial,sans-serif" font-size="11" fill="#FBB03B" text-anchor="middle">Quick Repair</text>
  <text x="715" y="166" font-family="Arial,sans-serif" font-size="11" fill="#A8C4B0" text-anchor="middle">2 min, offline</text>

  <!-- Add-in isolation detail -->
  <rect x="20" y="198" width="380" height="100" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="210" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Isolating the Add-in (if Safe Mode is stable)</text>
  <line x1="40" y1="228" x2="380" y2="228" stroke="#2a5236" stroke-width="1"/>
  <text x="210" y="248" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">File &gt; Options &gt; Add-ins &gt; COM Add-ins &gt; Go</text>
  <text x="210" y="268" font-family="Arial,sans-serif" font-size="12" fill="#FBB03B" text-anchor="middle">Uncheck ALL → restart → test → re-enable one by one</text>
  <text x="210" y="288" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">The add-in that triggers the freeze is the culprit</text>

  <!-- Recovery panel -->
  <rect x="420" y="198" width="360" height="100" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="600" y="220" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Recover Unsaved Work</text>
  <line x1="440" y1="228" x2="760" y2="228" stroke="#2a5236" stroke-width="1"/>
  <text x="600" y="248" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">Reopen Excel → Document Recovery pane</text>
  <text x="600" y="268" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">OR: File &gt; Info &gt; Manage Workbook</text>
  <text x="600" y="288" font-family="Arial,sans-serif" font-size="12" fill="#FBB03B" text-anchor="middle">Recover Unsaved Workbooks</text>

  <!-- Memory tip -->
  <rect x="20" y="316" width="760" height="70" rx="8" fill="#0d1e16" stroke="#2a5236"/>
  <text x="400" y="338" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Large Files Freezing? Reduce Calculation Load</text>
  <text x="400" y="360" font-family="Arial,sans-serif" font-size="12" fill="#D4EAD8" text-anchor="middle">File &gt; Options &gt; Formulas &gt; Calculation Options → switch to Manual</text>
  <text x="400" y="378" font-family="Arial,sans-serif" font-size="12" fill="#A8C4B0" text-anchor="middle">Prevents recalculation on every change — press F9 to calculate manually when needed</text>
</svg>
