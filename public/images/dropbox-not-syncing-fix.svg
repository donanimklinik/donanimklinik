<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Dropbox not syncing: sync icon guide, selective sync check, bandwidth settings, and fix steps">
  <rect width="800" height="420" fill="#091510"/>
  <text x="400" y="36" font-family="system-ui,sans-serif" font-size="20" fill="#00E5A0" font-weight="bold" text-anchor="middle">Dropbox Not Syncing — Fix Guide</text>

  <!-- Icon meanings -->
  <rect x="20" y="56" width="240" height="180" fill="#0d1e16" stroke="#2a5236" stroke-width="1" rx="8"/>
  <text x="140" y="80" font-family="system-ui,sans-serif" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Dropbox Icon Meanings</text>
  <line x1="36" y1="90" x2="244" y2="90" stroke="#2a5236" stroke-width="1"/>

  <text x="36" y="114" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">Spinning blue circle</text>
  <text x="36" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Actively syncing files</text>

  <text x="36" y="154" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">Steady blue droplet</text>
  <text x="36" y="170" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">All files up to date</text>

  <text x="36" y="194" font-family="system-ui,sans-serif" font-size="13" fill="#FBB03B" font-weight="bold">Red X</text>
  <text x="36" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Error — sync stopped</text>

  <text x="36" y="226" font-family="system-ui,sans-serif" font-size="13" fill="#A8C4B0" font-weight="bold">Pause symbol</text>

  <!-- Fix steps -->
  <rect x="280" y="56" width="240" height="340" fill="#0d1e16" stroke="#2a5236" stroke-width="1" rx="8"/>
  <text x="400" y="80" font-family="system-ui,sans-serif" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Fix Steps</text>
  <line x1="296" y1="90" x2="504" y2="90" stroke="#2a5236" stroke-width="1"/>

  <text x="296" y="114" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">1. Pause and resume sync</text>
  <text x="296" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Profile icon → Pause syncing</text>
  <text x="296" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Wait 10s → Resume syncing</text>

  <line x1="296" y1="160" x2="504" y2="160" stroke="#1a3020" stroke-width="1"/>

  <text x="296" y="182" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">2. Check Selective Sync</text>
  <text x="296" y="198" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Preferences → Sync</text>
  <text x="296" y="214" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">All expected folders must be ✓</text>

  <line x1="296" y1="228" x2="504" y2="228" stroke="#1a3020" stroke-width="1"/>

  <text x="296" y="250" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">3. Check bandwidth</text>
  <text x="296" y="266" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Preferences → Bandwidth</text>
  <text x="296" y="282" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Upload rate → Don't limit</text>

  <line x1="296" y1="296" x2="504" y2="296" stroke="#1a3020" stroke-width="1"/>

  <text x="296" y="318" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">4. Quit and restart</text>
  <text x="296" y="334" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Profile icon → Quit Dropbox</text>
  <text x="296" y="350" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Reopen from Start menu</text>

  <line x1="296" y1="364" x2="504" y2="364" stroke="#1a3020" stroke-width="1"/>

  <text x="296" y="386" font-family="system-ui,sans-serif" font-size="13" fill="#00E5A0" font-weight="bold">5. Reinstall Dropbox</text>
  <text x="296" y="402" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">dropbox.com/install</text>

  <!-- Common causes -->
  <rect x="540" y="56" width="240" height="200" fill="#0d1e16" stroke="#2a5236" stroke-width="1" rx="8"/>
  <text x="660" y="80" font-family="system-ui,sans-serif" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Common Causes</text>
  <line x1="556" y1="90" x2="764" y2="90" stroke="#2a5236" stroke-width="1"/>

  <text x="556" y="114" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Sync paused</text>
  <text x="556" y="134" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Selective Sync excludes folder</text>
  <text x="556" y="154" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Bandwidth throttled too low</text>
  <text x="556" y="174" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">File locked by another app</text>
  <text x="556" y="194" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">File name conflict</text>
  <text x="556" y="214" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Account storage full</text>
  <text x="556" y="234" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Sync engine hung</text>

  <!-- Verify panel -->
  <rect x="540" y="272" width="240" height="130" fill="#0d1e16" stroke="#2a5236" stroke-width="1" rx="8"/>
  <text x="660" y="296" font-family="system-ui,sans-serif" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Verify Fix</text>
  <line x1="556" y1="306" x2="764" y2="306" stroke="#2a5236" stroke-width="1"/>
  <text x="556" y="328" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Dropbox icon: steady blue droplet</text>
  <text x="556" y="350" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Add test file → brief spin → steady</text>
  <text x="556" y="372" font-family="system-ui,sans-serif" font-size="13" fill="#D4EAD8">Open dropbox.com → file appears</text>
  <text x="556" y="392" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Sync confirmed working ✓</text>

  <!-- Icon legend continued -->
  <rect x="20" y="252" width="240" height="145" fill="#0d1e16" stroke="#2a5236" stroke-width="1" rx="8"/>
  <text x="140" y="276" font-family="system-ui,sans-serif" font-size="14" fill="#3b82f6" font-weight="bold" text-anchor="middle">Selective Sync Check</text>
  <line x1="36" y1="286" x2="244" y2="286" stroke="#2a5236" stroke-width="1"/>
  <text x="36" y="308" font-family="system-ui,sans-serif" font-size="12" fill="#D4EAD8">Selective Sync = choose which folders</text>
  <text x="36" y="326" font-family="system-ui,sans-serif" font-size="12" fill="#D4EAD8">sync to THIS device.</text>
  <text x="36" y="350" font-family="system-ui,sans-serif" font-size="12" fill="#FBB03B">Excluded folders never upload</text>
  <text x="36" y="366" font-family="system-ui,sans-serif" font-size="12" fill="#FBB03B">from this computer.</text>
  <text x="36" y="388" font-family="system-ui,sans-serif" font-size="12" fill="#A8C4B0">Prefs → Sync → check all folders</text>
</svg>
