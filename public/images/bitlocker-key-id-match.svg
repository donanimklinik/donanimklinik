<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="BitLocker recovery key not working: match the Key ID on the recovery screen with the correct key in your Microsoft account — wrong key ID means wrong key">
  <defs>
    <pattern id="g6" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="440" fill="#091510" rx="12"/>
  <rect width="800" height="440" fill="url(#g6)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">BitLocker Key Not Working — Match the Key ID</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Recovery screen mockup (left) -->
  <rect x="18" y="62" width="340" height="268" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <!-- Browser-style title bar -->
  <rect x="18" y="62" width="340" height="30" fill="#091510" rx="10"/>
  <rect x="18" y="83" width="340" height="9" fill="#091510"/>
  <text x="188" y="80" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Recovery screen (your locked PC)</text>

  <!-- Blue BIOS-style screen -->
  <rect x="30" y="96" width="316" height="222" fill="#000c1e" rx="6" stroke="#1e4a8a" stroke-width="1.5"/>
  <text x="188" y="122" fill="#60a5fa" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">BitLocker Recovery</text>
  <text x="188" y="142" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Enter the recovery key for this drive</text>
  <line x1="46" y1="150" x2="330" y2="150" stroke="#1e3a22" stroke-width="1"/>

  <text x="50" y="172" fill="#A8C4B0" font-size="13" font-family="monospace">Key ID (first 8 characters):</text>
  <!-- Key ID highlight box -->
  <rect x="46" y="180" width="284" height="34" fill="#071840" rx="4" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="64" cy="197" r="6" fill="#ef4444"/>
  <text x="188" y="202" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">A3F7-9C2E</text>

  <text x="188" y="232" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Enter 48-digit recovery key:</text>
  <rect x="46" y="240" width="284" height="26" fill="#000814" rx="4" stroke="#1e3a22" stroke-width="1"/>
  <text x="188" y="257" fill="#2a5236" font-size="13" font-family="monospace" text-anchor="middle">______-______-______-______</text>

  <text x="188" y="296" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">⚠ Note this Key ID before typing!</text>

  <!-- Match arrow -->
  <text x="390" y="200" fill="#00E5A0" font-size="28" text-anchor="middle">→</text>
  <text x="390" y="220" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">match</text>

  <!-- Microsoft account panel (right) -->
  <rect x="420" y="62" width="362" height="268" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="601" y="88" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">account.microsoft.com → Devices</text>
  <line x1="434" y1="96" x2="768" y2="96" stroke="#1e3a22" stroke-width="1"/>

  <!-- Key entry: MATCH -->
  <rect x="434" y="104" width="334" height="58" fill="#071840" rx="6" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="450" y="124" fill="#7FB09A" font-size="12" font-family="monospace">Key ID:</text>
  <text x="510" y="124" fill="#D4EAD8" font-size="16" font-family="monospace" font-weight="bold">A3F7-9C2E</text>
  <circle cx="750" cy="118" r="12" fill="#00E5A0" opacity="0.2"/>
  <text x="750" y="123" fill="#00E5A0" font-size="14" text-anchor="middle" font-weight="bold">✓</text>
  <text x="450" y="148" fill="#A8C4B0" font-size="13" font-family="monospace">Key: 123456-789012-345678-9012...</text>

  <!-- Key entry: NO MATCH 1 -->
  <rect x="434" y="170" width="334" height="58" fill="#091510" rx="6" stroke="#1e3a22" stroke-width="1"/>
  <text x="450" y="190" fill="#7FB09A" font-size="12" font-family="monospace">Key ID:</text>
  <text x="510" y="190" fill="#A8C4B0" font-size="14" font-family="monospace">B1D4-5E8F</text>
  <circle cx="750" cy="184" r="12" fill="#ef4444" opacity="0.15"/>
  <text x="750" y="189" fill="#ef4444" font-size="14" text-anchor="middle">✕</text>
  <text x="450" y="214" fill="#2a5236" font-size="13" font-family="monospace">Key: 654321-098765-432109-8765...</text>

  <!-- Key entry: NO MATCH 2 -->
  <rect x="434" y="236" width="334" height="58" fill="#091510" rx="6" stroke="#1e3a22" stroke-width="1"/>
  <text x="450" y="256" fill="#7FB09A" font-size="12" font-family="monospace">Key ID:</text>
  <text x="510" y="256" fill="#A8C4B0" font-size="14" font-family="monospace">C9A2-1B7D</text>
  <circle cx="750" cy="250" r="12" fill="#ef4444" opacity="0.15"/>
  <text x="750" y="255" fill="#ef4444" font-size="14" text-anchor="middle">✕</text>
  <text x="450" y="280" fill="#2a5236" font-size="13" font-family="monospace">Key: 112233-445566-778899-0011...</text>

  <!-- Divider -->
  <line x1="40" y1="350" x2="760" y2="350" stroke="#1e3a22" stroke-width="1"/>

  <!-- Bottom tip -->
  <rect x="18" y="362" width="764" height="64" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="400" y="386" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Only use the key whose ID exactly matches the screen</text>
  <text x="400" y="412" fill="#A8C4B0" font-size="14" font-family="monospace" text-anchor="middle">If you have multiple keys, try each one whose ID starts with A3F7 — the full ID is shown on the recovery screen</text>
</svg>
