<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Windows digital license: linked to Microsoft account and hardware fingerprint — no product key needed. If not working, sign in to Microsoft account and run troubleshooter">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#0A130E" rx="12"/>
  <rect width="800" height="260" fill="url(#g)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">WINDOWS DIGITAL LICENSE — HOW IT WORKS</text>

  <!-- How digital license works -->
  <rect x="20" y="38" width="180" height="120" fill="#0d1810" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="62" fill="#3b82f6" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Your PC</text>
  <text x="110" y="82" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Hardware ID</text>
  <text x="110" y="98" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">(CPU + mobo hash)</text>
  <text x="110" y="116" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Sent to MS servers</text>
  <text x="110" y="132" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">on activation</text>
  <text x="110" y="152" fill="#3b82f6" font-size="11" font-family="monospace" text-anchor="middle">Linked forever ✓</text>

  <line x1="202" y1="98" x2="238" y2="98" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MS Account -->
  <rect x="240" y="38" width="180" height="120" fill="#0d1a12" rx="10" stroke="#00E5A0" stroke-width="2"/>
  <text x="330" y="62" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">MS Account</text>
  <text x="330" y="82" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">License stored in</text>
  <text x="330" y="98" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">your account</text>
  <text x="330" y="116" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Survives reinstall</text>
  <text x="330" y="136" fill="#00E5A0" font-size="11" font-family="monospace" text-anchor="middle">No key needed ✓</text>
  <text x="330" y="152" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Auto-activates</text>

  <line x1="422" y1="98" x2="458" y2="98" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Activation check -->
  <rect x="460" y="38" width="180" height="120" fill="#0d1810" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="62" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Not Working?</text>
  <text x="550" y="82" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Sign in to same</text>
  <text x="550" y="98" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">Microsoft account</text>
  <text x="550" y="116" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">Settings → Activation</text>
  <text x="550" y="132" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">→ Troubleshoot</text>
  <text x="550" y="152" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Add MS account first</text>

  <!-- Hardware change note -->
  <rect x="660" y="38" width="120" height="120" fill="#1a0d0d" rx="10" stroke="#ef4444" stroke-width="1.5"/>
  <text x="720" y="64" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Hw Change</text>
  <text x="720" y="84" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">New CPU or</text>
  <text x="720" y="100" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">motherboard</text>
  <text x="720" y="118" fill="#ef4444" font-size="11" font-family="monospace" text-anchor="middle">May deactivate</text>
  <text x="720" y="136" fill="#f59e0b" font-size="11" font-family="monospace" text-anchor="middle">→ Troubleshoot</text>
  <text x="720" y="152" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">to relink</text>

  <!-- Bottom instructions -->
  <rect x="20" y="174" width="760" height="72" fill="#0d1810" rx="8" stroke="#1e3a22"/>
  <text x="400" y="196" fill="#F0F4F1" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix Steps When Digital License Fails</text>
  <text x="130" y="218" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">① Settings → Activation</text>
  <text x="320" y="218" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">② Add MS account</text>
  <text x="510" y="218" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">③ Click Troubleshoot</text>
  <text x="690" y="218" fill="#93B5A0" font-size="12" font-family="monospace" text-anchor="middle">④ Select hardware changed</text>
  <text x="400" y="238" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">If troubleshooter fails: slmgr /upk → slmgr /cpky → then re-activate via Settings</text>
</svg>
