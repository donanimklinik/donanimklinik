<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Router DNS settings: change from ISP default DNS to Google 8.8.8.8 or Cloudflare 1.1.1.1, results in faster and more private browsing">
  <defs>
    <pattern id="dsg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="darr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity=".8"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#091510" rx="10"/>
  <rect width="800" height="460" fill="url(#dsg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Router DNS Settings — How to Change</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#1e3a22" stroke-width="1"/>

  <!-- LEFT PANEL: What is DNS -->
  <rect x="24" y="62" width="240" height="376" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <rect x="24" y="62" width="240" height="34" fill="#0a1f10" rx="8"/>
  <rect x="24" y="88" width="240" height="8" fill="#0a1f10"/>
  <text x="144" y="86" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">What is DNS?</text>

  <!-- DNS Flow diagram -->
  <text x="144" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">How DNS resolves a website:</text>

  <!-- Device box -->
  <rect x="36" y="128" width="56" height="38" fill="#0d1e16" rx="4" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="39" y="131" width="50" height="28" fill="#091510" rx="1"/>
  <text x="64" y="175" fill="#D4EAD8" font-size="12" font-family="monospace" text-anchor="middle">Your PC</text>

  <!-- Arrow PC to DNS -->
  <line x1="94" y1="147" x2="128" y2="147" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#darr)"/>
  <text x="111" y="141" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">lookup</text>

  <!-- DNS Server box -->
  <rect x="130" y="128" width="58" height="38" fill="#0d1e16" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="159" y="150" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">DNS</text>
  <text x="159" y="175" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">8.8.8.8</text>

  <!-- Arrow DNS to website -->
  <line x1="190" y1="147" x2="222" y2="147" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#darr)"/>
  <text x="206" y="141" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">IP →</text>

  <!-- Website box -->
  <rect x="194" y="128" width="58" height="38" fill="#0d1e16" rx="4" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="223" y="150" fill="#3b82f6" font-size="13" font-family="monospace" text-anchor="middle">Google</text>
  <text x="223" y="175" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Website</text>

  <text x="144" y="198" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">DNS = phonebook for the internet</text>
  <text x="144" y="215" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">name → IP address translation</text>

  <!-- Divider -->
  <line x1="30" y1="228" x2="258" y2="228" stroke="#1e3a22" stroke-width="1"/>

  <!-- Provider comparison table -->
  <text x="144" y="250" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">DNS Provider Comparison</text>
  <line x1="30" y1="258" x2="258" y2="258" stroke="#1e3a22" stroke-width="1"/>

  <!-- Table header -->
  <text x="90" y="276" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Provider</text>
  <text x="210" y="276" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Primary IP</text>
  <line x1="155" y1="258" x2="155" y2="430" stroke="#1e3a22" stroke-width="1"/>
  <line x1="30" y1="282" x2="258" y2="282" stroke="#1e3a22" stroke-width="0.8"/>

  <text x="90" y="302" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">ISP Default</text>
  <text x="210" y="302" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">varies</text>
  <line x1="30" y1="310" x2="258" y2="310" stroke="#1e3a22" stroke-width="0.8"/>

  <text x="90" y="330" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Google DNS</text>
  <text x="210" y="330" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle">8.8.8.8</text>
  <line x1="30" y1="338" x2="258" y2="338" stroke="#1e3a22" stroke-width="0.8"/>

  <text x="90" y="358" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Cloudflare</text>
  <text x="210" y="358" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle">1.1.1.1</text>
  <line x1="30" y1="366" x2="258" y2="366" stroke="#1e3a22" stroke-width="0.8"/>

  <text x="90" y="386" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">OpenDNS</text>
  <text x="210" y="386" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">208.67.222.222</text>
  <line x1="30" y1="394" x2="258" y2="394" stroke="#1e3a22" stroke-width="0.8"/>

  <text x="144" y="416" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Google &amp; Cloudflare:</text>
  <text x="144" y="432" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">fastest, free, reliable</text>

  <!-- RIGHT PANEL: Settings panel mockup -->
  <rect x="282" y="62" width="494" height="376" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <!-- Browser chrome -->
  <rect x="282" y="62" width="494" height="34" fill="#0a1f10" rx="8"/>
  <rect x="282" y="88" width="494" height="8" fill="#0a1f10"/>
  <circle cx="300" cy="79" r="5" fill="#1e3a22"/>
  <circle cx="317" cy="79" r="5" fill="#1e3a22"/>
  <circle cx="334" cy="79" r="5" fill="#1e3a22"/>
  <rect x="352" y="70" width="210" height="16" fill="#091510" rx="3" stroke="#2a5236"/>
  <text x="457" y="82" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">192.168.1.1 / LAN / DNS</text>

  <!-- Sidebar nav -->
  <rect x="288" y="100" width="116" height="330" fill="#091510" rx="3" stroke="#1e3a22"/>
  <text x="346" y="122" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Wireless</text>
  <text x="346" y="146" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">WAN / Internet</text>
  <rect x="292" y="153" width="108" height="20" fill="#00E5A0" rx="2" opacity=".12" stroke="#00E5A0" stroke-width="1"/>
  <text x="346" y="167" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">► LAN / DNS</text>
  <text x="346" y="192" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Security</text>
  <text x="346" y="216" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Advanced</text>
  <text x="346" y="240" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Firewall</text>

  <!-- Main DNS form area -->
  <rect x="412" y="100" width="356" height="330" fill="#091510" rx="3" stroke="#1e3a22"/>
  <text x="428" y="125" fill="#D4EAD8" font-size="16" font-family="monospace" font-weight="bold">DNS Server Settings</text>
  <line x1="416" y1="134" x2="764" y2="134" stroke="#1e3a22" stroke-width="1"/>

  <!-- DNS Mode row -->
  <text x="428" y="162" fill="#A8C4B0" font-size="13" font-family="monospace">DNS Mode</text>
  <rect x="540" y="148" width="216" height="22" fill="#0d1e16" rx="3" stroke="#2a5236"/>
  <text x="648" y="163" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Manual (Use custom DNS)  ▾</text>

  <!-- Primary DNS row -->
  <text x="428" y="198" fill="#A8C4B0" font-size="13" font-family="monospace">Primary DNS</text>
  <rect x="540" y="184" width="148" height="22" fill="#0d1e16" rx="3" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="614" y="199" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">8.8.8.8</text>
  <!-- callout -->
  <line x1="690" y1="192" x2="718" y2="182" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".7"/>
  <rect x="718" y="172" width="88" height="24" fill="#0d1e16" rx="3" stroke="#00E5A0" stroke-width="1"/>
  <text x="762" y="187" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">Google DNS</text>

  <!-- Secondary DNS row -->
  <text x="428" y="236" fill="#A8C4B0" font-size="13" font-family="monospace">Secondary DNS</text>
  <rect x="540" y="222" width="148" height="22" fill="#0d1e16" rx="3" stroke="#2a5236"/>
  <text x="614" y="237" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">8.8.4.4</text>
  <!-- callout -->
  <line x1="690" y1="230" x2="718" y2="222" stroke="#A8C4B0" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
  <rect x="718" y="210" width="88" height="24" fill="#0d1e16" rx="3" stroke="#2a5236"/>
  <text x="762" y="225" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Google fallback</text>

  <!-- Cloudflare alternative -->
  <rect x="424" y="258" width="330" height="52" fill="#0d1e16" rx="4" stroke="#2a5236"/>
  <text x="436" y="276" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Alternative — Cloudflare (best privacy):</text>
  <text x="436" y="298" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">Primary: 1.1.1.1   Secondary: 1.0.0.1</text>

  <!-- Apply button -->
  <rect x="424" y="326" width="100" height="26" fill="#00E5A0" rx="4" opacity=".9"/>
  <text x="474" y="343" fill="#091510" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Save &amp; Apply</text>

  <!-- Benefits row -->
  <text x="544" y="342" fill="#D4EAD8" font-size="14" font-family="monospace">✓ Faster browsing</text>
  <text x="544" y="360" fill="#D4EAD8" font-size="14" font-family="monospace">✓ More reliable</text>
  <text x="544" y="378" fill="#D4EAD8" font-size="14" font-family="monospace">✓ Better privacy</text>

  <!-- Bottom warning -->
  <rect x="24" y="448" width="752" height="6" fill="none"/>
</svg>
