<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Router DNS settings: change from ISP default DNS to Google 8.8.8.8 or Cloudflare 1.1.1.1, results in faster and more private browsing">
  <defs>
    <pattern id="dsg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="780" height="240" fill="#0A130E" rx="10"/>
  <rect width="780" height="240" fill="url(#dsg)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">ROUTER DNS SETTINGS — HOW TO CHANGE</text>

  <!-- ══ LEFT: How DNS works ══ -->
  <rect x="20" y="30" width="220" height="196" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <rect x="20" y="30" width="220" height="24" fill="#0a1509" rx="8"/>
  <rect x="20" y="47" width="220" height="8" fill="#0a1509"/>
  <text x="130" y="47" fill="#6B7F72" font-size="8.5" font-family="monospace" text-anchor="middle">WHAT IS DNS?</text>

  <!-- DNS flow diagram -->
  <!-- Device -->
  <rect x="32" y="62" width="40" height="28" fill="#0d1810" rx="4" stroke="#3b82f6" stroke-width="1"/>
  <rect x="34" y="64" width="36" height="20" fill="#0A130E" rx="1"/>
  <text x="52" y="98" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Your PC</text>

  <!-- arrow right -->
  <line x1="75" y1="76" x2="103" y2="76" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="89" y="69" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">lookup</text>
  <text x="89" y="92" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">google.com?</text>

  <!-- DNS server -->
  <rect x="106" y="62" width="42" height="28" fill="#0d1810" rx="4" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="127" y="79" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">DNS</text>
  <text x="127" y="98" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">8.8.8.8</text>

  <!-- arrow right -->
  <line x1="151" y1="76" x2="178" y2="76" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="165" y="69" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">IP:</text>
  <text x="165" y="92" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">142.250.x</text>

  <!-- Website -->
  <rect x="180" y="62" width="46" height="28" fill="#0d1810" rx="4" stroke="#3b82f6" stroke-width="1"/>
  <text x="203" y="79" fill="#3b82f6" font-size="7.5" font-family="monospace" text-anchor="middle">Google</text>
  <text x="203" y="98" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Website</text>

  <text x="130" y="116" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">DNS = phone book for the internet</text>
  <text x="130" y="127" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">name → IP address translation</text>

  <!-- Comparison table -->
  <line x1="26" y1="138" x2="234" y2="138" stroke="#1e3a22" stroke-width="1"/>
  <text x="80" y="150" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">DNS Provider</text>
  <text x="180" y="150" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">Primary IP</text>
  <line x1="26" y1="154" x2="234" y2="154" stroke="#1e3a22" stroke-width=".8"/>
  <line x1="130" y1="138" x2="130" y2="220" stroke="#1e3a22" stroke-width=".8"/>

  <text x="80" y="165" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">ISP Default</text>
  <text x="180" y="165" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">varies</text>
  <line x1="26" y1="168" x2="234" y2="168" stroke="#1e3a22" stroke-width=".6"/>

  <text x="80" y="179" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">Google DNS</text>
  <text x="180" y="179" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">8.8.8.8</text>
  <line x1="26" y1="182" x2="234" y2="182" stroke="#1e3a22" stroke-width=".6"/>

  <text x="80" y="193" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">Cloudflare</text>
  <text x="180" y="193" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">1.1.1.1</text>
  <line x1="26" y1="196" x2="234" y2="196" stroke="#1e3a22" stroke-width=".6"/>

  <text x="80" y="207" fill="#F0F4F1" font-size="7.5" font-family="monospace" text-anchor="middle">OpenDNS</text>
  <text x="180" y="207" fill="#4a5e4e" font-size="7.5" font-family="monospace" text-anchor="middle">208.67.222.222</text>
  <line x1="26" y1="210" x2="234" y2="210" stroke="#1e3a22" stroke-width=".6"/>

  <text x="130" y="220" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">Google &amp; Cloudflare: fastest, free</text>

  <!-- ══ RIGHT: Settings panel ══ -->
  <rect x="254" y="30" width="506" height="196" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <!-- Browser chrome -->
  <rect x="254" y="30" width="506" height="24" fill="#0a1509" rx="8"/>
  <rect x="254" y="47" width="506" height="8" fill="#0a1509"/>
  <circle cx="270" cy="42" r="4" fill="#1e3a22"/>
  <circle cx="284" cy="42" r="4" fill="#1e3a22"/>
  <circle cx="298" cy="42" r="4" fill="#1e3a22"/>
  <rect x="314" y="36" width="190" height="12" fill="#0A130E" rx="3" stroke="#243d28"/>
  <text x="409" y="46" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">192.168.1.1 / WAN Settings</text>

  <!-- Nav sidebar -->
  <rect x="260" y="60" width="100" height="158" fill="#0A130E" rx="3" stroke="#1e3a22"/>
  <text x="310" y="76" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">Wireless</text>
  <text x="310" y="90" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">WAN / Internet</text>
  <rect x="263" y="95" width="94" height="14" fill="#00E5A0" rx="2" opacity=".1" stroke="#00E5A0" stroke-width="1"/>
  <text x="310" y="105" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">► LAN / DNS</text>
  <text x="310" y="120" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">Security</text>
  <text x="310" y="134" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">Advanced</text>
  <text x="310" y="148" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">Firewall</text>

  <!-- Main DNS form -->
  <rect x="368" y="60" width="384" height="158" fill="#0A130E" rx="3" stroke="#1e3a22"/>
  <text x="386" y="77" fill="#F0F4F1" font-size="10.5" font-family="monospace">DNS Server Settings</text>
  <line x1="372" y1="83" x2="748" y2="83" stroke="#1e3a22" stroke-width="1"/>

  <!-- DNS Mode row -->
  <text x="386" y="100" fill="#6B7F72" font-size="9" font-family="monospace">DNS Mode</text>
  <rect x="510" y="89" width="200" height="16" fill="#111e14" rx="3" stroke="#243d28"/>
  <text x="610" y="101" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">Manual (Use these DNS servers)  ▾</text>

  <!-- Primary DNS row -->
  <text x="386" y="123" fill="#6B7F72" font-size="9" font-family="monospace">Primary DNS</text>
  <rect x="510" y="112" width="130" height="16" fill="#111e14" rx="3" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="575" y="124" fill="#00E5A0" font-size="9.5" font-family="monospace" text-anchor="middle">8.8.8.8</text>
  <!-- callout -->
  <line x1="642" y1="120" x2="668" y2="114" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="668" y="106" width="72" height="18" fill="#0d1810" rx="3" stroke="#00E5A0" stroke-width="1" opacity=".8"/>
  <text x="704" y="118" fill="#00E5A0" font-size="7.5" font-family="monospace" text-anchor="middle">Google DNS</text>

  <!-- Secondary DNS row -->
  <text x="386" y="145" fill="#6B7F72" font-size="9" font-family="monospace">Secondary DNS</text>
  <rect x="510" y="134" width="130" height="16" fill="#111e14" rx="3" stroke="#243d28"/>
  <text x="575" y="146" fill="#F0F4F1" font-size="9.5" font-family="monospace" text-anchor="middle">8.8.4.4</text>
  <!-- callout -->
  <line x1="642" y1="142" x2="668" y2="136" stroke="#4a5e4e" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  <rect x="668" y="128" width="72" height="18" fill="#0d1810" rx="3" stroke="#243d28" opacity=".8"/>
  <text x="704" y="140" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">Google fallback</text>

  <!-- Cloudflare alt note -->
  <rect x="384" y="157" width="270" height="20" fill="#0d1810" rx="3" stroke="#1e3a22"/>
  <text x="392" y="167" fill="#4a5e4e" font-size="7.5" font-family="monospace">Alternative (Cloudflare):</text>
  <text x="392" y="174" fill="#00E5A0" font-size="7.5" font-family="monospace">1.1.1.1  /  1.0.0.1</text>
  <text x="540" y="174" fill="#4a5e4e" font-size="7.5" font-family="monospace">— best privacy</text>

  <!-- Apply button -->
  <rect x="384" y="185" width="80" height="16" fill="#00E5A0" rx="3" opacity=".85"/>
  <text x="424" y="196" fill="#0A130E" font-size="8.5" font-family="monospace" text-anchor="middle" font-weight="bold">Save</text>

  <!-- Benefits -->
  <text x="478" y="198" fill="#F0F4F1" font-size="7.5" font-family="monospace">✓ Faster browsing</text>
  <text x="590" y="198" fill="#F0F4F1" font-size="7.5" font-family="monospace">✓ More reliable</text>
  <text x="690" y="198" fill="#F0F4F1" font-size="7.5" font-family="monospace">✓ Better privacy</text>

  <!-- Bottom note -->
  <rect x="254" y="232" width="506" height="0" fill="none"/>
</svg>
