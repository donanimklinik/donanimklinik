<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Home network topology: Internet connects to modem, modem connects to router via Ethernet, router broadcasts WiFi to laptop, phone, and smart TV">
  <defs>
    <pattern id="tgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="arr-eth" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-isp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1e3a22"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#091510" rx="10"/>
  <rect width="800" height="420" fill="url(#tgrid)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Home Network Topology</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">How internet signal flows from ISP to your devices</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- INTERNET cloud -->
  <rect x="24" y="100" width="120" height="112" fill="#0d1e16" rx="8" stroke="#1e3a22" stroke-width="1.5"/>
  <ellipse cx="84" cy="148" rx="30" ry="20" fill="none" stroke="#00E5A0" stroke-width="1.8" opacity="0.7"/>
  <ellipse cx="66" cy="158" rx="20" ry="13" fill="none" stroke="#00E5A0" stroke-width="1.8" opacity="0.7"/>
  <ellipse cx="102" cy="158" rx="20" ry="13" fill="none" stroke="#00E5A0" stroke-width="1.8" opacity="0.7"/>
  <rect x="54" y="160" width="60" height="8" fill="#0d1e16"/>
  <text x="84" y="190" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Internet</text>
  <text x="84" y="206" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">ISP signal</text>

  <!-- ISP → Modem (coax/fiber) -->
  <line x1="144" y1="158" x2="186" y2="158" stroke="#1e3a22" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-isp)"/>
  <text x="165" y="148" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Coax/</text>
  <text x="165" y="164" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Fiber</text>

  <!-- MODEM -->
  <rect x="190" y="100" width="120" height="112" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.5"/>
  <!-- Modem body -->
  <rect x="216" y="118" width="68" height="52" fill="#091510" rx="4" stroke="#2a5236" stroke-width="1"/>
  <!-- LEDs -->
  <circle cx="228" cy="132" r="5" fill="#00E5A0"/>
  <circle cx="244" cy="132" r="5" fill="#00E5A0" opacity="0.5"/>
  <circle cx="260" cy="132" r="5" fill="#00E5A0" opacity="0.3"/>
  <text x="232" y="150" fill="#A8C4B0" font-size="12" font-family="monospace">PWR DS US</text>
  <!-- Port -->
  <rect x="226" y="156" width="48" height="10" fill="#091510" rx="2" stroke="#1e3a22"/>
  <text x="250" y="190" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Modem</text>
  <text x="250" y="206" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">converts signal</text>

  <!-- Modem → Router (Ethernet) -->
  <line x1="310" y1="158" x2="360" y2="158" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr-eth)"/>
  <rect x="308" y="153" width="8" height="10" fill="#3b82f6" rx="1"/>
  <rect x="360" y="153" width="8" height="10" fill="#3b82f6" rx="1"/>
  <text x="335" y="145" fill="#3b82f6" font-size="13" font-family="monospace" text-anchor="middle">Ethernet</text>
  <text x="335" y="174" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Cat 5e/6</text>

  <!-- ROUTER (center) -->
  <rect x="364" y="88" width="140" height="132" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.8"/>
  <!-- Antennas -->
  <line x1="400" y1="112" x2="397" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="397" cy="88" r="4" fill="#3b82f6"/>
  <line x1="434" y1="112" x2="434" y2="88" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="434" cy="86" r="4" fill="#3b82f6"/>
  <line x1="468" y1="112" x2="471" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="471" cy="88" r="4" fill="#3b82f6"/>
  <!-- Router body -->
  <rect x="378" y="112" width="112" height="60" fill="#091510" rx="4" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- LEDs -->
  <circle cx="394" cy="128" r="5" fill="#00E5A0"/>
  <circle cx="410" cy="128" r="5" fill="#3b82f6"/>
  <circle cx="426" cy="128" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="442" cy="128" r="5" fill="#00E5A0" opacity="0.4"/>
  <!-- Ports -->
  <rect x="384" y="148" width="80" height="14" fill="#091510" rx="2" stroke="#1e3a22"/>
  <rect x="388" y="150" width="14" height="10" fill="#1e3a22" rx="1"/>
  <rect x="406" y="150" width="14" height="10" fill="#1e3a22" rx="1"/>
  <rect x="424" y="150" width="14" height="10" fill="#1e3a22" rx="1"/>
  <rect x="442" y="150" width="14" height="10" fill="#3b82f6" rx="1" opacity="0.6"/>
  <text x="434" y="192" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">WiFi Router</text>
  <text x="434" y="210" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">broadcasts WiFi</text>

  <!-- WiFi waves from router -->
  <path d="M508,120 Q528,158 508,196" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <path d="M508,108 Q536,158 508,208" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M508,96 Q546,158 508,220" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.18" stroke-linecap="round"/>

  <!-- LAPTOP -->
  <rect x="548" y="82" width="100" height="68" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1"/>
  <rect x="554" y="88" width="88" height="52" fill="#091510" rx="2"/>
  <rect x="558" y="92" width="80" height="44" fill="#091510" rx="1"/>
  <rect x="562" y="96" width="48" height="6" fill="#1e3a22" rx="1"/>
  <rect x="562" y="106" width="68" height="4" fill="#111e14" rx="1"/>
  <rect x="562" y="114" width="56" height="4" fill="#111e14" rx="1"/>
  <rect x="538" y="150" width="120" height="8" fill="#0d1e16" rx="2" stroke="#1e3a22"/>
  <text x="598" y="174" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Laptop</text>
  <!-- WiFi dash to router -->
  <line x1="548" y1="120" x2="512" y2="148" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- PHONE -->
  <rect x="562" y="220" width="42" height="72" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1"/>
  <rect x="567" y="228" width="32" height="54" fill="#091510" rx="2"/>
  <circle cx="583" cy="286" r="4" fill="#1e3a22"/>
  <text x="583" y="308" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Phone</text>
  <line x1="562" y1="248" x2="512" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- SMART TV -->
  <rect x="638" y="220" width="124" height="78" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1"/>
  <rect x="644" y="226" width="112" height="58" fill="#091510" rx="2"/>
  <rect x="648" y="230" width="104" height="48" fill="#091510" rx="1"/>
  <rect x="652" y="234" width="52" height="6" fill="#1e3a22" rx="1"/>
  <rect x="652" y="244" width="88" height="4" fill="#111e14" rx="1"/>
  <rect x="652" y="252" width="70" height="4" fill="#111e14" rx="1"/>
  <rect x="686" y="298" width="34" height="8" fill="#0d1e16" rx="2" stroke="#1e3a22"/>
  <text x="700" y="320" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Smart TV</text>
  <line x1="638" y1="248" x2="512" y2="168" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Legend -->
  <rect x="24" y="360" width="752" height="48" fill="#0d1e16" rx="6" stroke="#2a5236"/>
  <line x1="44" y1="382" x2="80" y2="382" stroke="#1e3a22" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="88" y="386" fill="#D4EAD8" font-size="14" font-family="monospace">ISP cable (coax/fiber)</text>
  <line x1="290" y1="382" x2="326" y2="382" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="334" y="386" fill="#D4EAD8" font-size="14" font-family="monospace">Ethernet (Cat 5e/6)</text>
  <line x1="540" y1="382" x2="576" y2="382" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="584" y="386" fill="#D4EAD8" font-size="14" font-family="monospace">WiFi 2.4/5 GHz</text>
  <text x="40" y="402" fill="#7FB09A" font-size="13" font-family="monospace">Max speed: limited by slowest link — use Ethernet for speed-critical devices (PC, gaming, streaming)</text>
</svg>
