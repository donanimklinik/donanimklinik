<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-label="Home network topology: Internet connects to modem, modem connects to router via Ethernet, router broadcasts WiFi to laptop, phone, and smart TV">
  <defs>
    <pattern id="tgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.8"/>
    </pattern>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1e3a22"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="230" fill="#0A130E" rx="10"/>
  <rect width="780" height="230" fill="url(#tgrid)" rx="10"/>

  <!-- Title -->
  <text x="390" y="22" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">HOME NETWORK TOPOLOGY</text>

  <!-- ── INTERNET ── -->
  <rect x="20" y="70" width="110" height="90" fill="#111e14" rx="8" stroke="#1e3a22" stroke-width="1.5"/>
  <!-- Cloud shape -->
  <ellipse cx="75" cy="105" rx="28" ry="18" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="60" cy="112" rx="18" ry="12" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="90" cy="112" rx="18" ry="12" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0.7"/>
  <rect x="47" y="112" width="56" height="8" fill="#111e14"/>
  <text x="75" y="142" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle">Internet</text>
  <text x="75" y="155" fill="#1e3a22" font-size="9" font-family="monospace" text-anchor="middle">ISP</text>

  <!-- ISP → Modem line (coax/fiber) -->
  <line x1="130" y1="115" x2="185" y2="115" stroke="#1e3a22" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="157" y="108" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">Coax / Fiber</text>

  <!-- ── MODEM ── -->
  <rect x="185" y="70" width="110" height="90" fill="#111e14" rx="8" stroke="#1e3a22" stroke-width="1.5"/>
  <!-- Modem body -->
  <rect x="208" y="88" width="64" height="44" fill="#0d1810" rx="4" stroke="#243d28" stroke-width="1"/>
  <!-- LEDs -->
  <circle cx="219" cy="98" r="3" fill="#00E5A0" filter="url(#glow)"/>
  <circle cx="231" cy="98" r="3" fill="#00E5A0" opacity="0.5"/>
  <circle cx="243" cy="98" r="3" fill="#00E5A0" opacity="0.3"/>
  <!-- Port -->
  <rect x="218" y="108" width="44" height="10" fill="#0A130E" rx="2" stroke="#1e3a22"/>
  <text x="240" y="152" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle">Modem</text>

  <!-- Modem → Router (Ethernet) -->
  <line x1="295" y1="115" x2="355" y2="115" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="325" y="108" fill="#5a7abf" font-size="8" font-family="monospace" text-anchor="middle">Ethernet</text>
  <!-- Plug icons -->
  <rect x="293" y="111" width="6" height="8" fill="#3b82f6" rx="1"/>
  <rect x="355" y="111" width="6" height="8" fill="#3b82f6" rx="1"/>

  <!-- ── ROUTER ── -->
  <rect x="355" y="60" width="130" height="110" fill="#111e14" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Antennas -->
  <line x1="385" y1="85" x2="382" y2="65" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="382" cy="63" r="2.5" fill="#3b82f6"/>
  <line x1="420" y1="85" x2="420" y2="63" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="420" cy="61" r="2.5" fill="#3b82f6"/>
  <line x1="455" y1="85" x2="458" y2="65" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="458" cy="63" r="2.5" fill="#3b82f6"/>
  <!-- Router body -->
  <rect x="368" y="85" width="104" height="50" fill="#0d1810" rx="4" stroke="#3b82f6" stroke-width="1"/>
  <!-- LEDs -->
  <circle cx="382" cy="96" r="3" fill="#00E5A0" filter="url(#glow)"/>
  <circle cx="394" cy="96" r="3" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="406" cy="96" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="418" cy="96" r="3" fill="#00E5A0" opacity="0.4"/>
  <!-- Ports -->
  <rect x="375" y="108" width="74" height="12" fill="#0A130E" rx="2" stroke="#1e3a22"/>
  <rect x="379" y="110" width="12" height="8" fill="#1e3a22" rx="1"/>
  <rect x="395" y="110" width="12" height="8" fill="#1e3a22" rx="1"/>
  <rect x="411" y="110" width="12" height="8" fill="#1e3a22" rx="1"/>
  <rect x="427" y="110" width="12" height="8" fill="#3b82f6" rx="1" opacity="0.6"/>
  <text x="420" y="155" fill="#93c5fd" font-size="10" font-family="monospace" text-anchor="middle">WiFi Router</text>

  <!-- WiFi waves -->
  <path d="M492,90 Q510,115 492,140" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M492,80 Q520,115 492,150" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <path d="M492,70 Q532,115 492,160" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.18" stroke-linecap="round"/>

  <!-- ── LAPTOP ── -->
  <rect x="535" y="42" width="90" height="58" fill="#111e14" rx="6" stroke="#1e3a22" stroke-width="1"/>
  <rect x="540" y="47" width="80" height="44" fill="#0d1810" rx="2"/>
  <rect x="544" y="51" width="72" height="36" fill="#0A130E" rx="1"/>
  <!-- Screen content -->
  <rect x="548" y="55" width="40" height="4" fill="#1e3a22" rx="1"/>
  <rect x="548" y="62" width="60" height="3" fill="#111e14" rx="1"/>
  <rect x="548" y="68" width="50" height="3" fill="#111e14" rx="1"/>
  <rect x="525" y="100" width="110" height="7" fill="#0d1810" rx="2" stroke="#1e3a22"/>
  <text x="580" y="122" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle">Laptop</text>
  <!-- WiFi dashes -->
  <line x1="535" y1="72" x2="498" y2="102" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>

  <!-- ── PHONE ── -->
  <rect x="553" y="148" width="34" height="58" fill="#111e14" rx="7" stroke="#1e3a22" stroke-width="1"/>
  <rect x="557" y="153" width="26" height="44" fill="#0A130E" rx="2"/>
  <circle cx="570" cy="201" r="3" fill="#1e3a22"/>
  <text x="570" y="220" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle">Phone</text>
  <line x1="553" y1="168" x2="498" y2="125" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>

  <!-- ── SMART TV ── -->
  <rect x="627" y="148" width="100" height="60" fill="#111e14" rx="6" stroke="#1e3a22" stroke-width="1"/>
  <rect x="632" y="153" width="90" height="46" fill="#0A130E" rx="2"/>
  <!-- TV content -->
  <rect x="636" y="157" width="82" height="34" fill="#0d1810" rx="1"/>
  <rect x="640" y="161" width="40" height="3" fill="#1e3a22" rx="1"/>
  <rect x="640" y="167" width="70" height="3" fill="#111e14" rx="1"/>
  <rect x="640" y="173" width="55" height="3" fill="#111e14" rx="1"/>
  <rect x="657" y="208" width="28" height="6" fill="#0d1810" rx="2" stroke="#1e3a22"/>
  <text x="677" y="222" fill="#6B7F72" font-size="10" font-family="monospace" text-anchor="middle">Smart TV</text>
  <line x1="627" y1="170" x2="498" y2="120" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>

  <!-- Legend -->
  <line x1="20" y1="215" x2="44" y2="215" stroke="#1e3a22" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="48" y="218" fill="#4a5e4e" font-size="8" font-family="monospace">ISP cable</text>
  <line x1="100" y1="215" x2="124" y2="215" stroke="#3b82f6" stroke-width="2"/>
  <text x="128" y="218" fill="#4a5e4e" font-size="8" font-family="monospace">Ethernet</text>
  <line x1="186" y1="215" x2="210" y2="215" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="214" y="218" fill="#4a5e4e" font-size="8" font-family="monospace">WiFi</text>
</svg>
