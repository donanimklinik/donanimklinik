<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="How to connect modem to router: modem's single Ethernet port connects to router's WAN port (yellow), not the LAN ports numbered 1 to 4">
  <defs>
    <pattern id="pg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="10"/>
  <rect width="800" height="420" fill="url(#pg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Modem → Router: Which Ports to Use</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Modem's Ethernet/LAN out → Router's WAN port (not LAN ports)</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- MODEM (left) -->
  <rect x="24" y="88" width="218" height="200" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.5"/>
  <text x="133" y="114" fill="#D4EAD8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">MODEM</text>

  <!-- Coax input indicator -->
  <rect x="113" y="90" width="44" height="14" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="135" y="101" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Coax/Fiber in</text>
  <text x="135" y="82" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">↑ from wall (ISP)</text>

  <!-- Modem body LEDs -->
  <rect x="56" y="124" width="150" height="62" fill="#091510" rx="4" stroke="#2a5236"/>
  <circle cx="76" cy="155" r="7" fill="#00E5A0" opacity=".9"/>
  <text x="76" y="176" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="114" cy="155" r="7" fill="#00E5A0" opacity=".7"/>
  <text x="114" y="176" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Online</text>
  <circle cx="152" cy="155" r="7" fill="#00E5A0" opacity=".5"/>
  <text x="152" y="176" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">DS/US</text>
  <circle cx="190" cy="155" r="7" fill="#1e3a22"/>
  <text x="190" y="176" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">ETH</text>

  <!-- Correct Ethernet port (highlighted) -->
  <rect x="86" y="198" width="96" height="34" fill="#091510" rx="3" stroke="#00E5A0" stroke-width="2.5"/>
  <text x="134" y="213" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Ethernet / LAN</text>
  <text x="134" y="228" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">← USE THIS PORT</text>

  <text x="133" y="262" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Single port on most modems</text>
  <text x="133" y="278" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">May be labeled: LAN, ETH, or</text>
  <text x="133" y="293" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">just "Ethernet" with RJ-45 icon</text>

  <!-- ETHERNET CABLE (middle) -->
  <rect x="256" y="225" width="292" height="12" fill="#3b82f6" rx="3"/>
  <rect x="242" y="218" width="16" height="24" fill="#2563eb" rx="2"/>
  <rect x="546" y="218" width="16" height="24" fill="#2563eb" rx="2"/>
  <rect x="248" y="228" width="6" height="6" fill="#1d4ed8" rx="1"/>
  <rect x="550" y="228" width="6" height="6" fill="#1d4ed8" rx="1"/>
  <text x="400" y="214" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Standard Ethernet Cable (Cat 5e / Cat 6)</text>
  <text x="400" y="258" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Push firmly until you hear a click at both ends</text>

  <!-- ROUTER (right) -->
  <rect x="564" y="88" width="212" height="200" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Antennas -->
  <line x1="600" y1="112" x2="597" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="597" cy="88" r="4" fill="#3b82f6"/>
  <line x1="638" y1="112" x2="638" y2="88" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="638" cy="86" r="4" fill="#3b82f6"/>
  <line x1="676" y1="112" x2="678" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="678" cy="88" r="4" fill="#3b82f6"/>
  <line x1="714" y1="112" x2="716" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="716" cy="88" r="4" fill="#3b82f6"/>

  <text x="670" y="114" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">ROUTER</text>

  <!-- Router body LEDs -->
  <rect x="580" y="122" width="180" height="64" fill="#091510" rx="4" stroke="#3b82f6"/>
  <circle cx="600" cy="148" r="7" fill="#00E5A0" opacity=".9"/>
  <text x="600" y="168" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="636" cy="148" r="7" fill="#3b82f6" opacity=".8"/>
  <text x="636" y="168" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="672" cy="148" r="7" fill="#3b82f6" opacity=".5"/>
  <text x="672" y="168" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">2.4G</text>
  <circle cx="708" cy="148" r="7" fill="#3b82f6" opacity=".4"/>
  <text x="708" y="168" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">5G</text>

  <!-- WAN port (correct) -->
  <rect x="572" y="200" width="38" height="32" fill="#091510" rx="3" stroke="#00E5A0" stroke-width="2.5"/>
  <text x="591" y="214" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">WAN</text>
  <text x="591" y="228" fill="#00E5A0" font-size="14" text-anchor="middle">✓</text>

  <!-- Divider -->
  <line x1="614" y1="198" x2="614" y2="234" stroke="#1e3a22" stroke-width="1.5"/>

  <!-- LAN ports 1-4 (wrong for modem) -->
  <rect x="618" y="200" width="30" height="32" fill="#091510" rx="2" stroke="#1e3a22"/>
  <text x="633" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">LAN1</text>
  <rect x="652" y="200" width="30" height="32" fill="#091510" rx="2" stroke="#1e3a22"/>
  <text x="667" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">LAN2</text>
  <rect x="686" y="200" width="30" height="32" fill="#091510" rx="2" stroke="#1e3a22"/>
  <text x="701" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">LAN3</text>
  <rect x="720" y="200" width="30" height="32" fill="#091510" rx="2" stroke="#1e3a22"/>
  <text x="735" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">LAN4</text>

  <!-- X marks over LAN ports -->
  <text x="686" y="250" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">✕ Do not connect modem here</text>
  <text x="686" y="266" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">LAN ports = for your devices</text>
  <text x="686" y="282" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">(PC, TV, game console)</text>

  <!-- Port summary table -->
  <rect x="24" y="306" width="752" height="100" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <text x="400" y="328" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Port Summary</text>
  <line x1="32" y1="336" x2="768" y2="336" stroke="#1e3a22" stroke-width="1"/>

  <text x="60" y="358" fill="#A8C4B0" font-size="13" font-family="monospace">Port</text>
  <text x="200" y="358" fill="#A8C4B0" font-size="13" font-family="monospace">Color</text>
  <text x="320" y="358" fill="#A8C4B0" font-size="13" font-family="monospace">Use for</text>
  <text x="580" y="358" fill="#A8C4B0" font-size="13" font-family="monospace">Connect from</text>
  <line x1="32" y1="364" x2="768" y2="364" stroke="#1e3a22" stroke-width="1"/>

  <text x="60" y="384" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">WAN (Internet)</text>
  <text x="200" y="384" fill="#f59e0b" font-size="14" font-family="monospace">Yellow/blue</text>
  <text x="320" y="384" fill="#D4EAD8" font-size="14" font-family="monospace">Upstream internet</text>
  <text x="580" y="384" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">Modem's Ethernet/LAN port</text>

  <text x="60" y="398" fill="#A8C4B0" font-size="13" font-family="monospace">LAN 1–4</text>
  <text x="200" y="398" fill="#A8C4B0" font-size="13" font-family="monospace">Gray/black</text>
  <text x="320" y="398" fill="#A8C4B0" font-size="13" font-family="monospace">Wired devices</text>
  <text x="580" y="398" fill="#A8C4B0" font-size="13" font-family="monospace">PC, TV, game console (Ethernet)</text>
</svg>
