<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Unlock BitLocker without recovery key: options are Microsoft account online, Azure AD admin, Active Directory IT department, or last resort data wipe — AES-256 brute force is not feasible">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#3b82f6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#f59e0b"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Unlock BitLocker Without Recovery Key</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Center: Locked Drive -->
  <rect x="300" y="140" width="200" height="120" fill="#0d1e16" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="172" fill="#ef4444" font-size="32" text-anchor="middle">&#x1F512;</text>
  <text x="400" y="200" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Drive Locked</text>
  <text x="400" y="220" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">AES-256 encryption</text>
  <text x="400" y="238" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Brute force: not feasible</text>

  <!-- Option 1: Microsoft Account (top-left) -->
  <rect x="20" y="58" width="210" height="104" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="125" y="80" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Microsoft Account</text>
  <line x1="36" y1="88" x2="214" y2="88" stroke="#1e3a22" stroke-width="1"/>
  <text x="125" y="106" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">account.microsoft.com</text>
  <text x="125" y="124" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Devices &#x2192; BitLocker</text>
  <text x="125" y="148" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Most common fix ✓</text>
  <!-- Arrow to center -->
  <line x1="230" y1="110" x2="298" y2="170" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- Option 2: Azure AD (bottom-left) -->
  <rect x="20" y="272" width="210" height="104" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="294" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Azure AD (Work)</text>
  <line x1="36" y1="302" x2="214" y2="302" stroke="#1e3a22" stroke-width="1"/>
  <text x="125" y="320" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">IT admin runs PowerShell:</text>
  <text x="125" y="338" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">Get-ADBitLockerKeyPkg</text>
  <text x="125" y="360" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Work/school device only</text>
  <!-- Arrow to center -->
  <line x1="230" y1="310" x2="298" y2="258" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- Option 3: Active Directory (top-right) -->
  <rect x="570" y="58" width="210" height="104" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="675" y="80" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Active Directory</text>
  <line x1="586" y1="88" x2="764" y2="88" stroke="#1e3a22" stroke-width="1"/>
  <text x="675" y="106" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Domain IT admin</text>
  <text x="675" y="124" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">AD has escrowed key</text>
  <text x="675" y="148" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">Corporate PCs only</text>
  <!-- Arrow to center -->
  <line x1="570" y1="110" x2="502" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>

  <!-- Option 4: Last Resort (bottom-right) -->
  <rect x="570" y="272" width="210" height="104" fill="#0d1e16" rx="8" stroke="#ef4444" stroke-width="2"/>
  <text x="675" y="294" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Last Resort</text>
  <line x1="586" y1="302" x2="764" y2="302" stroke="#1e3a22" stroke-width="1"/>
  <text x="675" y="320" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Format + reinstall Windows</text>
  <text x="675" y="338" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">All data lost permanently</text>
  <text x="675" y="360" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">Only if no key found</text>
  <!-- Arrow to center -->
  <line x1="570" y1="310" x2="502" y2="258" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- Bottom note -->
  <rect x="20" y="392" width="760" height="22" fill="#0d1e16" rx="4" stroke="#1e3a22"/>
  <text x="400" y="407" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Recovery key is saved automatically when BitLocker is enabled — check all 4 locations before giving up</text>
</svg>
