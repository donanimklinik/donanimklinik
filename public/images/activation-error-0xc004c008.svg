<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Windows activation error 0xC004C008: product key has exceeded its activation limit — key used on too many devices. Fix by calling Microsoft activation hotline or buying a new key">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Main title -->
  <text x="400" y="38" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Error 0xC004C008 — Activation Limit Exceeded</text>
  <line x1="40" y1="50" x2="760" y2="50" stroke="#1e3a22" stroke-width="1"/>

  <!-- Error panel -->
  <rect x="20" y="62" width="310" height="170" fill="#0d1e16" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="175" y="88" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">What This Error Means</text>
  <line x1="36" y1="96" x2="314" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="175" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">"The activation server</text>
  <text x="175" y="134" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">determined the product key</text>
  <text x="175" y="152" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">has been blocked"</text>
  <line x1="36" y1="162" x2="314" y2="162" stroke="#1e3a22" stroke-width="1"/>
  <text x="175" y="182" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Your product key was already</text>
  <text x="175" y="200" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">used on too many PCs and</text>
  <text x="175" y="218" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Microsoft has blocked it.</text>

  <!-- Key limits panel -->
  <rect x="346" y="62" width="198" height="170" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="88" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Key Limits</text>
  <line x1="362" y1="96" x2="528" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="362" y="118" fill="#A8C4B0" font-size="13" font-family="monospace">OEM key:</text>
  <text x="528" y="118" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="end">1 PC only</text>
  <line x1="362" y1="128" x2="528" y2="128" stroke="#1e3a22" stroke-width="1"/>
  <text x="362" y="150" fill="#A8C4B0" font-size="13" font-family="monospace">Retail key:</text>
  <text x="528" y="150" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="end">1 PC only</text>
  <line x1="362" y1="160" x2="528" y2="160" stroke="#1e3a22" stroke-width="1"/>
  <text x="362" y="182" fill="#A8C4B0" font-size="13" font-family="monospace">Vol. license:</text>
  <text x="528" y="182" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="end">Many PCs</text>
  <line x1="362" y1="192" x2="528" y2="192" stroke="#1e3a22" stroke-width="1"/>
  <text x="445" y="215" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Limit reached!</text>
  <text x="445" y="232" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">MS blocked the key</text>

  <!-- Fixes panel -->
  <rect x="560" y="62" width="220" height="170" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="670" y="88" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Quick Fixes</text>
  <line x1="576" y1="96" x2="764" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="576" y="118" fill="#00E5A0" font-size="14" font-family="monospace">✓</text>
  <text x="596" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Call MS Hotline</text>
  <text x="596" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Run: slmgr /dli</text>
  <text x="596" y="151" fill="#A8C4B0" font-size="13" font-family="monospace">Note the key ID</text>
  <text x="596" y="167" fill="#A8C4B0" font-size="13" font-family="monospace">Explain HW change</text>
  <line x1="576" y1="177" x2="764" y2="177" stroke="#1e3a22" stroke-width="1"/>
  <text x="576" y="199" fill="#00E5A0" font-size="14" font-family="monospace">✓</text>
  <text x="596" y="199" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Buy genuine key</text>
  <text x="596" y="215" fill="#A8C4B0" font-size="13" font-family="monospace">If key was shared</text>
  <text x="596" y="231" fill="#A8C4B0" font-size="13" font-family="monospace">or leaked online</text>

  <!-- Bottom: Phone Activation Steps -->
  <rect x="20" y="248" width="760" height="152" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="400" y="272" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Phone Activation — Best Fix for This Error</text>
  <line x1="36" y1="280" x2="764" y2="280" stroke="#1e3a22" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="36" y="290" width="168" height="94" fill="#091510" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="312" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">① Open Wizard</text>
  <text x="120" y="330" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Press Win+R,</text>
  <text x="120" y="347" fill="#93c5fd" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">slui 4</text>
  <text x="120" y="364" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Select country</text>

  <!-- Step 2 -->
  <rect x="216" y="290" width="168" height="94" fill="#091510" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="312" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">② Call Number</text>
  <text x="300" y="330" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Free 0800 line</text>
  <text x="300" y="347" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">shown on screen</text>
  <text x="300" y="364" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Automated first</text>

  <!-- Step 3 -->
  <rect x="396" y="290" width="168" height="94" fill="#091510" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="312" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">③ Give Install ID</text>
  <text x="480" y="330" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">9 digit groups</text>
  <text x="480" y="347" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">shown on screen</text>
  <text x="480" y="364" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Read or type them</text>

  <!-- Step 4 -->
  <rect x="576" y="290" width="168" height="94" fill="#091510" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="660" y="312" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">④ Get Confirm ID</text>
  <text x="660" y="330" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Enter Confirm ID</text>
  <text x="660" y="347" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">into the wizard</text>
  <text x="660" y="364" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Activated ✓</text>

  <!-- Tip -->
  <text x="400" y="412" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Tip: If automated system fails, press 0 to speak with a Microsoft agent directly.</text>
</svg>
