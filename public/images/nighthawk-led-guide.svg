<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-label="Nighthawk router LED guide: Power LED green means ready, Internet LED green means connected, Internet LED amber means no internet, WiFi LED green means broadcasting">
  <defs>
    <pattern id="ng" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="780" height="230" fill="#0A130E" rx="10"/>
  <rect width="780" height="230" fill="url(#ng)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">NIGHTHAWK LED STATUS GUIDE</text>

  <!-- Router illustration -->
  <rect x="30" y="36" width="240" height="158" fill="#111e14" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Antennas -->
  <line x1="65" y1="65" x2="62" y2="40" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="38" r="3" fill="#3b82f6"/>
  <line x1="105" y1="65" x2="103" y2="40" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="103" cy="38" r="3" fill="#3b82f6"/>
  <line x1="150" y1="65" x2="150" y2="38" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="36" r="3" fill="#3b82f6"/>
  <line x1="195" y1="65" x2="197" y2="40" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="197" cy="38" r="3" fill="#3b82f6"/>
  <line x1="235" y1="65" x2="238" y2="40" stroke="#5a9af0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="238" cy="38" r="3" fill="#3b82f6"/>
  <!-- Body -->
  <rect x="44" y="65" width="212" height="80" fill="#0d1810" rx="4" stroke="#3b82f6"/>
  <!-- LED row -->
  <!-- Power -->
  <circle cx="68" cy="90" r="6" fill="#00E5A0"/>
  <text x="68" y="108" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Power</text>
  <!-- Internet -->
  <circle cx="104" cy="90" r="6" fill="#00E5A0"/>
  <text x="104" y="108" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Internet</text>
  <!-- 2.4G -->
  <circle cx="140" cy="90" r="6" fill="#3b82f6" opacity=".8"/>
  <text x="140" y="108" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">2.4 GHz</text>
  <!-- 5G -->
  <circle cx="176" cy="90" r="6" fill="#3b82f6" opacity=".6"/>
  <text x="176" y="108" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">5 GHz</text>
  <!-- USB -->
  <circle cx="212" cy="90" r="6" fill="#1e3a22"/>
  <text x="212" y="108" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">USB</text>
  <!-- Port row -->
  <rect x="50" y="120" width="200" height="18" fill="#0A130E" rx="2" stroke="#1e3a22"/>
  <rect x="54" y="122" width="24" height="14" fill="#3b82f6" rx="1" opacity=".5"/>
  <text x="66" y="132" fill="#F0F4F1" font-size="6.5" font-family="monospace" text-anchor="middle">WAN</text>
  <rect x="84" y="122" width="18" height="14" fill="#1e3a22" rx="1"/>
  <text x="93" y="132" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">1</text>
  <rect x="106" y="122" width="18" height="14" fill="#1e3a22" rx="1"/>
  <text x="115" y="132" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">2</text>
  <rect x="128" y="122" width="18" height="14" fill="#1e3a22" rx="1"/>
  <text x="137" y="132" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">3</text>
  <rect x="150" y="122" width="18" height="14" fill="#1e3a22" rx="1"/>
  <text x="159" y="132" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">4</text>
  <rect x="192" y="122" width="28" height="14" fill="#0d1810" rx="1" stroke="#1e3a22"/>
  <text x="206" y="132" fill="#4a5e4e" font-size="6.5" font-family="monospace" text-anchor="middle">USB</text>
  <!-- Label -->
  <text x="150" y="175" fill="#93c5fd" font-size="9.5" font-family="monospace" text-anchor="middle">Nighthawk Router</text>
  <text x="150" y="188" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">RAX / R7000 / R8000 series</text>

  <!-- ── LED Reference Table ── -->
  <rect x="290" y="36" width="460" height="182" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <!-- Header -->
  <rect x="290" y="36" width="460" height="26" fill="#0a1509" rx="8"/>
  <rect x="290" y="52" width="460" height="10" fill="#0a1509"/>
  <text x="520" y="53" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">LED</text>
  <text x="380" y="53" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Color / State</text>
  <text x="650" y="53" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Meaning</text>

  <!-- Dividers -->
  <line x1="440" y1="36" x2="440" y2="218" stroke="#1e3a22" stroke-width="1"/>
  <line x1="570" y1="36" x2="570" y2="218" stroke="#1e3a22" stroke-width="1"/>

  <!-- Row 1: Power green -->
  <line x1="290" y1="72" x2="750" y2="72" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="67" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="510" cy="66" r="6" fill="#00E5A0" opacity=".9"/>
  <text x="530" y="68" fill="#00E5A0" font-size="8.5" font-family="monospace">Solid white/green</text>
  <text x="660" y="68" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">Router ready ✓</text>

  <!-- Row 2: Internet green -->
  <line x1="290" y1="96" x2="750" y2="96" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="88" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="510" cy="88" r="6" fill="#00E5A0" opacity=".9"/>
  <text x="530" y="90" fill="#00E5A0" font-size="8.5" font-family="monospace">Solid green</text>
  <text x="660" y="90" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">Internet connected ✓</text>

  <!-- Row 3: Internet amber -->
  <line x1="290" y1="118" x2="750" y2="118" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="110" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="510" cy="110" r="6" fill="#f59e0b" opacity=".9"/>
  <text x="530" y="112" fill="#f59e0b" font-size="8.5" font-family="monospace">Solid amber</text>
  <text x="660" y="112" fill="#f59e0b" font-size="8.5" font-family="monospace" text-anchor="middle">No internet — restart modem</text>

  <!-- Row 4: Internet off -->
  <line x1="290" y1="140" x2="750" y2="140" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="132" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="510" cy="132" r="6" fill="#1e3a22" stroke="#2d5a3d" stroke-width="1"/>
  <text x="530" y="134" fill="#6B7F72" font-size="8.5" font-family="monospace">Off</text>
  <text x="660" y="134" fill="#ef4444" font-size="8.5" font-family="monospace" text-anchor="middle">No modem connection</text>

  <!-- Row 5: WiFi LED -->
  <line x1="290" y1="162" x2="750" y2="162" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="154" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">2.4/5 GHz</text>
  <circle cx="510" cy="154" r="6" fill="#3b82f6" opacity=".9"/>
  <text x="530" y="156" fill="#3b82f6" font-size="8.5" font-family="monospace">Solid blue</text>
  <text x="660" y="156" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">WiFi broadcasting ✓</text>

  <!-- Row 6: WiFi blinking -->
  <text x="370" y="176" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">2.4/5 GHz</text>
  <circle cx="510" cy="176" r="6" fill="#3b82f6" opacity=".4"/>
  <text x="530" y="178" fill="#4a5e4e" font-size="8.5" font-family="monospace">Blinking blue</text>
  <text x="660" y="178" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">Data transferring (normal)</text>

  <!-- Row 7: Power blinking -->
  <line x1="290" y1="196" x2="750" y2="196" stroke="#1e3a22" stroke-width=".8"/>
  <text x="370" y="210" fill="#6B7F72" font-size="9" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="510" cy="208" r="6" fill="#00E5A0" opacity=".3" stroke="#00E5A0" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="530" y="210" fill="#6B7F72" font-size="8.5" font-family="monospace">Blinking</text>
  <text x="660" y="210" fill="#f59e0b" font-size="8.5" font-family="monospace" text-anchor="middle">Booting or factory reset</text>
</svg>
