<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Nighthawk router LED guide: Power LED green means ready, Internet LED green means connected, Internet LED amber means no internet, WiFi LED green means broadcasting">
  <defs>
    <pattern id="ng" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="440" fill="#091510" rx="10"/>
  <rect width="800" height="440" fill="url(#ng)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Nighthawk Router — LED Status Guide</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Understand what each LED color means and how to react</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- Router illustration -->
  <rect x="24" y="82" width="256" height="196" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Antennas -->
  <line x1="66" y1="114" x2="63" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="63" cy="88" r="4" fill="#3b82f6"/>
  <line x1="112" y1="114" x2="110" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="110" cy="88" r="4" fill="#3b82f6"/>
  <line x1="152" y1="114" x2="152" y2="88" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="152" cy="86" r="4" fill="#3b82f6"/>
  <line x1="196" y1="114" x2="198" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="198" cy="88" r="4" fill="#3b82f6"/>
  <line x1="238" y1="114" x2="241" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="241" cy="88" r="4" fill="#3b82f6"/>
  <!-- Router body -->
  <rect x="42" y="114" width="220" height="88" fill="#091510" rx="4" stroke="#3b82f6" stroke-width="1.2"/>

  <!-- LED row -->
  <circle cx="72" cy="142" r="8" fill="#00E5A0"/>
  <text x="72" y="162" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Power</text>

  <circle cx="114" cy="142" r="8" fill="#00E5A0"/>
  <text x="114" y="162" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Internet</text>

  <circle cx="158" cy="142" r="8" fill="#3b82f6" opacity=".9"/>
  <text x="158" y="162" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">2.4 GHz</text>

  <circle cx="200" cy="142" r="8" fill="#3b82f6" opacity=".6"/>
  <text x="200" y="162" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">5 GHz</text>

  <circle cx="240" cy="142" r="8" fill="#1e3a22"/>
  <text x="240" y="162" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">USB</text>

  <!-- Port row -->
  <rect x="50" y="178" width="204" height="20" fill="#091510" rx="2" stroke="#1e3a22"/>
  <rect x="54" y="180" width="28" height="16" fill="#3b82f6" rx="1" opacity=".5"/>
  <text x="68" y="192" fill="#D4EAD8" font-size="12" font-family="monospace" text-anchor="middle">WAN</text>
  <rect x="88" y="180" width="22" height="16" fill="#1e3a22" rx="1"/>
  <text x="99" y="192" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">1</text>
  <rect x="114" y="180" width="22" height="16" fill="#1e3a22" rx="1"/>
  <text x="125" y="192" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">2</text>
  <rect x="140" y="180" width="22" height="16" fill="#1e3a22" rx="1"/>
  <text x="151" y="192" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">3</text>
  <rect x="166" y="180" width="22" height="16" fill="#1e3a22" rx="1"/>
  <text x="177" y="192" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">4</text>
  <rect x="200" y="180" width="36" height="16" fill="#0d1e16" rx="1" stroke="#1e3a22"/>
  <text x="218" y="192" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">USB</text>

  <!-- Label -->
  <text x="152" y="240" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Nighthawk Router</text>
  <text x="152" y="260" fill="#A8C4B0" font-size="14" font-family="monospace" text-anchor="middle">RAX / R7000 / R8000 series</text>

  <!-- LED Reference Table -->
  <rect x="296" y="82" width="480" height="336" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <!-- Table Header -->
  <rect x="296" y="82" width="480" height="36" fill="#0a1509" rx="8"/>
  <rect x="296" y="108" width="480" height="10" fill="#0a1509"/>

  <!-- Column headers -->
  <text x="376" y="106" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">LED</text>
  <text x="516" y="106" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Color / State</text>
  <text x="680" y="106" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Meaning / Action</text>

  <!-- Column dividers -->
  <line x1="446" y1="82" x2="446" y2="418" stroke="#1e3a22" stroke-width="1"/>
  <line x1="590" y1="82" x2="590" y2="418" stroke="#1e3a22" stroke-width="1"/>

  <!-- Row 1: Power green -->
  <line x1="296" y1="136" x2="776" y2="136" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="124" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="516" cy="124" r="8" fill="#00E5A0" opacity=".9"/>
  <text x="536" y="128" fill="#00E5A0" font-size="14" font-family="monospace">Solid green/white</text>
  <text x="680" y="128" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle">Router ready ✓</text>

  <!-- Row 2: Internet green -->
  <line x1="296" y1="172" x2="776" y2="172" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="158" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="516" cy="158" r="8" fill="#00E5A0" opacity=".9"/>
  <text x="536" y="162" fill="#00E5A0" font-size="14" font-family="monospace">Solid green</text>
  <text x="680" y="162" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle">Internet connected ✓</text>

  <!-- Row 3: Internet amber -->
  <line x1="296" y1="208" x2="776" y2="208" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="194" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="516" cy="194" r="8" fill="#f59e0b" opacity=".9"/>
  <text x="536" y="198" fill="#f59e0b" font-size="14" font-family="monospace">Solid amber</text>
  <text x="680" y="198" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle">No internet — restart modem</text>

  <!-- Row 4: Internet off -->
  <line x1="296" y1="244" x2="776" y2="244" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="230" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Internet</text>
  <circle cx="516" cy="230" r="8" fill="#1e3a22" stroke="#2a5236" stroke-width="1.5"/>
  <text x="536" y="234" fill="#A8C4B0" font-size="14" font-family="monospace">Off (dark)</text>
  <text x="680" y="234" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle">No modem connection</text>

  <!-- Row 5: WiFi 2.4 / 5 GHz solid -->
  <line x1="296" y1="280" x2="776" y2="280" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="266" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">2.4/5 GHz</text>
  <circle cx="516" cy="266" r="8" fill="#3b82f6" opacity=".9"/>
  <text x="536" y="270" fill="#3b82f6" font-size="14" font-family="monospace">Solid blue</text>
  <text x="680" y="270" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">WiFi broadcasting ✓</text>

  <!-- Row 6: WiFi blinking -->
  <line x1="296" y1="316" x2="776" y2="316" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="302" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">2.4/5 GHz</text>
  <circle cx="516" cy="302" r="8" fill="#3b82f6" opacity=".35"/>
  <text x="536" y="306" fill="#A8C4B0" font-size="14" font-family="monospace">Blinking blue</text>
  <text x="680" y="306" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Data transferring (normal)</text>

  <!-- Row 7: Power blinking -->
  <line x1="296" y1="352" x2="776" y2="352" stroke="#1e3a22" stroke-width="1"/>
  <text x="376" y="338" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="516" cy="338" r="8" fill="#00E5A0" opacity=".3" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="536" y="342" fill="#A8C4B0" font-size="14" font-family="monospace">Blinking green</text>
  <text x="680" y="342" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle">Booting / factory reset</text>

  <!-- Row 8: Power amber -->
  <text x="376" y="382" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="516" cy="378" r="8" fill="#f59e0b" opacity=".9"/>
  <text x="536" y="382" fill="#f59e0b" font-size="14" font-family="monospace">Solid amber</text>
  <text x="680" y="382" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle">Firmware update failed</text>

  <!-- Bottom section: quick tips -->
  <rect x="24" y="292" width="256" height="126" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="152" y="314" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Quick Troubleshoot</text>
  <line x1="32" y1="322" x2="272" y2="322" stroke="#1e3a22" stroke-width="1"/>
  <text x="40" y="342" fill="#D4EAD8" font-size="14" font-family="monospace">Amber internet LED:</text>
  <text x="40" y="358" fill="#A8C4B0" font-size="13" font-family="monospace">→ Restart modem first, wait 60s</text>
  <text x="40" y="378" fill="#D4EAD8" font-size="14" font-family="monospace">No LEDs at all:</text>
  <text x="40" y="394" fill="#A8C4B0" font-size="13" font-family="monospace">→ Check power cable &amp; adapter</text>
  <text x="40" y="412" fill="#7FB09A" font-size="13" font-family="monospace">Factory reset: hold reset 7 sec</text>
</svg>
