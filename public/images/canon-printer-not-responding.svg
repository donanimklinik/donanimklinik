<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Canon printer not responding: printer is online but PC cannot communicate — check USB cable, restart print spooler, reinstall driver, or clear temporary files in Windows spool folder">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" fill="#091510" rx="12"/>
  <rect width="800" height="440" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Canon Printer Not Responding — Communication Fix</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#1e3a22" stroke-width="1"/>

  <!-- Diagram: PC → blocked → Printer -->
  <rect x="20" y="58" width="190" height="140" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="82" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">PC sends job</text>
  <line x1="36" y1="92" x2="194" y2="92" stroke="#1e3a22" stroke-width="1"/>
  <text x="115" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Print Spooler</text>
  <text x="115" y="133" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">queues print job</text>
  <text x="115" y="154" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Sends via USB</text>
  <text x="115" y="172" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">or network</text>

  <!-- Blocked arrow -->
  <rect x="222" y="108" width="96" height="34" fill="#1a0d0d" rx="6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="270" y="130" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">BLOCKED</text>

  <!-- Canon printer box -->
  <rect x="330" y="58" width="190" height="140" fill="#1a0d0d" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="425" y="82" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Canon Printer</text>
  <line x1="346" y1="92" x2="504" y2="92" stroke="#2a1010" stroke-width="1"/>
  <text x="425" y="114" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Powered on</text>
  <text x="425" y="133" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Lights normal</text>
  <text x="425" y="158" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Not receiving</text>
  <text x="425" y="177" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">any data</text>

  <!-- Fix Sequence panel -->
  <rect x="538" y="58" width="242" height="280" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="659" y="82" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Fix Sequence</text>
  <line x1="554" y1="92" x2="764" y2="92" stroke="#1e3a22" stroke-width="1"/>

  <text x="562" y="118" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">①</text>
  <text x="588" y="118" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Restart printer</text>
  <text x="588" y="137" fill="#A8C4B0" font-size="13" font-family="monospace">Power off → 30 sec → on</text>

  <line x1="554" y1="152" x2="764" y2="152" stroke="#1e3a22" stroke-width="1"/>

  <text x="562" y="178" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">②</text>
  <text x="588" y="178" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Restart Print Spooler</text>
  <text x="588" y="197" fill="#4ade80" font-size="13" font-family="monospace">services.msc → Restart</text>

  <line x1="554" y1="212" x2="764" y2="212" stroke="#1e3a22" stroke-width="1"/>

  <text x="562" y="238" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">③</text>
  <text x="588" y="238" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Clear spool folder</text>
  <text x="588" y="257" fill="#4ade80" font-size="13" font-family="monospace">%WINDIR%\System32\</text>
  <text x="588" y="274" fill="#4ade80" font-size="13" font-family="monospace">spool\PRINTERS</text>
  <text x="588" y="293" fill="#A8C4B0" font-size="13" font-family="monospace">Delete files (not folders)</text>

  <line x1="554" y1="308" x2="764" y2="308" stroke="#1e3a22" stroke-width="1"/>
  <text x="588" y="328" fill="#f59e0b" font-size="13" font-family="monospace">Still failing: reinstall driver</text>

  <!-- USB Troubleshooting -->
  <rect x="20" y="214" width="502" height="80" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="271" y="238" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">USB Troubleshooting</text>
  <line x1="36" y1="248" x2="506" y2="248" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="270" fill="#D4EAD8" font-size="14" font-family="monospace">Try a different USB cable and a different USB port on the PC</text>
  <text x="36" y="288" fill="#A8C4B0" font-size="13" font-family="monospace">Avoid USB hubs — connect the printer directly to the PC motherboard port</text>

  <!-- Driver reinstall steps -->
  <rect x="20" y="310" width="760" height="114" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="334" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Driver Reinstall — Step by Step</text>
  <line x1="36" y1="344" x2="764" y2="344" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="368" fill="#D4EAD8" font-size="14" font-family="monospace">① Control Panel → Programs → Uninstall Canon driver completely</text>
  <text x="36" y="390" fill="#D4EAD8" font-size="14" font-family="monospace">② Visit canon.com/support → enter model number → download latest driver</text>
  <text x="36" y="412" fill="#D4EAD8" font-size="14" font-family="monospace">③ Run installer → connect USB only when prompted → test print</text>
</svg>
