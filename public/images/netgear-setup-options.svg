<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Netgear router setup: two methods — Nighthawk app on phone or browser at routerlogin.net — both lead to same result, internet connected">
  <defs>
    <pattern id="nsg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="nsa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity=".8"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#091510" rx="10"/>
  <rect width="800" height="440" fill="url(#nsg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Netgear Router Setup — 2 Methods</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Choose either method — both result in a fully configured router</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- METHOD A: Nighthawk App -->
  <rect x="24" y="82" width="356" height="310" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="24" y="82" width="356" height="38" fill="#0a1f10" rx="8"/>
  <rect x="24" y="110" width="356" height="10" fill="#0a1f10"/>
  <text x="202" y="107" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Method A — Nighthawk App</text>
  <text x="202" y="128" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Easiest · Recommended for beginners</text>

  <!-- Phone mockup -->
  <rect x="244" y="140" width="72" height="122" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="249" y="147" width="62" height="96" fill="#091510" rx="3"/>
  <!-- App UI -->
  <rect x="252" y="150" width="56" height="14" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="280" y="161" fill="#3b82f6" font-size="12" font-family="monospace" text-anchor="middle">Nighthawk</text>
  <circle cx="268" cy="186" r="12" fill="#00E5A0" opacity=".12" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="268" y="191" fill="#00E5A0" font-size="16" text-anchor="middle">✓</text>
  <text x="292" y="183" fill="#A8C4B0" font-size="12" font-family="monospace">Auto</text>
  <text x="292" y="198" fill="#A8C4B0" font-size="12" font-family="monospace">detect</text>
  <rect x="252" y="205" width="56" height="14" fill="#00E5A0" rx="3" opacity=".85"/>
  <text x="280" y="215" fill="#091510" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Set Up Router</text>
  <rect x="254" y="224" width="52" height="10" fill="#0d1e16" rx="2" stroke="#1e3a22"/>
  <text x="280" y="232" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Skip</text>
  <!-- home button -->
  <rect x="270" y="256" width="20" height="4" fill="#1e3a22" rx="2"/>

  <!-- Step list -->
  <text x="40" y="154" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Step-by-step:</text>
  <text x="40" y="178" fill="#A8C4B0" font-size="13" font-family="monospace">1. Download Nighthawk app</text>
  <text x="40" y="196" fill="#D4EAD8" font-size="14" font-family="monospace">   iOS App Store or Google Play</text>
  <text x="40" y="220" fill="#A8C4B0" font-size="13" font-family="monospace">2. Connect phone to router WiFi</text>
  <text x="40" y="238" fill="#D4EAD8" font-size="14" font-family="monospace">   (default SSID on router label)</text>
  <text x="40" y="262" fill="#A8C4B0" font-size="13" font-family="monospace">3. Tap "Set Up Router" in app</text>
  <text x="40" y="280" fill="#D4EAD8" font-size="14" font-family="monospace">   Guided automatic setup</text>
  <text x="40" y="304" fill="#A8C4B0" font-size="13" font-family="monospace">4. Set new WiFi name (SSID)</text>
  <text x="40" y="322" fill="#D4EAD8" font-size="14" font-family="monospace">   and a strong password</text>

  <rect x="40" y="346" width="192" height="36" fill="#3b82f6" rx="4" opacity=".15" stroke="#3b82f6" stroke-width="1"/>
  <text x="136" y="360" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">✓ No browser needed</text>
  <text x="136" y="376" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Works on iOS &amp; Android</text>

  <!-- DIVIDER -->
  <text x="400" y="248" fill="#A8C4B0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">OR</text>
  <line x1="400" y1="90" x2="400" y2="228" stroke="#1e3a22" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="400" y1="268" x2="400" y2="392" stroke="#1e3a22" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- METHOD B: Web Browser -->
  <rect x="420" y="82" width="356" height="310" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.8"/>
  <rect x="420" y="82" width="356" height="38" fill="#0a1509" rx="8"/>
  <rect x="420" y="110" width="356" height="10" fill="#0a1509"/>
  <text x="598" y="107" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Method B — Web Browser</text>
  <text x="598" y="128" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Works on any device · More control</text>

  <!-- Step list -->
  <text x="436" y="154" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Step-by-step:</text>
  <text x="436" y="178" fill="#A8C4B0" font-size="13" font-family="monospace">1. Connect PC or laptop to router</text>
  <text x="436" y="196" fill="#D4EAD8" font-size="14" font-family="monospace">   via WiFi or Ethernet cable</text>

  <!-- Address bar mockup -->
  <rect x="436" y="208" width="328" height="28" fill="#091510" rx="4" stroke="#2a5236"/>
  <rect x="441" y="213" width="268" height="18" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="575" y="225" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">routerlogin.net</text>
  <text x="750" y="225" fill="#A8C4B0" font-size="14" font-family="monospace">↵</text>

  <text x="436" y="256" fill="#A8C4B0" font-size="13" font-family="monospace">2. Open browser → type address:</text>
  <text x="436" y="276" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">   routerlogin.net</text>
  <text x="436" y="296" fill="#A8C4B0" font-size="13" font-family="monospace">   or 192.168.1.1</text>

  <!-- Login form mockup -->
  <rect x="436" y="310" width="328" height="66" fill="#091510" rx="4" stroke="#1e3a22"/>
  <text x="448" y="330" fill="#A8C4B0" font-size="13" font-family="monospace">Username</text>
  <rect x="536" y="319" width="120" height="16" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="596" y="331" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">admin</text>
  <text x="670" y="331" fill="#7FB09A" font-size="13" font-family="monospace">← default</text>
  <text x="448" y="356" fill="#A8C4B0" font-size="13" font-family="monospace">Password</text>
  <rect x="536" y="345" width="120" height="16" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="596" y="357" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">password</text>
  <text x="670" y="357" fill="#7FB09A" font-size="13" font-family="monospace">← default</text>

  <text x="436" y="388" fill="#A8C4B0" font-size="13" font-family="monospace">3. Log in → run Setup Wizard → done</text>

  <!-- RESULT: Both methods converge -->
  <rect x="180" y="406" width="440" height="26" fill="#0d1e16" rx="6" stroke="#00E5A0" stroke-width="1.5"/>
  <line x1="202" y1="392" x2="240" y2="406" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#nsa)" opacity=".5"/>
  <line x1="598" y1="392" x2="560" y2="406" stroke="#1e3a22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#nsa)" opacity=".5"/>
  <text x="400" y="423" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Both methods → same result: Internet connected ✓</text>
</svg>
