<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Hard drive failure warning signs timeline: early signs clicking and slowness, middle stage errors and bad sectors, late stage unreadable files, final stage complete failure">
  <defs>
    <pattern id="g8" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="timeline-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g8)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Hard Drive Failure — Warning Signs Timeline</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Timeline bar -->
  <rect x="50" y="178" width="700" height="10" rx="5" fill="url(#timeline-grad)"/>

  <!-- Stage 1: Early Warning — above -->
  <circle cx="120" cy="183" r="18" fill="#091510" stroke="#00E5A0" stroke-width="2"/>
  <text x="120" y="189" fill="#00E5A0" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  <line x1="120" y1="165" x2="120" y2="108" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="30" y="62" width="180" height="92" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="120" y="84" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Early Warning</text>
  <line x1="46" y1="92" x2="194" y2="92" stroke="#1e3a22" stroke-width="1"/>
  <text x="120" y="110" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Clicking / grinding noise</text>
  <text x="120" y="128" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Slow file access</text>
  <!-- Action badge -->
  <rect x="60" y="214" width="120" height="26" fill="#0d1e16" rx="5" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="120" y="231" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Backup NOW</text>

  <!-- Stage 2: Degrading — below -->
  <circle cx="310" cy="183" r="18" fill="#091510" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="189" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="bold">2</text>
  <line x1="310" y1="201" x2="310" y2="262" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="218" y="262" width="184" height="92" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="284" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Degrading</text>
  <line x1="234" y1="292" x2="386" y2="292" stroke="#1e3a22" stroke-width="1"/>
  <text x="310" y="310" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Frequent system freezes</text>
  <text x="310" y="328" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Bad sectors detected</text>
  <rect x="248" y="370" width="124" height="26" fill="#0d1e16" rx="5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="387" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Run SMART scan</text>

  <!-- Stage 3: Critical — above -->
  <circle cx="510" cy="183" r="18" fill="#091510" stroke="#ef4444" stroke-width="2"/>
  <text x="510" y="189" fill="#ef4444" font-size="14" text-anchor="middle" font-weight="bold">3</text>
  <line x1="510" y1="165" x2="510" y2="108" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="418" y="62" width="184" height="92" fill="#0d1e16" rx="8" stroke="#ef4444" stroke-width="1.5"/>
  <text x="510" y="84" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Critical</text>
  <line x1="434" y1="92" x2="586" y2="92" stroke="#1e3a22" stroke-width="1"/>
  <text x="510" y="110" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Files unreadable/missing</text>
  <text x="510" y="128" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Windows I/O errors</text>
  <rect x="448" y="214" width="124" height="26" fill="#0d1e16" rx="5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="510" y="231" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Replace drive now</text>

  <!-- Stage 4: Failed — below -->
  <circle cx="710" cy="183" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="710" y="190" fill="#ffffff" font-size="16" text-anchor="middle" font-weight="bold">✕</text>
  <line x1="710" y1="201" x2="710" y2="262" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="614" y="262" width="170" height="108" fill="#0d1e16" rx="8" stroke="#ef4444" stroke-width="2"/>
  <text x="699" y="284" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Drive Dead</text>
  <line x1="630" y1="292" x2="768" y2="292" stroke="#1e3a22" stroke-width="1"/>
  <text x="699" y="310" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Not detected in BIOS</text>
  <text x="699" y="328" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Clicking only / no spin</text>
  <rect x="634" y="370" width="150" height="26" fill="#0d1e16" rx="5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="709" y="387" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Pro recovery lab</text>

  <!-- Bottom note -->
  <rect x="30" y="398" width="740" height="0" fill="none"/>
</svg>
