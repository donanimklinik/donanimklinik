<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Why Windows Update triggers BitLocker recovery screen: update changes boot files, TPM detects measurement change, BitLocker requires key to verify integrity">
  <defs>
    <pattern id="g7" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#f59e0b"/>
    </marker>
    <marker id="a7g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g7)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Why Windows Update Triggers BitLocker Recovery</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Step 1: Windows Update -->
  <rect x="18" y="62" width="168" height="160" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="102" cy="102" r="26" fill="#091020" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="110" fill="#3b82f6" font-size="22" text-anchor="middle">⬇</text>
  <text x="102" y="148" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Windows</text>
  <text x="102" y="167" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Update</text>
  <text x="102" y="192" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Modifies boot</text>
  <text x="102" y="210" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">loader files</text>

  <!-- Arrow 1 -->
  <line x1="188" y1="142" x2="212" y2="142" stroke="#f59e0b" stroke-width="2" marker-end="url(#a7)"/>

  <!-- Step 2: TPM -->
  <rect x="214" y="62" width="168" height="160" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="298" cy="102" r="26" fill="#1a1200" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="298" y="110" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">TPM</text>
  <text x="298" y="148" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">TPM Chip</text>
  <text x="298" y="167" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Measures Boot</text>
  <text x="298" y="192" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Detects changed</text>
  <text x="298" y="210" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">boot fingerprint</text>

  <!-- Arrow 2 -->
  <line x1="384" y1="142" x2="408" y2="142" stroke="#f59e0b" stroke-width="2" marker-end="url(#a7)"/>

  <!-- Step 3: Mismatch -->
  <rect x="410" y="62" width="168" height="160" fill="#160808" rx="10" stroke="#ef4444" stroke-width="2"/>
  <circle cx="494" cy="102" r="26" fill="#160808" stroke="#ef4444" stroke-width="1.5"/>
  <text x="494" y="110" fill="#ef4444" font-size="22" text-anchor="middle">⚠</text>
  <text x="494" y="148" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Mismatch!</text>
  <text x="494" y="167" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Recovery Screen</text>
  <text x="494" y="192" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">BitLocker locks</text>
  <text x="494" y="210" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">drive for safety</text>

  <!-- Arrow 3 -->
  <line x1="580" y1="142" x2="604" y2="142" stroke="#00E5A0" stroke-width="2" marker-end="url(#a7g)"/>

  <!-- Step 4: Fix -->
  <rect x="606" y="62" width="176" height="160" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <circle cx="694" cy="102" r="26" fill="#081a10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="694" y="110" fill="#00E5A0" font-size="22" text-anchor="middle">✓</text>
  <text x="694" y="148" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Enter Key</text>
  <text x="694" y="167" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Drive Unlocks</text>
  <text x="694" y="192" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">account.microsoft</text>
  <text x="694" y="210" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">.com → Devices</text>

  <!-- Divider -->
  <line x1="40" y1="242" x2="760" y2="242" stroke="#1e3a22" stroke-width="1"/>

  <!-- Prevention section -->
  <text x="400" y="268" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">How to Prevent This in the Future</text>

  <!-- Prevention box -->
  <rect x="18" y="280" width="760" height="122" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="308" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Suspend BitLocker BEFORE major updates</text>

  <rect x="36" y="320" width="220" height="68" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="146" y="341" fill="#4ade80" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Step 1</text>
  <text x="146" y="360" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Control Panel</text>
  <text x="146" y="377" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ BitLocker Drive</text>

  <rect x="290" y="320" width="220" height="68" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="341" fill="#4ade80" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Step 2</text>
  <text x="400" y="360" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Suspend Protection</text>
  <text x="400" y="377" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ Install update</text>

  <rect x="544" y="320" width="220" height="68" fill="#091510" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="654" y="341" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Step 3</text>
  <text x="654" y="360" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Resume Protection</text>
  <text x="654" y="377" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">✓ No recovery needed</text>
</svg>
