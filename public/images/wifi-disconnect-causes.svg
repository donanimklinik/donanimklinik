<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Why WiFi keeps disconnecting: 4 main causes — Windows power management turns off adapter, channel interference from neighbors, weak signal at edge of range, router DHCP lease expiry">
  <defs>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="800" height="280" fill="#0A130E" rx="12"/>
  <rect width="800" height="280" fill="url(#g2)" rx="12"/>
  <text x="400" y="22" fill="#4a5e4e" font-size="10" font-family="monospace" text-anchor="middle" letter-spacing="2">WHY WIFI KEEPS DISCONNECTING — 4 CAUSES &amp; FIXES</text>

  <!-- Cause 1: Power Management -->
  <rect x="20" y="36" width="180" height="224" fill="#0d1810" rx="10" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="20" y="36" width="180" height="36" fill="#1a1200" rx="10"/>
  <rect x="20" y="60" width="180" height="12" fill="#1a1200"/>
  <text x="110" y="54" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Power Management</text>
  <text x="110" y="68" fill="#f59e0b" font-size="11" font-family="monospace" text-anchor="middle">Most common cause</text>
  <!-- Power icon -->
  <circle cx="110" cy="108" r="26" fill="#0A130E" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="114" fill="#f59e0b" font-size="22" text-anchor="middle">⏻</text>
  <text x="110" y="148" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">Windows turns off</text>
  <text x="110" y="163" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">WiFi adapter to</text>
  <text x="110" y="178" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">save power</text>
  <line x1="36" y1="196" x2="184" y2="196" stroke="#1e3a22" stroke-width="1"/>
  <text x="110" y="212" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Fix:</text>
  <text x="110" y="227" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">Device Manager →</text>
  <text x="110" y="242" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">WiFi adapter →</text>
  <text x="110" y="257" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">Power: Never save</text>

  <!-- Cause 2: Channel Interference -->
  <rect x="214" y="36" width="180" height="224" fill="#0d1810" rx="10" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="214" y="36" width="180" height="36" fill="#1a0d0d" rx="10"/>
  <rect x="214" y="60" width="180" height="12" fill="#1a0d0d"/>
  <text x="304" y="54" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Channel Interference</text>
  <text x="304" y="68" fill="#ef4444" font-size="11" font-family="monospace" text-anchor="middle">Neighbor routers</text>
  <!-- Overlapping waves icon -->
  <path d="M264 108 Q284 88 304 108 Q324 128 344 108" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M264 118 Q284 98 304 118 Q324 138 344 118" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <text x="304" y="148" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">2.4 GHz channels</text>
  <text x="304" y="163" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">overlap — nearby</text>
  <text x="304" y="178" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">routers compete</text>
  <line x1="230" y1="196" x2="378" y2="196" stroke="#1e3a22" stroke-width="1"/>
  <text x="304" y="212" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Fix:</text>
  <text x="304" y="227" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">Switch to 5 GHz</text>
  <text x="304" y="242" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">or change channel</text>
  <text x="304" y="257" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">to 1, 6, or 11</text>

  <!-- Cause 3: Weak Signal -->
  <rect x="408" y="36" width="180" height="224" fill="#0d1810" rx="10" stroke="#6B7F72" stroke-width="1.8"/>
  <rect x="408" y="36" width="180" height="36" fill="#111e14" rx="10"/>
  <rect x="408" y="60" width="180" height="12" fill="#111e14"/>
  <text x="498" y="54" fill="#93B5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Weak Signal</text>
  <text x="498" y="68" fill="#6B7F72" font-size="11" font-family="monospace" text-anchor="middle">Edge of range</text>
  <!-- Fading signal bars -->
  <rect x="470" y="104" width="10" height="20" fill="#00E5A0" rx="2" opacity=".9"/>
  <rect x="485" y="96" width="10" height="28" fill="#00E5A0" rx="2" opacity=".5"/>
  <rect x="500" y="88" width="10" height="36" fill="#1e3a22" rx="2"/>
  <rect x="515" y="80" width="10" height="44" fill="#1e3a22" rx="2"/>
  <text x="498" y="148" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">Connection drops</text>
  <text x="498" y="163" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">when signal falls</text>
  <text x="498" y="178" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">below threshold</text>
  <line x1="424" y1="196" x2="572" y2="196" stroke="#1e3a22" stroke-width="1"/>
  <text x="498" y="212" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Fix:</text>
  <text x="498" y="227" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">Move router to</text>
  <text x="498" y="242" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">central location or</text>
  <text x="498" y="257" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">add WiFi extender</text>

  <!-- Cause 4: DHCP Lease -->
  <rect x="602" y="36" width="178" height="224" fill="#0d1810" rx="10" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="602" y="36" width="178" height="36" fill="#0a1020" rx="10"/>
  <rect x="602" y="60" width="178" height="12" fill="#0a1020"/>
  <text x="691" y="54" fill="#3b82f6" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">DHCP Lease</text>
  <text x="691" y="68" fill="#3b82f6" font-size="11" font-family="monospace" text-anchor="middle">IP address expires</text>
  <!-- Clock icon -->
  <circle cx="691" cy="108" r="26" fill="#0A130E" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="691" y1="108" x2="691" y2="92" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="691" y1="108" x2="703" y2="108" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="691" y="148" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">Router recycles IP</text>
  <text x="691" y="163" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">— device loses</text>
  <text x="691" y="178" fill="#F0F4F1" font-size="12" font-family="monospace" text-anchor="middle">connection briefly</text>
  <line x1="618" y1="196" x2="764" y2="196" stroke="#1e3a22" stroke-width="1"/>
  <text x="691" y="212" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">Fix:</text>
  <text x="691" y="227" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">Reboot router or</text>
  <text x="691" y="242" fill="#93B5A0" font-size="11" font-family="monospace" text-anchor="middle">assign static IP</text>
  <text x="691" y="257" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">in router settings</text>
</svg>
