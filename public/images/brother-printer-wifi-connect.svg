<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Brother printer not connecting to WiFi: use wireless setup wizard on printer or Brother iPrint app — ensure printer is in infrastructure mode not ad-hoc, and factory reset clears old WiFi settings">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Brother Printer — WiFi Connection Guide</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#1e3a22" stroke-width="1"/>

  <!-- Left panel: Wireless Setup Steps -->
  <rect x="20" y="56" width="466" height="240" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="253" y="80" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Wireless Setup on Printer</text>
  <line x1="36" y1="90" x2="470" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="44" y="116" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">①</text>
  <text x="70" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Menu → Network → WLAN</text>
  <text x="70" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Or: press WiFi button on printer panel</text>

  <text x="44" y="162" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">②</text>
  <text x="70" y="162" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Setup Wizard → select your SSID</text>
  <text x="70" y="181" fill="#A8C4B0" font-size="13" font-family="monospace">Your network name appears in the list</text>

  <text x="44" y="208" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">③</text>
  <text x="70" y="208" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Enter passphrase using arrow buttons</text>
  <text x="70" y="227" fill="#A8C4B0" font-size="13" font-family="monospace">Navigate character by character to input password</text>

  <rect x="36" y="244" width="434" height="38" fill="#0a1f14" rx="6" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="253" y="261" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Connected: Print Network Config Page</text>
  <text x="253" y="277" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Hold WiFi button 3 sec → prints IP address + connection status</text>

  <!-- Right panel: Common Issues -->
  <rect x="502" y="56" width="278" height="240" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="641" y="80" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Common Issues</text>
  <line x1="518" y1="90" x2="764" y2="90" stroke="#1e3a22" stroke-width="1"/>

  <text x="526" y="116" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="548" y="116" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">5 GHz network</text>
  <text x="548" y="135" fill="#A8C4B0" font-size="13" font-family="monospace">Brother needs 2.4 GHz only</text>

  <line x1="518" y1="150" x2="764" y2="150" stroke="#1e3a22" stroke-width="1"/>

  <text x="526" y="176" fill="#ef4444" font-size="16" font-family="monospace">✕</text>
  <text x="548" y="176" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">Old WiFi remembered</text>
  <text x="548" y="195" fill="#A8C4B0" font-size="13" font-family="monospace">Network → Reset → Yes</text>

  <line x1="518" y1="210" x2="764" y2="210" stroke="#1e3a22" stroke-width="1"/>

  <text x="526" y="236" fill="#00E5A0" font-size="16" font-family="monospace">✓</text>
  <text x="548" y="236" fill="#D4EAD8" font-size="14" font-family="monospace" font-weight="bold">WPS button method</text>
  <text x="548" y="255" fill="#A8C4B0" font-size="13" font-family="monospace">Router WPS → printer WPS</text>

  <!-- WPS Quick Method panel -->
  <rect x="20" y="312" width="466" height="90" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="253" y="336" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">WPS One-Button Method</text>
  <line x1="36" y1="346" x2="470" y2="346" stroke="#1e3a22" stroke-width="1"/>
  <text x="36" y="368" fill="#D4EAD8" font-size="14" font-family="monospace">1. Press WPS on your router (light blinks)</text>
  <text x="36" y="388" fill="#D4EAD8" font-size="14" font-family="monospace">2. Within 2 min: printer → Network → WPS → push button</text>

  <!-- Tips panel -->
  <rect x="502" y="312" width="278" height="90" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="641" y="336" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Brother iPrint App</text>
  <line x1="518" y1="346" x2="764" y2="346" stroke="#1e3a22" stroke-width="1"/>
  <text x="518" y="368" fill="#D4EAD8" font-size="14" font-family="monospace">iOS / Android — guided setup</text>
  <text x="518" y="388" fill="#A8C4B0" font-size="13" font-family="monospace">No keypad navigation needed</text>

  <!-- Bottom note -->
  <rect x="20" y="416" width="760" height="0" fill="#0d1e16" rx="4" stroke="#1e3a22"/>
</svg>
