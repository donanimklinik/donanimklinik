<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Why internet keeps dropping: ISP line instability, loose coax cable, overheating modem, router DHCP issue, or DNS failure — each point in the chain can cause intermittent disconnections">
  <defs>
    <pattern id="idd" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="idda" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#2a5236"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#091510" rx="12"/>
  <rect width="800" height="460" fill="url(#idd)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Why Internet Keeps Dropping</text>
  <text x="400" y="56" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">Signal travels through 5 points — any one can cause intermittent drops</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- Connection line across middle -->
  <line x1="70" y1="148" x2="730" y2="148" stroke="#2a5236" stroke-width="2.5"/>

  <!-- ── 1: ISP / Street cabinet ── -->
  <rect x="20" y="108" width="100" height="80" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <!-- Tower icon -->
  <line x1="70" y1="118" x2="70" y2="138" stroke="#A8C4B0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="124" x2="86" y2="124" stroke="#A8C4B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="118" x2="82" y2="118" stroke="#A8C4B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="113" x2="77" y2="113" stroke="#A8C4B0" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="162" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">ISP</text>
  <text x="70" y="178" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Signal</text>

  <!-- ISP warning card -->
  <rect x="20" y="198" width="100" height="70" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="70" y="218" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ Outage</text>
  <text x="70" y="234" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">or line</text>
  <text x="70" y="250" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">instability</text>
  <text x="70" y="266" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">→ Call ISP</text>

  <!-- Arrow 1→2 -->
  <line x1="122" y1="148" x2="168" y2="148" stroke="#2a5236" stroke-width="1.5" marker-end="url(#idda)"/>
  <text x="145" y="140" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">coax/fiber</text>

  <!-- ── 2: Cable / Wall entry ── -->
  <rect x="170" y="112" width="96" height="72" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <rect x="182" y="120" width="72" height="48" fill="#091510" rx="4" stroke="#2a5236" stroke-width="1"/>
  <line x1="196" y1="120" x2="196" y2="168" stroke="#A8C4B0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="230" y="140" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">Wall</text>
  <text x="230" y="156" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">outlet</text>

  <!-- Cable warning card -->
  <rect x="162" y="198" width="112" height="70" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="218" y="218" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ Loose</text>
  <text x="218" y="234" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">coax cable</text>
  <text x="218" y="250" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">or bent end</text>
  <text x="218" y="266" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">→ Re-seat</text>

  <!-- Arrow 2→3 -->
  <line x1="268" y1="148" x2="306" y2="148" stroke="#2a5236" stroke-width="1.5" marker-end="url(#idda)"/>

  <!-- ── 3: Modem (MOST COMMON) ── -->
  <rect x="308" y="104" width="110" height="88" fill="#0d1e16" rx="8" stroke="#ef4444" stroke-width="2"/>
  <rect x="320" y="114" width="86" height="50" fill="#091510" rx="4" stroke="#ef4444" stroke-width="1"/>
  <circle cx="334" cy="139" r="7" fill="#f59e0b"/>
  <text x="334" y="161" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Online</text>
  <circle cx="355" cy="139" r="7" fill="#00E5A0"/>
  <text x="355" y="161" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="376" cy="139" r="7" fill="#2a5236"/>
  <text x="376" y="161" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">DS/US</text>
  <text x="363" y="128" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">MODEM</text>
  <text x="363" y="185" fill="#ef4444" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">★ Most common!</text>

  <!-- Modem warning card -->
  <rect x="302" y="198" width="122" height="80" fill="#1a0808" rx="6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="363" y="218" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ Overheating</text>
  <text x="363" y="234" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">or firmware</text>
  <text x="363" y="250" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">crash / reboot</text>
  <text x="363" y="270" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">→ Unplug 60 sec</text>

  <!-- Arrow 3→4 -->
  <line x1="420" y1="148" x2="462" y2="148" stroke="#2a5236" stroke-width="1.5" marker-end="url(#idda)"/>
  <text x="441" y="140" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Ethernet</text>

  <!-- ── 4: Router ── -->
  <rect x="464" y="108" width="110" height="80" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="476" y="118" width="86" height="46" fill="#091510" rx="4" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="492" cy="141" r="7" fill="#00E5A0"/>
  <text x="492" y="162" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">Power</text>
  <circle cx="513" cy="141" r="7" fill="#f59e0b"/>
  <text x="513" y="162" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">WAN</text>
  <circle cx="534" cy="141" r="7" fill="#3b82f6"/>
  <text x="534" y="162" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">WiFi</text>
  <!-- Antennas -->
  <line x1="497" y1="118" x2="495" y2="109" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="509" y1="118" x2="509" y2="108" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="521" y1="118" x2="523" y2="109" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="519" y="128" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">ROUTER</text>

  <!-- Router warning card -->
  <rect x="456" y="198" width="126" height="80" fill="#1a1000" rx="6" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="519" y="218" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ DHCP lease</text>
  <text x="519" y="234" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">expired or old</text>
  <text x="519" y="250" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">firmware</text>
  <text x="519" y="270" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">→ Reboot + update</text>

  <!-- Arrow 4→5 -->
  <line x1="576" y1="148" x2="614" y2="148" stroke="#2a5236" stroke-width="1.5" marker-end="url(#idda)"/>
  <text x="595" y="140" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">WiFi/LAN</text>

  <!-- ── 5: DNS ── -->
  <rect x="616" y="112" width="96" height="72" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <circle cx="664" cy="142" r="22" fill="#091510" stroke="#2a5236" stroke-width="1.5"/>
  <text x="664" y="137" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">DNS</text>
  <text x="664" y="153" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">8.8.8.8</text>

  <!-- DNS warning card -->
  <rect x="608" y="198" width="112" height="80" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1.2"/>
  <text x="664" y="218" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">⚠ ISP DNS</text>
  <text x="664" y="234" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">slow or failing</text>
  <text x="664" y="250" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">intermittently</text>
  <text x="664" y="270" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">→ Use 8.8.8.8</text>

  <!-- Arrow 5→6 -->
  <line x1="714" y1="148" x2="740" y2="148" stroke="#2a5236" stroke-width="1.5" marker-end="url(#idda)"/>

  <!-- ── 6: Device ── -->
  <rect x="730" y="118" width="52" height="60" fill="#0d1e16" rx="6" stroke="#00E5A0" stroke-width="1.5"/>
  <rect x="736" y="122" width="40" height="28" fill="#091510" rx="2" stroke="#2a5236"/>
  <rect x="730" y="150" width="52" height="5" fill="#0d1e16" rx="1" stroke="#2a5236"/>
  <text x="756" y="172" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle">PC</text>

  <!-- Fix Order Summary -->
  <rect x="20" y="292" width="760" height="56" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="400" y="314" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Recommended Fix Order</text>
  <text x="400" y="334" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">ISP outage check → re-seat coax cable → reboot modem (60 sec unplugged) → reboot router → change DNS to 8.8.8.8</text>

  <!-- Bottom tip -->
  <rect x="20" y="360" width="760" height="40" fill="#0d1e16" rx="6" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="378" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Tip: Modem is the most common cause of drops</text>
  <text x="400" y="395" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Always reboot it first — unplug power for a full 60 seconds before plugging back in</text>
</svg>
