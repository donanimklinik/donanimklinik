<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#091510"/>

  <!-- Title -->
  <text x="400" y="38" font-family="monospace" font-size="20" fill="#00E5A0" font-weight="bold" text-anchor="middle">Windows Update Error 0xC1900101 — Fix</text>

  <!-- Panel 1: What This Error Means -->
  <rect x="30" y="58" width="225" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="142" y="82" font-family="monospace" font-size="15" fill="#4ade80" font-weight="bold" text-anchor="middle">Error Meaning</text>
  <line x1="50" y1="90" x2="235" y2="90" stroke="#2a5236" stroke-width="1"/>
  <text x="50" y="112" font-family="monospace" font-size="13" fill="#D4EAD8">0xC1900101 is a</text>
  <text x="50" y="130" font-family="monospace" font-size="13" fill="#D4EAD8">driver compatibility</text>
  <text x="50" y="148" font-family="monospace" font-size="13" fill="#D4EAD8">error. An old driver</text>
  <text x="50" y="166" font-family="monospace" font-size="13" fill="#D4EAD8">crashes Windows</text>
  <text x="50" y="184" font-family="monospace" font-size="13" fill="#D4EAD8">during the update</text>
  <text x="50" y="202" font-family="monospace" font-size="13" fill="#D4EAD8">installation phase.</text>
  <text x="50" y="232" font-family="monospace" font-size="12" fill="#A8C4B0">Common culprits:</text>
  <text x="50" y="252" font-family="monospace" font-size="13" fill="#FBB03B">▸ GPU driver (Nvidia,</text>
  <text x="66" y="270" font-family="monospace" font-size="13" fill="#FBB03B">  AMD, Intel)</text>
  <text x="50" y="290" font-family="monospace" font-size="13" fill="#FBB03B">▸ Storage controller</text>
  <text x="50" y="308" font-family="monospace" font-size="13" fill="#FBB03B">▸ Network adapter</text>
  <text x="50" y="326" font-family="monospace" font-size="13" fill="#FBB03B">▸ USB hub controller</text>

  <!-- Panel 2: Fix Steps -->
  <rect x="287" y="58" width="226" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="400" y="82" font-family="monospace" font-size="15" fill="#3b82f6" font-weight="bold" text-anchor="middle">Fix Steps</text>
  <line x1="307" y1="90" x2="493" y2="90" stroke="#2a5236" stroke-width="1"/>
  <text x="307" y="110" font-family="monospace" font-size="13" fill="#D4EAD8">1. Update all drivers</text>
  <text x="323" y="128" font-family="monospace" font-size="12" fill="#A8C4B0">Device Manager → right-</text>
  <text x="323" y="144" font-family="monospace" font-size="12" fill="#A8C4B0">click → Update driver</text>
  <text x="307" y="166" font-family="monospace" font-size="13" fill="#D4EAD8">2. Unplug peripherals</text>
  <text x="323" y="184" font-family="monospace" font-size="12" fill="#A8C4B0">Disconnect USB devices,</text>
  <text x="323" y="200" font-family="monospace" font-size="12" fill="#A8C4B0">external drives, webcam</text>
  <text x="307" y="222" font-family="monospace" font-size="13" fill="#D4EAD8">3. Check Event Viewer</text>
  <text x="323" y="240" font-family="monospace" font-size="12" fill="#00E5A0">eventvwr.msc</text>
  <text x="323" y="258" font-family="monospace" font-size="12" fill="#A8C4B0">Windows Logs → System</text>
  <text x="323" y="274" font-family="monospace" font-size="12" fill="#A8C4B0">Find error near time</text>
  <text x="307" y="296" font-family="monospace" font-size="13" fill="#D4EAD8">4. Free up 20GB+</text>
  <text x="323" y="314" font-family="monospace" font-size="12" fill="#A8C4B0">Disk Cleanup → System</text>
  <text x="323" y="330" font-family="monospace" font-size="12" fill="#A8C4B0">Files (for large updates)</text>
  <text x="307" y="352" font-family="monospace" font-size="13" fill="#D4EAD8">5. Retry Windows Update</text>

  <!-- Panel 3: Sub-error Codes -->
  <rect x="545" y="58" width="225" height="330" fill="#0d1e16" stroke="#2a5236" stroke-width="1.5" rx="8"/>
  <text x="657" y="82" font-family="monospace" font-size="15" fill="#4ade80" font-weight="bold" text-anchor="middle">Sub-Error Codes</text>
  <line x1="565" y1="90" x2="750" y2="90" stroke="#2a5236" stroke-width="1"/>
  <text x="565" y="112" font-family="monospace" font-size="13" fill="#00E5A0">0xC1900101-0x20017</text>
  <text x="565" y="130" font-family="monospace" font-size="12" fill="#A8C4B0">Driver crash — update</text>
  <text x="565" y="148" font-family="monospace" font-size="12" fill="#A8C4B0">GPU + storage drivers</text>
  <text x="565" y="170" font-family="monospace" font-size="13" fill="#00E5A0">0xC1900101-0x30018</text>
  <text x="565" y="188" font-family="monospace" font-size="12" fill="#A8C4B0">Disk space or driver</text>
  <text x="565" y="206" font-family="monospace" font-size="12" fill="#A8C4B0">Free 20GB minimum</text>
  <text x="565" y="228" font-family="monospace" font-size="13" fill="#00E5A0">0xC1900101-0x4000D</text>
  <text x="565" y="246" font-family="monospace" font-size="12" fill="#A8C4B0">Migration failure</text>
  <text x="565" y="264" font-family="monospace" font-size="12" fill="#A8C4B0">Run SFC first</text>
  <text x="565" y="290" font-family="monospace" font-size="12" fill="#FBB03B">All variants roll back</text>
  <text x="565" y="308" font-family="monospace" font-size="12" fill="#FBB03B">to previous Windows</text>
  <text x="565" y="326" font-family="monospace" font-size="12" fill="#FBB03B">automatically after</text>
  <text x="565" y="344" font-family="monospace" font-size="12" fill="#FBB03B">failure — data is safe.</text>

  <!-- Footer -->
  <text x="400" y="410" font-family="monospace" font-size="12" fill="#2a5236" text-anchor="middle">donanimklinik.com — Windows Update Error 0xC1900101 Fix</text>
</svg>
