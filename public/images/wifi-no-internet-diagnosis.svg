<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="WiFi connected but no internet diagnosis: check device only or all devices, then flush DNS, then restart router, then check ISP">
  <defs>
    <pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0"/>
    </marker>
    <marker id="a1r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#091510" rx="12"/>
  <rect width="800" height="500" fill="url(#g1)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">WiFi Connected — No Internet</text>
  <text x="400" y="56" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">Diagnose the cause first — then apply the right fix</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- START node -->
  <rect x="266" y="82" width="268" height="52" fill="#1a0808" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="104" fill="#ef4444" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">WiFi shows Connected</text>
  <text x="400" y="124" fill="#ef4444" font-size="14" font-family="monospace" text-anchor="middle">but no internet access</text>

  <!-- Arrow down -->
  <line x1="400" y1="134" x2="400" y2="162" stroke="#2a5236" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Q1 diamond -->
  <polygon points="400,164 540,200 400,236 260,200" fill="#0d1e16" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="194" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Other devices</text>
  <text x="400" y="214" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle">affected too?</text>

  <!-- YES branch (right) -->
  <line x1="540" y1="200" x2="594" y2="200" stroke="#2a5236" stroke-width="2" marker-end="url(#a1)"/>
  <text x="565" y="190" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">YES</text>
  <rect x="596" y="170" width="182" height="60" fill="#0d1e16" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="687" y="194" fill="#3b82f6" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Router / ISP issue</text>
  <text x="687" y="212" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Restart modem first</text>
  <text x="687" y="228" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">then the router</text>

  <!-- NO branch (left) -->
  <line x1="260" y1="200" x2="206" y2="200" stroke="#2a5236" stroke-width="2" marker-end="url(#a1r)"/>
  <text x="236" y="190" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">NO</text>
  <rect x="22" y="170" width="182" height="60" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="113" y="194" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">This device only</text>
  <text x="113" y="212" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Flush DNS &amp; reset</text>
  <text x="113" y="228" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">network adapter</text>

  <!-- Fix boxes row -->
  <!-- Fix A: DNS flush -->
  <rect x="22" y="260" width="182" height="100" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="113" y="282" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix A — DNS Flush</text>
  <text x="113" y="302" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">CMD as Admin:</text>
  <text x="113" y="320" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">ipconfig /flushdns</text>
  <text x="113" y="338" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">ipconfig /renew</text>
  <text x="113" y="354" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">also: /release before /renew</text>

  <!-- Fix B: Router restart -->
  <rect x="216" y="260" width="182" height="100" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="307" y="282" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix B — Router Reboot</text>
  <text x="307" y="302" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Unplug modem 60s</text>
  <text x="307" y="320" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Plug modem → wait</text>
  <text x="307" y="338" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Then plug router</text>
  <text x="307" y="354" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Wait 2 min to test</text>

  <!-- Fix C: Change DNS -->
  <rect x="410" y="260" width="182" height="100" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="501" y="282" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix C — Change DNS</text>
  <text x="501" y="302" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Network adapter →</text>
  <text x="501" y="320" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">IPv4 properties:</text>
  <text x="501" y="338" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">Primary: 8.8.8.8</text>
  <text x="501" y="354" fill="#93c5fd" font-size="13" font-family="monospace" text-anchor="middle">Secondary: 8.8.4.4</text>

  <!-- Fix D: ISP -->
  <rect x="604" y="260" width="174" height="100" fill="#0d1e16" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="691" y="282" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Fix D — Check ISP</text>
  <text x="691" y="302" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Check outage map</text>
  <text x="691" y="320" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">at carrier website</text>
  <text x="691" y="338" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Call ISP if modem</text>
  <text x="691" y="354" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Online LED blinks</text>

  <!-- Connectors from device-only box to Fix A -->
  <line x1="113" y1="230" x2="113" y2="258" stroke="#2a5236" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Connectors from router/ISP box down -->
  <line x1="687" y1="230" x2="687" y2="248" stroke="#2a5236" stroke-width="1.5"/>
  <line x1="687" y1="248" x2="307" y2="248" stroke="#2a5236" stroke-width="1.5"/>
  <line x1="307" y1="248" x2="307" y2="258" stroke="#2a5236" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="501" y1="248" x2="501" y2="258" stroke="#2a5236" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="687" y1="248" x2="691" y2="258" stroke="#2a5236" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Summary bar -->
  <rect x="22" y="378" width="756" height="56" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="400" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Quick Diagnosis Rule</text>
  <text x="400" y="420" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Only your device affected → start with Fix A (DNS flush) then Fix C (change DNS server)</text>
  <text x="400" y="436" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">All devices affected → Fix B (reboot modem/router) or Fix D (ISP outage)</text>

  <!-- Tip -->
  <rect x="22" y="446" width="756" height="30" fill="#0d1e16" rx="6" stroke="#00E5A0" stroke-width="1.2"/>
  <text x="400" y="466" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Tip: Open CMD and run: ping 8.8.8.8 — if it replies, your connection is fine but DNS is broken → use Fix C</text>
</svg>
