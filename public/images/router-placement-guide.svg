<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Router placement guide: good positions are central elevated open areas, bad positions are corners closets near microwaves or behind TVs">
  <defs>
    <pattern id="rpg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="440" fill="#091510" rx="10"/>
  <rect width="800" height="440" fill="url(#rpg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Router Placement Guide — Good vs Bad</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Correct placement can double your effective WiFi range</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- GOOD placement panel -->
  <rect x="24" y="82" width="376" height="308" fill="#091509" rx="8" stroke="#00E5A0" stroke-width="1.8"/>
  <rect x="24" y="82" width="376" height="36" fill="#0a1f0d" rx="8"/>
  <rect x="24" y="109" width="376" height="9" fill="#0a1f0d"/>
  <circle cx="42" cy="100" r="7" fill="#00E5A0" opacity=".3"/>
  <text x="56" y="105" fill="#00E5A0" font-size="16" font-family="monospace" font-weight="bold">✓  GOOD PLACEMENT</text>

  <!-- Floor plan -->
  <rect x="36" y="126" width="164" height="172" fill="#0d1e16" rx="4" stroke="#1e3a22" stroke-width="1"/>
  <!-- Rooms dividers -->
  <line x1="36" y1="212" x2="200" y2="212" stroke="#1e3a22" stroke-width="1"/>
  <line x1="118" y1="126" x2="118" y2="298" stroke="#1e3a22" stroke-width="1"/>
  <!-- Room labels -->
  <text x="77" y="174" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Living</text>
  <text x="77" y="188" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Room</text>
  <text x="159" y="174" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Bedroom</text>
  <text x="77" y="256" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Kitchen</text>
  <text x="159" y="256" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Office</text>
  <!-- Router at center -->
  <circle cx="118" cy="212" r="13" fill="#00E5A0" opacity=".18" stroke="#00E5A0" stroke-width="1.8"/>
  <rect x="111" y="205" width="14" height="14" fill="#0d1e16" rx="2" stroke="#00E5A0" stroke-width="1.2"/>
  <line x1="115" y1="205" x2="113" y2="198" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="121" y1="205" x2="123" y2="198" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Signal rings -->
  <circle cx="118" cy="212" r="26" fill="none" stroke="#00E5A0" stroke-width="1.2" stroke-dasharray="4,3" opacity=".55"/>
  <circle cx="118" cy="212" r="44" fill="none" stroke="#00E5A0" stroke-width="1" stroke-dasharray="4,4" opacity=".3"/>
  <circle cx="118" cy="212" r="62" fill="none" stroke="#00E5A0" stroke-width="1" stroke-dasharray="3,5" opacity=".14"/>

  <!-- Good points list -->
  <text x="214" y="130" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Why it works:</text>
  <line x1="214" y1="138" x2="392" y2="138" stroke="#1e3a22" stroke-width="1"/>
  <text x="214" y="158" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">✓ Central location</text>
  <text x="214" y="174" fill="#A8C4B0" font-size="13" font-family="monospace">  Equal reach to all rooms</text>
  <text x="214" y="190" fill="#7FB09A" font-size="13" font-family="monospace">  No dead zones in house</text>

  <text x="214" y="212" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">✓ Elevated shelf / desk</text>
  <text x="214" y="228" fill="#A8C4B0" font-size="13" font-family="monospace">  Off floor = fewer obstacles</text>
  <text x="214" y="244" fill="#7FB09A" font-size="13" font-family="monospace">  1-2 meters height is ideal</text>

  <text x="214" y="266" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">✓ Open air — no enclosure</text>
  <text x="214" y="282" fill="#A8C4B0" font-size="13" font-family="monospace">  Ventilation prevents heat</text>
  <text x="214" y="298" fill="#7FB09A" font-size="13" font-family="monospace">  Heat degrades performance</text>

  <text x="214" y="320" fill="#00E5A0" font-size="14" font-family="monospace" font-weight="bold">✓ Away from other devices</text>
  <text x="214" y="336" fill="#A8C4B0" font-size="13" font-family="monospace">  No microwave, cordless phone</text>
  <text x="214" y="352" fill="#7FB09A" font-size="13" font-family="monospace">  or metal objects nearby</text>
  <text x="214" y="374" fill="#A8C4B0" font-size="13" font-family="monospace">  Antennas: vertical = best omni</text>

  <!-- BAD placement panel -->
  <rect x="412" y="82" width="364" height="308" fill="#180a09" rx="8" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="412" y="82" width="364" height="36" fill="#1a0b0a" rx="8"/>
  <rect x="412" y="109" width="364" height="9" fill="#1a0b0a"/>
  <circle cx="430" cy="100" r="7" fill="#ef4444" opacity=".3"/>
  <text x="444" y="105" fill="#ef4444" font-size="16" font-family="monospace" font-weight="bold">✕  BAD PLACEMENT</text>

  <!-- Bad scenario 1: corner -->
  <rect x="424" y="126" width="82" height="82" fill="#0d1e16" rx="4" stroke="#2d1810" stroke-width="1"/>
  <text x="465" y="146" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Floor plan</text>
  <!-- corner with router -->
  <rect x="428" y="162" width="36" height="36" fill="#1a0b0a" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="431" y="165" width="12" height="12" fill="#0d1e16" rx="1" stroke="#ef4444"/>
  <line x1="434" y1="165" x2="432" y2="159" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="440" y1="165" x2="442" y2="159" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="436" cy="174" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" opacity=".5"/>
  <text x="465" y="220" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">Corner / edge</text>

  <!-- Bad scenario 2: microwave -->
  <rect x="516" y="126" width="82" height="82" fill="#0d1e16" rx="4" stroke="#2d1810" stroke-width="1"/>
  <rect x="530" y="142" width="54" height="36" fill="#1a0b0a" rx="3" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="557" y="158" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">µwave</text>
  <text x="557" y="172" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">2.4 GHz!</text>
  <line x1="557" y1="180" x2="557" y2="196" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,1"/>
  <text x="557" y="220" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">Near microwave</text>

  <!-- Bad scenario 3: cabinet -->
  <rect x="608" y="126" width="82" height="82" fill="#0d1e16" rx="4" stroke="#2d1810" stroke-width="1"/>
  <rect x="622" y="134" width="54" height="56" fill="#0d1e16" rx="3" stroke="#A8C4B0" stroke-width="1.2"/>
  <line x1="649" y1="134" x2="649" y2="190" stroke="#7FB09A" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="626" y="148" width="16" height="26" fill="#0d1e16" rx="1" stroke="#1e3a22"/>
  <text x="649" y="220" fill="#ef4444" font-size="13" font-family="monospace" text-anchor="middle">In a cabinet</text>

  <!-- Bad details list -->
  <text x="428" y="238" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Why it fails:</text>
  <line x1="428" y1="246" x2="768" y2="246" stroke="#1e3a22" stroke-width="1"/>

  <text x="428" y="266" fill="#ef4444" font-size="14" font-family="monospace" font-weight="bold">✕ Corner of a room</text>
  <text x="428" y="282" fill="#A8C4B0" font-size="13" font-family="monospace">  Wastes 75% of signal into walls</text>

  <text x="428" y="302" fill="#ef4444" font-size="14" font-family="monospace" font-weight="bold">✕ Near microwave / cordless phone</text>
  <text x="428" y="318" fill="#A8C4B0" font-size="13" font-family="monospace">  2.4 GHz interference, drops WiFi</text>

  <text x="428" y="338" fill="#ef4444" font-size="14" font-family="monospace" font-weight="bold">✕ Inside cabinet or behind TV</text>
  <text x="428" y="354" fill="#A8C4B0" font-size="13" font-family="monospace">  Blocks signal, causes overheating</text>

  <text x="428" y="374" fill="#ef4444" font-size="14" font-family="monospace" font-weight="bold">✕ On the floor or behind thick walls</text>
  <text x="428" y="384" fill="#A8C4B0" font-size="13" font-family="monospace">  Signal attenuated, weak coverage</text>

  <!-- Bottom tip -->
  <rect x="24" y="402" width="752" height="30" fill="#0d1e16" rx="6" stroke="#2a5236"/>
  <text x="40" y="416" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Rule of thumb:</text>
  <text x="168" y="416" fill="#D4EAD8" font-size="14" font-family="monospace">Place router in the center of where you use WiFi most — living room or hallway usually works best</text>
  <text x="40" y="426" fill="#7FB09A" font-size="13" font-family="monospace">If coverage is still poor, consider a WiFi extender or mesh system for large or multi-floor homes</text>
</svg>
