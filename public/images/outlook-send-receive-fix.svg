<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Outlook send receive not working: F9 shortcut forces manual send and receive, check send receive groups settings, disable antivirus email scanning if blocking connection">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="12"/>
  <rect width="800" height="420" fill="url(#g)" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Outlook Send/Receive Not Working — Fixes</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Panel 1: F9 Force Sync -->
  <rect x="20" y="60" width="234" height="220" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="137" y="86" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">① F9 — Force Sync</text>
  <line x1="36" y1="96" x2="238" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="137" y="148" fill="#00E5A0" font-size="52" font-family="monospace" text-anchor="middle" font-weight="bold">F9</text>
  <text x="137" y="182" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Manually triggers</text>
  <text x="137" y="202" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Send/Receive All</text>
  <text x="137" y="226" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Try this first —</text>
  <text x="137" y="244" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Ctrl+Alt+S for groups</text>
  <text x="137" y="264" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Status bar: "Connected" = OK</text>

  <!-- Panel 2: Antivirus Blocking -->
  <rect x="283" y="60" width="234" height="220" fill="#0d1e16" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="86" fill="#f59e0b" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">② Antivirus Blocking</text>
  <line x1="299" y1="96" x2="501" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="400" y="120" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Antivirus tools can</text>
  <text x="400" y="140" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">scan email in transit</text>
  <text x="400" y="162" fill="#f59e0b" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">→ Disable email scan</text>
  <text x="400" y="182" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Open AV settings →</text>
  <text x="400" y="200" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Email Protection →</text>
  <text x="400" y="218" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">turn off email scan</text>
  <text x="400" y="240" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">Test: disable AV → retry</text>
  <text x="400" y="258" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">If fixed: keep scan off</text>
  <text x="400" y="276" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">or switch AV product</text>

  <!-- Panel 3: Profile Repair -->
  <rect x="546" y="60" width="234" height="220" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="663" y="86" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">③ Profile Repair</text>
  <line x1="562" y1="96" x2="764" y2="96" stroke="#1e3a22" stroke-width="1"/>
  <text x="663" y="120" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Outlook profile</text>
  <text x="663" y="140" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">corrupts over time</text>
  <text x="663" y="162" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Control Panel →</text>
  <text x="663" y="180" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Mail → Show Profiles</text>
  <text x="663" y="200" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ Add new profile</text>
  <text x="663" y="220" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ re-add email account</text>
  <text x="663" y="244" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">New profile removes</text>
  <text x="663" y="262" fill="#7FB09A" font-size="12" font-family="monospace" text-anchor="middle">all old corruption</text>

  <!-- Divider -->
  <line x1="40" y1="300" x2="760" y2="300" stroke="#1e3a22" stroke-width="1"/>

  <!-- Bottom diagnostic panel -->
  <rect x="20" y="312" width="760" height="90" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1"/>
  <text x="400" y="336" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Diagnostic Tips</text>
  <line x1="36" y1="346" x2="764" y2="346" stroke="#1e3a22" stroke-width="1"/>

  <text x="46" y="368" fill="#D4EAD8" font-size="14" font-family="monospace">Status bar:</text>
  <text x="46" y="388" fill="#A8C4B0" font-size="13" font-family="monospace">"Connected to Microsoft Exchange" = OK · "Disconnected" = network issue · "Working Offline" = manual mode</text>

  <text x="46" y="362" fill="#D4EAD8" font-size="14" font-family="monospace" dy="30"> </text>
  <text x="46" y="395" fill="#7FB09A" font-size="12" font-family="monospace">Safe Mode: Run outlook.exe /safe to rule out add-in conflicts causing send/receive failure</text>
</svg>
