<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Where to find your BitLocker recovery key: 5 locations — Microsoft account online, Azure AD admin center, Active Directory, USB drive, and printed paper">
  <defs>
    <pattern id="g5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#00E5A0" opacity="0.8"/>
    </marker>
    <marker id="a5b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0,9 4.5,0 9" fill="#3b82f6" opacity="0.8"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#091510" rx="12"/>
  <rect width="800" height="440" fill="url(#g5)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">Where Is Your BitLocker Recovery Key?</text>
  <line x1="40" y1="46" x2="760" y2="46" stroke="#1e3a22" stroke-width="1"/>

  <!-- Central hub -->
  <circle cx="400" cy="200" r="44" fill="#0d1e16" stroke="#00E5A0" stroke-width="2"/>
  <text x="400" y="190" fill="#00E5A0" font-size="26" text-anchor="middle">🔑</text>
  <text x="400" y="210" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">48-digit</text>
  <text x="400" y="226" fill="#A8C4B0" font-size="12" font-family="monospace" text-anchor="middle">recovery key</text>

  <!-- Location 1: Microsoft Account (top left) -->
  <rect x="18" y="60" width="230" height="110" fill="#0d1e16" rx="10" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="133" y="85" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">① Microsoft Account</text>
  <text x="133" y="107" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">account.microsoft.com</text>
  <text x="133" y="127" fill="#4ade80" font-size="13" font-family="monospace" text-anchor="middle">Devices → Recovery keys</text>
  <text x="133" y="147" fill="#00E5A0" font-size="13" font-family="monospace" text-anchor="middle">✓ Most common location</text>
  <line x1="248" y1="115" x2="358" y2="170" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Location 2: Azure AD (top right) -->
  <rect x="552" y="60" width="230" height="110" fill="#0d1e16" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="667" y="85" fill="#3b82f6" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">② Azure AD / Entra</text>
  <text x="667" y="107" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Work or school device</text>
  <text x="667" y="127" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">IT Admin holds the key</text>
  <text x="667" y="147" fill="#f59e0b" font-size="13" font-family="monospace" text-anchor="middle">⚠ Contact IT dept first</text>
  <line x1="552" y1="115" x2="442" y2="170" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5b)"/>

  <!-- Location 3: Active Directory (middle left) -->
  <rect x="18" y="248" width="230" height="100" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="133" y="272" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">③ Active Directory</text>
  <text x="133" y="294" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Domain-joined PC</text>
  <text x="133" y="313" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">ADUC → Computer</text>
  <text x="133" y="331" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">→ BitLocker Recovery tab</text>
  <line x1="248" y1="280" x2="358" y2="232" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Location 4: USB Drive (middle right) -->
  <rect x="552" y="248" width="230" height="100" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="667" y="272" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">④ USB Drive</text>
  <text x="667" y="294" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">If saved during setup</text>
  <text x="667" y="313" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">File: BitLocker Recovery</text>
  <text x="667" y="331" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Key [ID].txt</text>
  <line x1="552" y1="280" x2="442" y2="232" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Location 5: Print / File (bottom center) -->
  <rect x="230" y="370" width="340" height="58" fill="#0d1e16" rx="10" stroke="#2a5236" stroke-width="1.5"/>
  <text x="400" y="394" fill="#4ade80" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">⑤ Printed Copy or .txt File</text>
  <text x="400" y="416" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Saved at time of BitLocker setup</text>
  <line x1="400" y1="244" x2="400" y2="370" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>
</svg>
