<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" role="img" aria-label="How to access router settings: step 1 connect to router WiFi or cable, step 2 open browser and type 192.168.1.1, step 3 login with admin credentials to reach settings panel">
  <defs>
    <pattern id="rag" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width=".7"/>
    </pattern>
    <marker id="raa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity=".7"/>
    </marker>
  </defs>
  <rect width="780" height="210" fill="#0A130E" rx="10"/>
  <rect width="780" height="210" fill="url(#rag)" rx="10"/>
  <text x="390" y="20" fill="#4a5e4e" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">HOW TO ACCESS ROUTER SETTINGS</text>

  <!-- ── STEP 1: Connect ── -->
  <rect x="20" y="32" width="170" height="162" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <rect x="20" y="32" width="170" height="24" fill="#0a1509" rx="8"/>
  <rect x="20" y="47" width="170" height="9" fill="#0a1509"/>
  <text x="105" y="47" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">STEP 1</text>

  <!-- WiFi symbol -->
  <path d="M105 95 Q85 75 65 95" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  <path d="M105 95 Q85 68 65 95" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity=".15"/>
  <path d="M97 95 Q85 80 73 95" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path d="M91 95 Q85 85 79 95" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <circle cx="85" cy="99" r="3" fill="#3b82f6"/>
  <text x="85" y="116" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">Connect to</text>
  <text x="85" y="128" fill="#F0F4F1" font-size="8.5" font-family="monospace" text-anchor="middle">router WiFi</text>

  <!-- OR cable -->
  <text x="85" y="143" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">— or —</text>
  <line x1="52" y1="152" x2="118" y2="152" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="48" y="149" width="8" height="6" fill="#2563eb" rx="1"/>
  <rect x="116" y="149" width="8" height="6" fill="#2563eb" rx="1"/>
  <text x="85" y="168" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">Ethernet cable</text>
  <text x="85" y="179" fill="#6B7F72" font-size="8" font-family="monospace" text-anchor="middle">to LAN port</text>

  <!-- Arrow 1→2 -->
  <line x1="194" y1="113" x2="214" y2="113" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#raa)"/>

  <!-- ── STEP 2: Browser ── -->
  <rect x="218" y="32" width="198" height="162" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <rect x="218" y="32" width="198" height="24" fill="#0a1509" rx="8"/>
  <rect x="218" y="47" width="198" height="9" fill="#0a1509"/>
  <text x="317" y="47" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">STEP 2</text>

  <!-- Browser window -->
  <rect x="230" y="62" width="174" height="110" fill="#0A130E" rx="5" stroke="#1e3a22"/>
  <rect x="230" y="62" width="174" height="18" fill="#0d1810" rx="5"/>
  <rect x="230" y="73" width="174" height="7" fill="#0d1810"/>
  <!-- traffic lights -->
  <circle cx="243" cy="71" r="3" fill="#ef4444" opacity=".5"/>
  <circle cx="252" cy="71" r="3" fill="#f59e0b" opacity=".5"/>
  <circle cx="261" cy="71" r="3" fill="#00E5A0" opacity=".5"/>
  <!-- address bar -->
  <rect x="270" y="64" width="120" height="12" fill="#0A130E" rx="3" stroke="#243d28"/>
  <text x="330" y="73" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">192.168.1.1</text>
  <!-- Page content: common gateway IPs -->
  <text x="317" y="94" fill="#6B7F72" font-size="7.5" font-family="monospace" text-anchor="middle">Common gateway IPs:</text>
  <rect x="240" y="98" width="154" height="11" fill="#0d1810" rx="2" stroke="#00E5A0" stroke-width="1"/>
  <text x="317" y="107" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">192.168.1.1</text>
  <rect x="240" y="112" width="154" height="11" fill="#0d1810" rx="2" stroke="#1e3a22"/>
  <text x="317" y="121" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">192.168.0.1</text>
  <rect x="240" y="126" width="154" height="11" fill="#0d1810" rx="2" stroke="#1e3a22"/>
  <text x="317" y="135" fill="#4a5e4e" font-size="8" font-family="monospace" text-anchor="middle">192.168.10.1</text>
  <text x="317" y="162" fill="#4a5e4e" font-size="7" font-family="monospace" text-anchor="middle">Check label on router bottom</text>

  <!-- Tip box -->
  <rect x="230" y="175" width="174" height="14" fill="#0a1509" rx="2" stroke="#1e3a22"/>
  <text x="317" y="185" fill="#6B7F72" font-size="7" font-family="monospace" text-anchor="middle">Can't connect? Try routerlogin.net</text>

  <!-- Arrow 2→3 -->
  <line x1="420" y1="113" x2="440" y2="113" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#raa)"/>

  <!-- ── STEP 3: Login form ── -->
  <rect x="444" y="32" width="178" height="162" fill="#0d1810" rx="8" stroke="#1e3a22" stroke-width="1.2"/>
  <rect x="444" y="32" width="178" height="24" fill="#0a1509" rx="8"/>
  <rect x="444" y="47" width="178" height="9" fill="#0a1509"/>
  <text x="533" y="47" fill="#00E5A0" font-size="9" font-family="monospace" text-anchor="middle">STEP 3</text>

  <!-- Login form -->
  <rect x="456" y="62" width="154" height="84" fill="#0A130E" rx="4" stroke="#1e3a22"/>
  <text x="533" y="77" fill="#F0F4F1" font-size="9" font-family="monospace" text-anchor="middle">Router Login</text>
  <line x1="456" y1="83" x2="610" y2="83" stroke="#1e3a22" stroke-width="1"/>
  <text x="466" y="96" fill="#6B7F72" font-size="7.5" font-family="monospace">Username</text>
  <rect x="516" y="89" width="86" height="10" fill="#111e14" rx="2" stroke="#243d28"/>
  <text x="559" y="97" fill="#F0F4F1" font-size="7" font-family="monospace" text-anchor="middle">admin</text>
  <text x="466" y="111" fill="#6B7F72" font-size="7.5" font-family="monospace">Password</text>
  <rect x="516" y="104" width="86" height="10" fill="#111e14" rx="2" stroke="#243d28"/>
  <text x="559" y="112" fill="#F0F4F1" font-size="7" font-family="monospace" text-anchor="middle">••••••••</text>
  <rect x="490" y="122" width="86" height="12" fill="#00E5A0" rx="3" opacity=".85"/>
  <text x="533" y="131" fill="#0A130E" font-size="8" font-family="monospace" text-anchor="middle" font-weight="bold">Login</text>

  <!-- Default creds note -->
  <text x="456" y="160" fill="#f59e0b" font-size="7.5" font-family="monospace">⚠  Default creds on</text>
  <text x="456" y="171" fill="#f59e0b" font-size="7.5" font-family="monospace">   router's label</text>
  <text x="456" y="182" fill="#6B7F72" font-size="7" font-family="monospace">   Often: admin / admin</text>
  <text x="456" y="192" fill="#6B7F72" font-size="7" font-family="monospace">   or admin / password</text>

  <!-- Arrow 3→4 -->
  <line x1="626" y1="113" x2="646" y2="113" stroke="#1e3a22" stroke-width="1.5" marker-end="url(#raa)"/>

  <!-- ── RESULT: Settings panel ── -->
  <rect x="650" y="32" width="110" height="162" fill="#0d1a12" rx="8" stroke="#00E5A0" stroke-width="2"/>
  <rect x="650" y="32" width="110" height="24" fill="#0a1f12" rx="8"/>
  <rect x="650" y="47" width="110" height="9" fill="#0a1f12"/>
  <text x="705" y="47" fill="#00E5A0" font-size="8" font-family="monospace" text-anchor="middle">YOU'RE IN</text>

  <!-- Admin panel icon -->
  <rect x="660" y="62" width="90" height="120" fill="#0A130E" rx="4" stroke="#1e3a22"/>
  <!-- Sidebar nav items -->
  <rect x="662" y="66" width="24" height="108" fill="#0d1810" rx="2" stroke="#1e3a22"/>
  <text x="674" y="80" fill="#4a5e4e" font-size="5.5" font-family="monospace" text-anchor="middle">WiFi</text>
  <text x="674" y="93" fill="#4a5e4e" font-size="5.5" font-family="monospace" text-anchor="middle">WAN</text>
  <text x="674" y="106" fill="#4a5e4e" font-size="5.5" font-family="monospace" text-anchor="middle">LAN</text>
  <text x="674" y="119" fill="#4a5e4e" font-size="5.5" font-family="monospace" text-anchor="middle">DNS</text>
  <text x="674" y="132" fill="#4a5e4e" font-size="5.5" font-family="monospace" text-anchor="middle">FW</text>
  <rect x="662" y="63" width="24" height="16" fill="#00E5A0" rx="2" opacity=".15" stroke="#00E5A0" stroke-width="1"/>
  <!-- Main content area -->
  <rect x="690" y="66" width="58" height="14" fill="#111e14" rx="2" stroke="#243d28"/>
  <text x="719" y="76" fill="#F0F4F1" font-size="5.5" font-family="monospace" text-anchor="middle">Wireless Settings</text>
  <rect x="690" y="84" width="58" height="7" fill="#0d1810" rx="1" stroke="#1e3a22"/>
  <rect x="690" y="94" width="58" height="7" fill="#0d1810" rx="1" stroke="#1e3a22"/>
  <rect x="690" y="104" width="58" height="7" fill="#0d1810" rx="1" stroke="#1e3a22"/>
  <rect x="690" y="114" width="58" height="7" fill="#0d1810" rx="1" stroke="#1e3a22"/>
  <rect x="690" y="158" width="58" height="10" fill="#00E5A0" rx="3" opacity=".8"/>
  <text x="719" y="165" fill="#0A130E" font-size="5.5" font-family="monospace" text-anchor="middle" font-weight="bold">Apply</text>

  <circle cx="736" cy="195" r="8" fill="#00E5A0" opacity=".15" stroke="#00E5A0" stroke-width="1"/>
  <text x="736" y="199" fill="#00E5A0" font-size="10" text-anchor="middle">✓</text>
</svg>
