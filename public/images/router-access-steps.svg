<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="How to access router settings: step 1 connect to router WiFi or cable, step 2 open browser and type 192.168.1.1, step 3 login with admin credentials to reach settings panel">
  <defs>
    <pattern id="rag" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#111e14" stroke-width="0.6"/>
    </pattern>
    <marker id="raa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0,8 4,0 8" fill="#00E5A0" opacity=".8"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#091510" rx="10"/>
  <rect width="800" height="420" fill="url(#rag)" rx="10"/>

  <!-- Title -->
  <text x="400" y="36" fill="#00E5A0" font-size="20" font-family="monospace" text-anchor="middle" font-weight="bold">How to Access Router Settings</text>
  <text x="400" y="58" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">3 steps to open the router admin panel from any browser</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e3a22" stroke-width="1"/>

  <!-- STEP 1: Connect -->
  <rect x="24" y="82" width="190" height="280" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <rect x="24" y="82" width="190" height="34" fill="#0a1509" rx="8"/>
  <rect x="24" y="108" width="190" height="8" fill="#0a1509"/>
  <text x="119" y="105" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Step 1</text>

  <!-- WiFi icon -->
  <path d="M119 168 Q95 148 71 168" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
  <path d="M119 168 Q95 142 71 168" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity=".18"/>
  <path d="M111 168 Q95 152 79 168" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
  <path d="M105 168 Q95 158 85 168" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
  <circle cx="95" cy="173" r="5" fill="#3b82f6"/>

  <text x="119" y="200" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Connect to</text>
  <text x="119" y="218" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">router WiFi</text>
  <text x="119" y="240" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">— or —</text>

  <!-- Ethernet cable icon -->
  <line x1="68" y1="260" x2="170" y2="260" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="62" y="256" width="10" height="8" fill="#2563eb" rx="1"/>
  <rect x="168" y="256" width="10" height="8" fill="#2563eb" rx="1"/>
  <text x="119" y="282" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Ethernet cable</text>
  <text x="119" y="298" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">to LAN port</text>

  <text x="119" y="330" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">Either method works</text>
  <text x="119" y="346" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">Cable is more reliable</text>

  <!-- Arrow 1→2 -->
  <line x1="217" y1="222" x2="240" y2="222" stroke="#1e3a22" stroke-width="2" marker-end="url(#raa)"/>

  <!-- STEP 2: Browser -->
  <rect x="244" y="82" width="216" height="280" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <rect x="244" y="82" width="216" height="34" fill="#0a1509" rx="8"/>
  <rect x="244" y="108" width="216" height="8" fill="#0a1509"/>
  <text x="352" y="105" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Step 2</text>

  <!-- Browser window -->
  <rect x="256" y="122" width="192" height="148" fill="#091510" rx="5" stroke="#1e3a22"/>
  <rect x="256" y="122" width="192" height="24" fill="#0d1e16" rx="5"/>
  <rect x="256" y="137" width="192" height="9" fill="#0d1e16"/>
  <circle cx="270" cy="134" r="4" fill="#ef4444" opacity=".5"/>
  <circle cx="283" cy="134" r="4" fill="#f59e0b" opacity=".5"/>
  <circle cx="296" cy="134" r="4" fill="#00E5A0" opacity=".5"/>
  <!-- address bar -->
  <rect x="308" y="126" width="130" height="18" fill="#091510" rx="3" stroke="#2a5236"/>
  <text x="373" y="139" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">192.168.1.1</text>

  <!-- Common gateway IPs list -->
  <text x="352" y="167" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Common gateway IPs:</text>
  <rect x="264" y="174" width="176" height="20" fill="#0d1e16" rx="3" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="352" y="188" fill="#00E5A0" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">192.168.1.1</text>
  <rect x="264" y="198" width="176" height="18" fill="#0d1e16" rx="3" stroke="#1e3a22"/>
  <text x="352" y="211" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">192.168.0.1</text>
  <rect x="264" y="220" width="176" height="18" fill="#0d1e16" rx="3" stroke="#1e3a22"/>
  <text x="352" y="233" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">192.168.10.1</text>
  <text x="352" y="257" fill="#7FB09A" font-size="13" font-family="monospace" text-anchor="middle">Check label on router bottom</text>

  <!-- Tip box -->
  <rect x="256" y="268" width="192" height="22" fill="#091510" rx="3" stroke="#1e3a22"/>
  <text x="352" y="283" fill="#A8C4B0" font-size="13" font-family="monospace" text-anchor="middle">Can't connect? Try routerlogin.net</text>

  <text x="352" y="324" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">Open browser, type IP</text>
  <text x="352" y="342" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle">address in URL bar</text>

  <!-- Arrow 2→3 -->
  <line x1="463" y1="222" x2="486" y2="222" stroke="#1e3a22" stroke-width="2" marker-end="url(#raa)"/>

  <!-- STEP 3: Login form -->
  <rect x="490" y="82" width="200" height="280" fill="#0d1e16" rx="8" stroke="#2a5236" stroke-width="1.2"/>
  <rect x="490" y="82" width="200" height="34" fill="#0a1509" rx="8"/>
  <rect x="490" y="108" width="200" height="8" fill="#0a1509"/>
  <text x="590" y="105" fill="#00E5A0" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">Step 3</text>

  <!-- Login form -->
  <rect x="502" y="122" width="176" height="108" fill="#091510" rx="4" stroke="#1e3a22"/>
  <text x="590" y="142" fill="#D4EAD8" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">Router Login</text>
  <line x1="502" y1="150" x2="678" y2="150" stroke="#1e3a22" stroke-width="1"/>
  <text x="514" y="170" fill="#A8C4B0" font-size="13" font-family="monospace">Username</text>
  <rect x="582" y="159" width="88" height="18" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="626" y="172" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">admin</text>
  <text x="514" y="196" fill="#A8C4B0" font-size="13" font-family="monospace">Password</text>
  <rect x="582" y="185" width="88" height="18" fill="#0d1e16" rx="2" stroke="#2a5236"/>
  <text x="626" y="198" fill="#D4EAD8" font-size="13" font-family="monospace" text-anchor="middle">••••••••</text>
  <rect x="536" y="212" width="108" height="18" fill="#00E5A0" rx="3" opacity=".9"/>
  <text x="590" y="224" fill="#091510" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">Login</text>

  <!-- Default creds warning -->
  <rect x="502" y="240" width="176" height="64" fill="#1a1400" rx="4" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="514" y="258" fill="#f59e0b" font-size="13" font-family="monospace">Default credentials:</text>
  <text x="514" y="276" fill="#D4EAD8" font-size="14" font-family="monospace">admin / admin</text>
  <text x="514" y="294" fill="#D4EAD8" font-size="14" font-family="monospace">admin / password</text>
  <text x="514" y="312" fill="#7FB09A" font-size="13" font-family="monospace">See label on router bottom</text>

  <!-- Arrow 3→4 -->
  <line x1="693" y1="222" x2="716" y2="222" stroke="#1e3a22" stroke-width="2" marker-end="url(#raa)"/>

  <!-- RESULT: Admin panel -->
  <rect x="720" y="82" width="56" height="280" fill="#0d1e16" rx="8" stroke="#00E5A0" stroke-width="2"/>
  <rect x="720" y="82" width="56" height="34" fill="#0a1f12" rx="8"/>
  <rect x="720" y="108" width="56" height="8" fill="#0a1f12"/>
  <text x="748" y="104" fill="#00E5A0" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">IN</text>

  <!-- Admin panel mini -->
  <rect x="724" y="124" width="48" height="146" fill="#091510" rx="3" stroke="#1e3a22"/>
  <rect x="727" y="128" width="16" height="134" fill="#0d1e16" rx="2" stroke="#1e3a22"/>
  <text x="735" y="144" fill="#A8C4B0" font-size="10" font-family="monospace" text-anchor="middle">WiFi</text>
  <text x="735" y="158" fill="#A8C4B0" font-size="10" font-family="monospace" text-anchor="middle">WAN</text>
  <text x="735" y="172" fill="#A8C4B0" font-size="10" font-family="monospace" text-anchor="middle">LAN</text>
  <text x="735" y="186" fill="#A8C4B0" font-size="10" font-family="monospace" text-anchor="middle">DNS</text>
  <rect x="727" y="124" width="16" height="18" fill="#00E5A0" rx="2" opacity=".2" stroke="#00E5A0" stroke-width="1"/>
  <rect x="746" y="128" width="24" height="12" fill="#0d1e16" rx="1" stroke="#2a5236"/>
  <rect x="746" y="144" width="24" height="8" fill="#0d1e16" rx="1" stroke="#1e3a22"/>
  <rect x="746" y="156" width="24" height="8" fill="#0d1e16" rx="1" stroke="#1e3a22"/>
  <rect x="746" y="168" width="24" height="8" fill="#0d1e16" rx="1" stroke="#1e3a22"/>
  <rect x="746" y="248" width="24" height="12" fill="#00E5A0" rx="2" opacity=".85"/>

  <circle cx="748" cy="292" r="12" fill="#00E5A0" opacity=".15" stroke="#00E5A0" stroke-width="1.5"/>
  <text x="748" y="297" fill="#00E5A0" font-size="16" text-anchor="middle">✓</text>

  <!-- Bottom tip -->
  <rect x="24" y="378" width="752" height="32" fill="#0d1e16" rx="6" stroke="#2a5236"/>
  <text x="40" y="392" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">Tip:</text>
  <text x="82" y="392" fill="#D4EAD8" font-size="14" font-family="monospace">If the login page doesn't load, make sure you're connected to the router's own WiFi or via Ethernet</text>
  <text x="40" y="404" fill="#7FB09A" font-size="13" font-family="monospace">Also try: routerlogin.net, routerlogin.com, or 192.168.0.1 depending on your router brand</text>
</svg>
